  /* 화면 아래에 늘 붙어 있던 이전/다음 장 버튼 대신, 화면을 좌우로 밀어서 장을 넘긴다
     (왼쪽으로 밀면 다음 장, 오른쪽으로 밀면 이전 장 — 책장을 넘기는 방향). 세로 스크롤과
     헷갈리지 않도록 가로로 충분히(70px 이상), 그리고 세로보다 확실히 더 많이 움직였을 때만
     넘긴다. 오디오바·선택바·입력칸·모달 위에서 시작한 손짓은 무시한다. */
  var swipeStart = null;
  function onSwipeStart(e){
    if(!e.touches || e.touches.length !== 1){ swipeStart = null; return; }
    var t = e.target;
    if(t && t.closest && t.closest(".audio-bar, .selection-bar, .modal-backdrop, input, textarea, select, header, audio")){ swipeStart = null; return; }
    swipeStart = {x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now()};
  }
  function onSwipeEnd(e){
    if(!swipeStart) return;
    var start = swipeStart; swipeStart = null;
    var touch = e.changedTouches && e.changedTouches[0];
    if(!touch) return;
    var dx = touch.clientX - start.x, dy = touch.clientY - start.y;
    if(Date.now() - start.t > 900) return;
    if(Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
    swipeToChapter(dx < 0 ? 1 : -1);
  }
  document.addEventListener("touchstart", onSwipeStart, {passive:true});
  document.addEventListener("touchend", onSwipeEnd, {passive:true});
  state._swipeHandlers = {start:onSwipeStart, end:onSwipeEnd};
  /* 처음 몇 번은 좌우 밀기로 장을 넘길 수 있다는 걸 알려준다 */
  var swipeHintCount = lsGet(LS_SWIPEHINT, 0);
  if(swipeHintCount < 2){
    lsSet(LS_SWIPEHINT, swipeHintCount + 1);
    setTimeout(function(){ showToast("👈 좌우로 밀어서 이전·다음 장으로 넘길 수 있어요 👉"); }, 400);
  }

  var shouldAutoplay = !!state._pendingAutoplay;
  state._pendingAutoplay = false;
  var forBook = state.book, forChapter = state.chapter;
  getAudioFile(state.book, state.chapter).then(function(audioFile){
    /* 오디오를 찾는 사이에 사용자가 이미 다른 장으로 넘어갔으면 이 결과는 버린다 */
    if(state.book !== forBook || state.chapter !== forChapter || state.screen !== "reading") return;
    var audio = getPlayerEl();
    if(audioFile){
      /* 이미 이 장을 재생 중이면(화면이 꺼진 동안 다음 장으로 넘어간 경우 등) 그대로 이어서 들려준다 */
      if(player.book !== forBook || player.chapter !== forChapter){
        if(!audio.paused) audio.pause();
        loadPlayerChapter(forBook, forChapter, audioFile);
        if(shouldAutoplay){ var pp = audio.play(); if(pp && pp.catch) pp.catch(function(){}); }
      }
      var bar = el("div",{class:"audio-bar"});
      bar.appendChild(audio); /* 오디오는 화면이 바뀌어도 하나를 계속 쓴다(옮겨 붙이기만 함) */
      bar.appendChild(setupAudioFollow(audio, audioFile, forBook, forChapter));
      document.body.appendChild(bar);
      state._audioBarEl = bar;
      positionSelBar();
    } else {
      /* 이 장은 오디오가 없다 — 다른 장을 재생하던 중이었으면 멈춘다 */
      if(player.book !== null && (player.book !== forBook || player.chapter !== forChapter)){ audio.pause(); }
      if(state._audioBarEl){ state._audioBarEl.remove(); state._audioBarEl = null; positionSelBar(); }
    }
  });
}

/* ---------- 오디오 플레이어 (화면이 꺼져도 계속 듣기) ----------
   예전에는 장을 넘길 때마다 오디오를 새로 만들고 지웠는데, 화면이 꺼진 상태에서는 휴대폰이
   "새로 만든 오디오의 자동 재생"을 막아서 한 장이 끝나면 소리가 멈췄다. 이제는 오디오 하나를
   앱이 켜져 있는 동안 계속 살려 두고, 한 장이 끝나면 그 오디오에 다음 장 파일만 바꿔 끼워
   바로 이어서 재생한다(화면이 꺼져 있어도). 잠금화면·알림창에는 "창세기 2장" 제목과
   재생/일시정지/이전 장/다음 장 버튼이 나온다(Media Session). */
var player = { el:null, holder:null, book:null, chapter:null, url:null, file:null, next:null, prefetching:false };
function getPlayerEl(){
  if(player.el) return player.el;
  var a = document.createElement("audio");
  a.controls = true; a.preload = "auto";
  a.setAttribute("playsinline", "");
  a.playbackRate = state.audioRate || 1;
  /* 사용자가 재생 속도를 바꾸면(브라우저 기본 컨트롤의 배속 메뉴 등) 다음 장에도 그대로 이어서 적용 */
  a.addEventListener("ratechange", function(){
    if(a.playbackRate && a.playbackRate !== state.audioRate){ state.audioRate = a.playbackRate; lsSet(LS_AUDIORATE, state.audioRate); }
  });
  a.addEventListener("loadedmetadata", function(){ a.playbackRate = state.audioRate || 1; });
  a.addEventListener("ended", function(){
    /* 미리 받아 둔 다음 장이 있으면 기다림 없이 즉시 바꿔 끼워 재생(화면 꺼짐 상태에서 가장 확실) */
    var n = player.next;
    if(n && n.fromBook === player.book && n.fromChapter === player.chapter && n.file){
      var fromBook = player.book, fromChapter = player.chapter;
      loadPlayerChapter(n.book, n.chapter, n.file);
      var pp = a.play(); if(pp && pp.catch) pp.catch(function(){});
      followPlayerOnScreen(fromBook, fromChapter, 1);
      return;
    }
    playerStep(1, true);
  });
  /* 혹시 처음 미리 받기가 실패했으면 재생 중에 다시 시도(화면이 켜져 있을 때의 보조 장치) */
  a.addEventListener("timeupdate", function(){ prefetchNextChapter(); });
  a.addEventListener("play", function(){ if("mediaSession" in navigator) try{ navigator.mediaSession.playbackState = "playing"; }catch(e){} });
  a.addEventListener("pause", function(){ if("mediaSession" in navigator) try{ navigator.mediaSession.playbackState = "paused"; }catch(e){} });
  /* 화면에 오디오 줄이 없을 때도 문서 안에 붙어 있어야 소리가 끊기지 않는다 */
  player.holder = el("div",{style:"display:none;", id:"audioHome"});
  document.body.appendChild(player.holder);
  player.holder.appendChild(a);
  player.el = a;
  setupMediaSession();
  return a;
}
function parkPlayer(){
  /* 오디오 줄을 지우기 전에 오디오를 보관소로 옮긴다(지우면 재생이 멈추므로) */
  if(player.el && player.holder && player.el.parentNode !== player.holder) player.holder.appendChild(player.el);
}
function loadPlayerChapter(book, chapter, file){
  var a = getPlayerEl();
  if(player.url) URL.revokeObjectURL(player.url);
  player.url = URL.createObjectURL(file);
  player.file = file; player.book = book; player.chapter = chapter;
  a.src = player.url;
  a.playbackRate = state.audioRate || 1;
  updateMediaMetadata();
  /* 다음 장은 이 장이 시작되자마자 바로 미리 꺼내 둔다. 화면이 꺼지면 크롬이 재생 진행 알림
     (timeupdate)을 거의 보내지 않아서, "끝나기 직전에 준비"하는 방식으로는 두 번째 장부터
     준비가 안 되어 소리가 멈췄다. */
  prefetchNextChapter();
}
function prefetchNextChapter(){
  if(!player.book || player.prefetching) return;
  if(player.next && player.next.fromBook === player.book && player.next.fromChapter === player.chapter) return;
  player.prefetching = true;
  var fb = player.book, fc = player.chapter;
  relativeChapter(fb, fc, 1).then(function(t){
    if(!t) return null;
    return getAudioFile(t.book, t.chapter).then(function(f){
      if(f && player.book === fb && player.chapter === fc) player.next = {fromBook:fb, fromChapter:fc, book:t.book, chapter:t.chapter, file:f};
    });
  }).catch(function(){}).then(function(){ player.prefetching = false; });
}
/* 테스트·점검용: 지금 재생 중인 장과 미리 준비된 다음 장 */
window.__playerInfo = function(){ return {book:player.book, chapter:player.chapter, next: player.next ? player.next.book + ":" + player.next.chapter : null, from: player.next ? player.next.fromBook + ":" + player.next.fromChapter : null}; };
function updateMediaMetadata(){
  if(!("mediaSession" in navigator) || !player.book) return;
  try{
    var b = bookByNum(player.book);
    navigator.mediaSession.metadata = new MediaMetadata({
      title: b.ko + " " + player.chapter + "장",
      artist: "개역개정 낭독",
      album: "말씀나눔 성경읽기"
    });
  }catch(e){}
}
function setupMediaSession(){
  if(!("mediaSession" in navigator)) return;
  var ms = navigator.mediaSession;
  function on(action, fn){ try{ ms.setActionHandler(action, fn); }catch(e){} }
  on("play", function(){ if(player.el) player.el.play(); });
  on("pause", function(){ if(player.el) player.el.pause(); });
  on("previoustrack", function(){ playerStep(-1, true); });
  on("nexttrack", function(){ playerStep(1, true); });
  on("seekbackward", function(d){ if(player.el) player.el.currentTime = Math.max(0, player.el.currentTime - ((d && d.seekOffset) || 10)); });
  on("seekforward", function(d){ if(player.el) player.el.currentTime = Math.min(player.el.duration || 1e9, player.el.currentTime + ((d && d.seekOffset) || 10)); });
  on("seekto", function(d){ if(player.el && d && typeof d.seekTime === "number") player.el.currentTime = d.seekTime; });
}
/* 오디오가 다음 장으로 넘어갔을 때, 그 장을 보고 있었으면 화면도 넘긴다.
   단 화면이 꺼져 있으면 지금은 아무것도 그리지 않고(휴대폰이 바쁜 앱을 멈추지 않도록),
   화면이 다시 켜질 때 지금 들리는 장으로 한 번에 맞춘다. */
var _catchUpOnVisible = false;
function followPlayerOnScreen(fromBook, fromChapter, delta){
  var watching = state.screen === "reading" && state.book === fromBook && state.chapter === fromChapter;
  if(!watching) return;
  if(document.hidden){ _catchUpOnVisible = true; return; }
  state._swipeDir = delta; goReading(player.book, player.chapter);
}
document.addEventListener("visibilitychange", function(){
  if(document.hidden || !_catchUpOnVisible) return;
  _catchUpOnVisible = false;
  if(state.screen === "reading" && player.book && (state.book !== player.book || state.chapter !== player.chapter)) goReading(player.book, player.chapter);
});
/* 앞/뒤 장 번호 계산(책의 처음·끝을 넘어가면 이전·다음 책으로) */
async function relativeChapter(book, chapter, delta){
  var verKey = state.version;
  var next = chapter + delta;
  if(next < 1){
    if(book - 1 < 1) return null;
    var prevTotal = await getChapterCount(verKey, book - 1);
    return {book:book - 1, chapter:prevTotal || 1};
  }
  var total = await getChapterCount(verKey, book);
  if(next > total){
    if(book + 1 > 66) return null;
    return {book:book + 1, chapter:1};
  }
  return {book:book, chapter:next};
}
/* 한 장이 끝났을 때(또는 잠금화면의 이전/다음 버튼): 같은 오디오에 다음 장을 끼워 바로 재생하고,
   그 장을 보고 있던 중이면 화면도 따라 넘긴다 */
var _playerStepping = false;
async function playerStep(delta, autoplay){
  if(_playerStepping || !player.book) return;
  _playerStepping = true;
  try{
    var fromBook = player.book, fromChapter = player.chapter;
    var target = await relativeChapter(fromBook, fromChapter, delta);
    if(!target) return;
    var file = await getAudioFile(target.book, target.chapter);
    if(file){
      loadPlayerChapter(target.book, target.chapter, file);
      if(autoplay){ try{ await player.el.play(); }catch(e){} }
    }
    followPlayerOnScreen(fromBook, fromChapter, delta);
  } finally { _playerStepping = false; }
}

/* ---------- 오디오 "따라 읽기": 들리는 절을 따라 본문이 저절로 스크롤 ----------
   오디오 파일에는 절마다 몇 초에 시작하는지 정보가 없다. 그래서
   (1) 처음에는 각 절의 글자 수 비율로 시작 시각을 어림하고(바로 동작),
   (2) 뒤에서 오디오를 한 번 분석해 낭독자가 숨을 쉬며 멈추는 "쉼" 자리를 찾아,
       어림한 시각과 가장 잘 맞는 쉼에 절 경계를 맞춘다(동적 계획법) — 그러면 장 끝까지 거의 어긋나지 않는다.
   지금 읽는 절은 옅은 바탕으로 표시하고, 화면 위쪽 1/4 지점에 오도록 부드럽게 스크롤한다.
   손가락으로 직접 스크롤하면 6초 동안은 따라가기를 쉬어서 앞뒤를 자유롭게 볼 수 있다. */
var LS_FOLLOW = "bible_follow_v1";
function isFollowOn(){ return lsGet(LS_FOLLOW, true) !== false; }
var _verseTimingCache = {};

/* 절 하나를 읽는 데 걸리는 시간에 비례하는 값: 한글 음절 1, 그 밖의 글자 0.5, 쉼표·마침표 등은 약간의 쉼 */
function spokenWeight(text){
  var w = 0;
  for(var i=0;i<(text||"").length;i++){
    var ch = text.charAt(i);
    if(/[가-힣]/.test(ch)) w += 1;
    else if(/[.,;:!?]/.test(ch)) w += 0.8;
    else if(/\s/.test(ch)) w += 0.15;
    else w += 0.5;
  }
  return Math.max(w, 1);
}

/* 오디오를 낮은 품질(8kHz, 한 채널)로 풀어서 20ms마다 소리 크기를 잰다 */
async function analyzeAudioPauses(audioFile){
  var buf = await audioFile.arrayBuffer();
  var Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if(!Ctx) throw new Error("no-webaudio");
  var ab = null, rates = [8000, 16000, 22050, 44100];
  for(var i=0;i<rates.length && !ab;i++){
    try{
      var ctx = new Ctx(1, rates[i], rates[i]);
      ab = await new Promise(function(res, rej){
        var p = ctx.decodeAudioData(buf.slice(0), res, rej);
        if(p && p.then) p.then(res, rej);
      });
    }catch(e){ ab = null; }
  }
  if(!ab) throw new Error("decode-failed");
  var sr = ab.sampleRate, hop = Math.max(1, Math.round(sr * 0.02));
  var ch0 = ab.getChannelData(0), ch1 = ab.numberOfChannels > 1 ? ab.getChannelData(1) : null;
  var n = Math.floor(ch0.length / hop), rms = new Float32Array(n);
  for(var f=0; f<n; f++){
    var s = 0, base = f*hop;
    for(var k=0;k<hop;k++){ var x = ch0[base+k]; if(ch1) x = (x + ch1[base+k]) / 2; s += x*x; }
    rms[f] = Math.sqrt(s/hop);
  }
  /* 3칸 이동 중앙값으로 튀는 값 정리 */
  var sm = new Float32Array(n);
  for(var f2=0; f2<n; f2++){
    var a = rms[Math.max(0,f2-1)], b = rms[f2], c = rms[Math.min(n-1,f2+1)];
    sm[f2] = Math.max(Math.min(a,b), Math.min(Math.max(a,b), c));
  }
  var sorted = Array.prototype.slice.call(sm).sort(function(x,y){ return x-y; });
  var floor = sorted[Math.floor(n*0.1)] || 0, loud = sorted[Math.floor(n*0.95)] || 0;
  var thr = floor + (loud - floor) * 0.12;   /* 배경음악이 깔려 있어도 "상대적으로 조용한 곳"을 쉼으로 본다 */
  var frameSec = hop / sr, minRun = Math.round(0.22 / frameSec);
  var pauses = [], runStart = -1, first = -1, last = -1;
  for(var f3=0; f3<=n; f3++){
    var quiet = f3 === n || sm[f3] < thr;
    if(!quiet){ if(first < 0) first = f3; last = f3; }
    if(quiet && runStart < 0) runStart = f3;
    if(!quiet && runStart >= 0){
      if(first >= 0 && runStart > first && f3 - runStart >= minRun)
        pauses.push({start:runStart*frameSec, end:f3*frameSec, len:(f3-runStart)*frameSec});
      runStart = -1;
    }
  }
  return {duration: n*frameSec, speechStart: Math.max(0, first)*frameSec, speechEnd: (last+1)*frameSec, pauses: pauses};
}

/* 글자 수 비율로 어림한 경계 시각에 가장 잘 맞는 쉼들을, 순서를 지키며 고른다 */
function alignVersesToPauses(weights, an){
  var N = weights.length, pauses = an.pauses;
  var s0 = an.speechStart, end = an.speechEnd;
  /* 장 첫머리의 "○○기 ○장" 안내: 3.5초 안에 0.4초 이상 쉬는데, 1절이 그보다 훨씬 길 것으로
     보이면 그 쉼까지를 안내로 보고 1절은 그 뒤부터 시작한 것으로 본다 */
  var W = 0; weights.forEach(function(w){ W += w; });
  if(pauses.length && N > 1){
    var p0 = pauses[0];
    var v1Est = (end - s0) * weights[0] / W;
    if(p0.start - s0 < 3.5 && p0.len >= 0.4 && v1Est > 1.6 * (p0.start - s0)) s0 = p0.end;
  }
  var D = Math.max(1, end - s0), B = N - 1;
  var est = [], cum = 0;
  for(var k=0;k<B;k++){ cum += weights[k]; est.push(s0 + D * cum / W); }
  var cand = pauses.filter(function(p){ return p.start > s0 + 0.2 && p.end < end; });
  var M = cand.length, sigma = Math.max(1.0, D * 0.03), SKIP = 1.6, INF = 1e9;
  function cost(k, j){ var mid = (cand[j].start + cand[j].end)/2; return Math.abs(mid - est[k]) / sigma - Math.min(cand[j].len, 1.0); }
  /* g[k][j]: 처음 k개 경계를 처음 j개 쉼 안에서 정했을 때의 최소 비용 */
  var g = [], ch = [];
  for(var k2=0;k2<=B;k2++){ g.push(new Float64Array(M+1)); ch.push(new Int8Array(M+1)); }
  for(var j0=0;j0<=M;j0++) g[0][j0] = 0;
  for(var k3=1;k3<=B;k3++){
    g[k3][0] = g[k3-1][0] + SKIP; ch[k3][0] = 2;
    for(var j=1;j<=M;j++){
      var best = g[k3][j-1], c = 0;                                   /* 0: 이 쉼은 안 씀 */
      var use = g[k3-1][j-1] + cost(k3-1, j-1); if(use < best){ best = use; c = 1; } /* 1: 경계 k를 이 쉼에 */
      var skip = g[k3-1][j] + SKIP; if(skip < best){ best = skip; c = 2; }          /* 2: 경계 k는 쉼 없이 어림값 */
      g[k3][j] = best; ch[k3][j] = c;
    }
  }
  var assigned = new Array(B), kk = B, jj = M;
  while(kk > 0){
    var cc = ch[kk][jj];
    if(cc === 0){ jj--; }
    else if(cc === 1){ assigned[kk-1] = cand[jj-1].end - 0.05; kk--; jj--; }
    else { assigned[kk-1] = null; kk--; }
  }
  /* 쉼을 못 찾은 경계는 앞뒤로 정해진 경계 사이에서 글자 수 비율로 채운다 */
  var starts = [s0];
  for(var b=0;b<B;b++) starts.push(assigned[b]);
  starts.push(end);
  for(var i=1;i<=B;i++){
    if(starts[i] != null) continue;
    var a = i-1, z = i; while(starts[z] == null) z++;
    var span = 0; for(var q=a; q<z; q++) span += weights[q];
    var acc = 0; for(var q2=a; q2<i; q2++) acc += weights[q2];
    starts[i] = starts[a] + (starts[z] - starts[a]) * acc / span;
  }
  starts.pop();
  for(var t=1;t<starts.length;t++) if(starts[t] < starts[t-1]) starts[t] = starts[t-1];
  return starts;
}

/* 글자 수 비율만으로 어림(분석이 끝나기 전 · 분석이 안 되는 기기) */
function proportionalStarts(weights, duration){
  var W = 0; weights.forEach(function(w){ W += w; });
  var lead = Math.min(2.5, duration * 0.02), D = Math.max(1, duration - lead - 0.5), cum = 0, out = [];
  weights.forEach(function(w){ out.push(lead + D * cum / W); cum += w; });
  return out;
}

/* 오디오는 개역개정 낭독이므로, 절 길이 비율도 가능하면 개역개정 본문으로 잰다 */
async function audioWeightVerses(bookNum, chapter){
  var keys = Object.keys(state.lfaFiles), key = null;
  for(var i=0;i<keys.length;i++){ var k = keys[i].toLowerCase(); if(k.indexOf("kornkrv") >= 0 || keys[i] === "개역개정"){ key = keys[i]; break; } }
  var verses = null;
  if(key){ try{ verses = await getChapterVerses(key, bookNum, chapter); }catch(e){ verses = null; } }
  if(!verses || !verses.length) verses = await getChapterVerses(state.version, bookNum, chapter);
  return verses || [];
}

function setupAudioFollow(audio, audioFile, forBook, forChapter){
  var btn = el("button",{class:"follow-btn" + (isFollowOn() ? " on" : ""), title:"오디오를 따라 본문 자동 스크롤"},[
    el("span",{class:"ic"},["📖"]), el("span",{},["따라 읽기"])
  ]);
  var verseNums = [], starts = null, analyzed = false, curV = null, holdUntil = 0, analyzing = false;
  var cacheKey = forBook + "|" + forChapter;
  function clearNow(){ var o = document.querySelector(".verse-row.reading-now"); if(o) o.classList.remove("reading-now"); curV = null; }
  btn.addEventListener("click", function(e){
    e.stopPropagation();
    var now = !isFollowOn();
    lsSet(LS_FOLLOW, now);
    btn.classList.toggle("on", now);
    if(now){ holdUntil = 0; curV = null; tick(true); showToast("📖 들리는 구절을 따라 본문이 저절로 넘어가요"); }
    else { clearNow(); showToast("따라 읽기를 껐어요"); }
  });
  function ensureTimings(){
    if(analyzed || analyzing) return;
    if(document.hidden) return; /* 화면이 꺼져 있을 땐 무거운 오디오 분석을 미룬다(켜지면 다시 시도) */
    if(_verseTimingCache[cacheKey]){ verseNums = _verseTimingCache[cacheKey].nums; starts = _verseTimingCache[cacheKey].starts; analyzed = true; return; }
    analyzing = true;
    audioWeightVerses(forBook, forChapter).then(function(verses){
      verseNums = verses.map(function(v){ return v.v; });
      /* 주석(" / ㉠…")은 낭독하지 않으므로 길이 계산에서 뺀다 */
      var weights = verses.map(function(v){ return spokenWeight(String(v.text||"").replace(/\s+\/\s*[㉠-㉭㈀-㈍①-⑳ⓐ-ⓩ⒜-⒵*].*$/, "")); });
      if(audio.duration && isFinite(audio.duration) && !starts) starts = proportionalStarts(weights, audio.duration);
      return analyzeAudioPauses(audioFile).then(function(an){
        if(verses.length > 1 && an.pauses.length) starts = alignVersesToPauses(weights, an);
        else starts = proportionalStarts(weights, an.duration);
        analyzed = true;
        _verseTimingCache[cacheKey] = {nums:verseNums, starts:starts};
      }).catch(function(){
        /* 분석이 안 되는 기기는 글자 수 비율 어림으로만 */
        if(audio.duration && isFinite(audio.duration)) starts = proportionalStarts(weights, audio.duration);
        analyzed = true;
      });
    }).then(function(){ analyzing = false; tick(true); }, function(){ analyzing = false; });
    /* 분석이 끝나기 전에도 바로 따라가도록, 재생 시간만 알면 글자 수 어림값을 먼저 쓴다 */
  }
  function stickyTop(){
    var top = 0, h = document.querySelector("header");
    if(h && !document.body.classList.contains("immersive")) top += h.offsetHeight;
    var ph = document.querySelector(".par-head"); if(ph) top += ph.offsetHeight;
    return top;
  }
  function tick(force){
    if(state.book !== forBook || state.chapter !== forChapter) return;
    if(player.book !== forBook || player.chapter !== forChapter) return; /* 오디오가 이미 다른 장으로 넘어감 */
    if(document.hidden) return;
    if(!isFollowOn() || !starts || !verseNums.length) return;
    if(audio.paused) return; /* 재생 중일 때만 따라간다(멈춰 있을 땐 화면을 건드리지 않음) */
    var t = audio.currentTime + 0.12, idx = 0;
    for(var i=0;i<starts.length;i++){ if(starts[i] <= t) idx = i; else break; }
    var v = verseNums[idx];
    if(v === curV && !force) return;
    var row = document.querySelector('.verse-row[data-v="' + v + '"]');
    if(!row) return;
    var old = document.querySelector(".verse-row.reading-now"); if(old && old !== row) old.classList.remove("reading-now");
    row.classList.add("reading-now");
    curV = v;
    if(Date.now() < holdUntil) return;
    var top0 = stickyTop(), bottomBar = (state._audioBarEl && !document.body.classList.contains("immersive")) ? state._audioBarEl.offsetHeight : 0;
    var visible = window.innerHeight - top0 - bottomBar;
    var y = row.getBoundingClientRect().top + window.pageYOffset - top0 - visible * 0.22;
    window.scrollTo({top: Math.max(0, y), behavior: "smooth"});
  }
  function onPlay(){ ensureTimings(); tick(true); }
  function onTime(){ tick(false); }
  function onSeeked(){ holdUntil = 0; tick(true); }
  function onVisible(){ if(!document.hidden && !audio.paused){ ensureTimings(); tick(true); } }
  document.addEventListener("visibilitychange", onVisible);
  audio.addEventListener("play", onPlay);
  audio.addEventListener("timeupdate", onTime);
  audio.addEventListener("seeked", onSeeked);
  audio.addEventListener("ended", clearNow);
  /* 이미 재생 중인 상태로 이 화면이 열렸으면(화면이 꺼진 사이 다음 장으로 넘어온 경우) 바로 따라가기 시작 */
  if(!audio.paused){ setTimeout(onPlay, 0); }
  /* 손가락으로 직접 스크롤하면 6초 동안 따라가기를 쉰다 */
  function onUserScroll(e){
    if(e && e.target && e.target.closest && e.target.closest(".audio-bar")) return;
    holdUntil = Date.now() + 6000;
  }
  window.addEventListener("touchmove", onUserScroll, {passive:true});
  window.addEventListener("wheel", onUserScroll, {passive:true});
  state._followCleanup = function(){
    window.removeEventListener("touchmove", onUserScroll);
    window.removeEventListener("wheel", onUserScroll);
    audio.removeEventListener("play", onPlay);
    audio.removeEventListener("timeupdate", onTime);
    audio.removeEventListener("seeked", onSeeked);
    audio.removeEventListener("ended", clearNow);
    document.removeEventListener("visibilitychange", onVisible);
  };
  return btn;
}

/* 본문 뒤에 " / ㉠요단 강 동쪽에서…"처럼 붙은 주석은 따로 떼어 작고 어둡게 보여준다(복사·검색은 원문 그대로) */
function verseTextEl(text){
  var m = /^(.*?)\s+\/\s*(?=[㉠-㉭㈀-㈍①-⑳ⓐ-ⓩ⒜-⒵*])(.*)$/.exec(text || "");
  if(!m) return el("div",{class:"verse-text"},[text]);
  return el("div",{class:"verse-text"},[m[1] + " ", el("span",{class:"verse-note"},["/ " + m[2]])]);
}

async function stepChapter(delta){ return gotoRelativeChapter(delta, false); }

/* 좌우 밀기 / 장 끝 버튼으로 장을 넘길 때: 넘어가는 방향을 기억해 애니메이션을 주고,
   창세기 1장에서 더 앞으로, 요한계시록 마지막 장에서 더 뒤로 가려 하면 알려준다. */
async function swipeToChapter(delta){
  if(delta < 0 && state.book === 1 && state.chapter === 1){ showToast("성경의 첫 장이에요"); return; }
  if(delta > 0 && state.book === 66){
    var lastTotal = await getChapterCount(state.version, 66);
    if(state.chapter >= lastTotal){ showToast("성경의 마지막 장이에요"); return; }
  }
  state._swipeDir = delta;
  return gotoRelativeChapter(delta, false);
}

async function gotoRelativeChapter(delta, autoplay){
  var total = await getChapterCount(state.version, state.book);
  var next = state.chapter + delta;
  var targetBook = state.book, targetChapter;
  if(next < 1){
    var prevBookNum = state.book - 1;
    if(prevBookNum < 1) return;
    var prevTotal = await getChapterCount(state.version, prevBookNum);
    targetBook = prevBookNum; targetChapter = prevTotal || 1;
  } else if(next > total){
    var nextBookNum = state.book + 1;
    if(nextBookNum > 66) return;
    targetBook = nextBookNum; targetChapter = 1;
  } else {
    targetChapter = next;
  }
  state._pendingAutoplay = !!autoplay;
  goReading(targetBook, targetChapter);
}

/* 화면 전환시 이전 오디오바/네비 제거 */
var _origRender = render;
render = function(){
  parkPlayer();
  if(state._audioBarEl){ state._audioBarEl.remove(); state._audioBarEl=null; }
  if(state._followCleanup){ state._followCleanup(); state._followCleanup=null; }
  if(state._navEl){ state._navEl.remove(); state._navEl=null; }
  if(state._swipeHandlers){
    document.removeEventListener("touchstart", state._swipeHandlers.start);
    document.removeEventListener("touchend", state._swipeHandlers.end);
    state._swipeHandlers = null;
  }
  if(state._selBarEl){ state._selBarEl.remove(); state._selBarEl=null; }
  if(state._immersiveBtnEl){ state._immersiveBtnEl.remove(); state._immersiveBtnEl=null; }
  if(state._jumpBarRO){ state._jumpBarRO.disconnect(); state._jumpBarRO=null; }
  if(state._bookListScrollHandler){ window.removeEventListener("scroll", state._bookListScrollHandler); state._bookListScrollHandler=null; }
  /* "넓게 보기"는 성경읽기 화면에서만 의미가 있다 — 다른 화면(책 목록 등)으로 나가면
     헤더가 다시 보여야 하니 여기서 일단 끄고, renderReading()이 저장된 설정을 보고 다시 켠다. */
  document.body.classList.remove("immersive");
  document.body.classList.remove("reading");
  _origRender();
};

/* "**굵게**" 표시를 <b>로 바꿔 화면 요소 배열로 만든다 */
function manualRichText(text){
  var parts = text.split("**");
  return parts.map(function(p, i){ return i % 2 === 1 ? el("b",{},[p]) : p; }).filter(function(p){ return p !== ""; });
}
function openManualModal(){
  var backdrop = el("div",{class:"modal-backdrop", onclick:function(e){ if(e.target===backdrop) backdrop.remove(); }});
  var sheet = el("div",{class:"modal-sheet manual-sheet"});
  sheet.appendChild(el("h3",{style:"font-size:17px;"},["📖 사용설명서"]));
  sheet.appendChild(el("p",{class:"manual-intro"},["궁금한 항목을 누르면 설명이 펼쳐집니다."]));
  MANUAL_SECTIONS.forEach(function(sec, i){
    var det = el("details",{class:"manual-sec"});
    if(i === 0) det.open = true;
    det.appendChild(el("summary",{},[sec.title]));
    var list = el(sec.steps ? "ol" : "ul",{});
    sec.items.forEach(function(t){ list.appendChild(el("li",{},manualRichText(t))); });
    det.appendChild(list);
    sheet.appendChild(det);
  });
  sheet.appendChild(el("button",{class:"btn btn-primary", style:"margin-top:8px; width:100%; padding:12px;", onclick:function(){ backdrop.remove(); }},["닫기"]));
  backdrop.appendChild(sheet);
  document.body.appendChild(backdrop);
}

  } else {
    var copyAllBtn = el("button",{class:"btn btn-primary", style:"width:100%; margin-bottom:12px;", onclick:function(){
      var combined = items.map(formatHighlightForCopy).join("\n\n");
      copyText(combined).then(function(){ showToast("전체 " + items.length + "개 구절을 복사했어요"); });
    }},["📋 전체 복사 (" + items.length + "개)"]);
    sheet.appendChild(copyAllBtn);
    var list = el("div",{});
    items.forEach(function(h){
      var item = el("div",{class:"highlight-item"});
      item.appendChild(el("div",{class:"ref"},[refLabel(h.book,h.chapter,h.verse)]));
      item.appendChild(el("div",{class:"txt"},[h.text]));
      var noteInput = el("textarea",{placeholder:"묵상 메모를 적어보세요…"});
      noteInput.value = h.note || "";
      noteInput.addEventListener("change", function(){
        setHighlightNote(h.book, h.chapter, h.verse, noteInput.value);
        showToast("메모를 저장했어요");
      });
      item.appendChild(noteInput);
      var actions = el("div",{class:"actions"});
      actions.appendChild(el("button",{class:"btn", onclick:function(){
        copyText(formatHighlightForCopy(h)).then(function(){ showToast("복사됐어요"); });
      }},["복사"]));
      actions.appendChild(el("button",{class:"btn", onclick:function(){ shareVerseImage(h); }},["이미지 공유"]));
      actions.appendChild(el("button",{class:"btn", onclick:function(){
        goReading(h.book, h.chapter, h.verse);
        backdrop.remove();
      }},["본문 보기"]));
      actions.appendChild(el("button",{class:"btn btn-ghost", style:"color:var(--danger);", onclick:function(){
        toggleHighlight(h.book, h.chapter, h.verse, h.text);
        changed = true;
        item.remove();
        showToast("하이라이트를 지웠어요");
      }},["지우기"]));
      item.appendChild(actions);
      list.appendChild(item);
    });
    sheet.appendChild(list);
  }
  var closeBtn2 = el("button",{class:"btn btn-ghost", style:"margin-top:6px; width:100%;", onclick:closeAndSync},["닫기"]);
  sheet.appendChild(closeBtn2);
  backdrop.appendChild(sheet);
  document.body.appendChild(backdrop);
}

/* ---------- 본문 검색 모달 ---------- */
function openSearchModal(){
  var backdrop = el("div",{class:"modal-backdrop", onclick:function(e){ if(e.target===backdrop) backdrop.remove(); }});
  var sheet = el("div",{class:"modal-sheet"});
  sheet.appendChild(el("h3",{},["🔍 본문 검색"]));
  var input = el("input",{class:"rename-input", type:"search", placeholder:"찾을 단어를 입력하세요…"});
  sheet.appendChild(input);

  /* ---------- 검색 범위(구약/신약/직접 지정) ----------
     "은혜"처럼 흔한 단어를 검색하면 창세기부터 요한계시록까지 다 나와서, 원하는 범위(신약만,
     또는 요한복음~사도행전처럼 몇 권만)로 좁혀서 찾을 수 있게 한다. 마지막으로 고른 범위는
     다음에 검색할 때도 그대로 유지한다. */
  var range = lsGet(LS_SEARCHRANGE, {from:1, to:66});
  if(!(range.from>=1 && range.from<=66)) range.from = 1;
  if(!(range.to>=1 && range.to<=66)) range.to = 66;
  if(range.from > range.to) range.to = range.from;
  sheet.appendChild(el("div",{class:"search-range-label"},["검색 범위"]));
  var chipsRow = el("div",{class:"search-range-chips"});
  var PRESETS = [{label:"전체", from:1, to:66}, {label:"구약", from:1, to:39}, {label:"신약", from:40, to:66}];
  var chipEls = PRESETS.map(function(p){
    var chip = el("button",{class:"chip", type:"button", onclick:function(){
      range.from = p.from; range.to = p.to;
      applyRangeToSelects();
      saveRangeAndMaybeSearch();
    }},[p.label]);
    chipsRow.appendChild(chip);
    return chip;
  });
  sheet.appendChild(chipsRow);
  var selectRow = el("div",{class:"search-range-select-row"});
  var fromSelect = el("select",{});
  var toSelect = el("select",{});
  BOOKS.forEach(function(b){
    fromSelect.appendChild(el("option",{value:String(b.n)},[b.ko]));
    toSelect.appendChild(el("option",{value:String(b.n)},[b.ko]));
  });
  selectRow.appendChild(fromSelect);
  selectRow.appendChild(el("span",{class:"tilde"},["~"]));
  selectRow.appendChild(toSelect);
  sheet.appendChild(selectRow);
  function applyRangeToSelects(){
    fromSelect.value = String(range.from);
    toSelect.value = String(range.to);
    chipEls.forEach(function(chip, i){
      chip.classList.toggle("active", PRESETS[i].from===range.from && PRESETS[i].to===range.to);
    });
  }
  function saveRangeAndMaybeSearch(){
    lsSet(LS_SEARCHRANGE, range);
    if(input.value.trim()) runSearch();
  }
  fromSelect.addEventListener("change", function(){
    range.from = Number(fromSelect.value);
    if(range.from > range.to){ range.to = range.from; }
    applyRangeToSelects();
    saveRangeAndMaybeSearch();
  });
  toSelect.addEventListener("change", function(){
    range.to = Number(toSelect.value);
    if(range.to < range.from){ range.from = range.to; }
    applyRangeToSelects();
    saveRangeAndMaybeSearch();
  });
  applyRangeToSelects();

  var status = el("div",{class:"empty-hint"},["검색어를 입력해 보세요."]);
  sheet.appendChild(status);
  var resultsWrap = el("div",{});
  sheet.appendChild(resultsWrap);
  var closeBtn = el("button",{class:"btn btn-ghost", style:"margin-top:10px; width:100%;", onclick:function(){ backdrop.remove(); }},["닫기"]);
  sheet.appendChild(closeBtn);
  backdrop.appendChild(sheet);
  document.body.appendChild(backdrop);
  input.focus();

  function rangeLabel(){
    if(range.from===1 && range.to===66) return "";
    if(range.from===1 && range.to===39) return "구약";
    if(range.from===40 && range.to===66) return "신약";
    var fb = bookByNum(range.from), tb = bookByNum(range.to);
    return (fb?fb.ko:"") + (range.from===range.to ? "" : ("~" + (tb?tb.ko:"")));
  }

  var debounceTimer = null;
  var searchSeq = 0;
  input.addEventListener("input", function(){
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runSearch, 250);
  });

  function runSearch(){
    var q = input.value.trim();
    var mySeq = ++searchSeq;
    clear(resultsWrap);
    if(!q){ status.style.display = ""; status.textContent = "검색어를 입력해 보세요."; return; }
    status.style.display = "";
    status.textContent = "검색 중…";
    var rl = rangeLabel();
    buildSearchIndex(state.version).then(function(idx){
      if(mySeq !== searchSeq) return; /* 검색어가 바뀌는 사이에 끝난 이전 검색 결과는 버린다 */
      var matches = idx.filter(function(e){
        return e.book >= range.from && e.book <= range.to && e.text.indexOf(q) !== -1;
      }).slice(0,200);
      clear(resultsWrap);
      var scopeSuffix = rl ? (" (" + rl + " 범위)") : "";
      if(!matches.length){ status.textContent = "\"" + q + "\" 을(를) 찾지 못했어요" + scopeSuffix + "."; return; }
      status.textContent = matches.length + "개 찾음" + scopeSuffix + (matches.length===200 ? " (처음 200개만 표시)" : "");
      matches.forEach(function(m){
        var row = el("div",{class:"highlight-item", style:"cursor:pointer;", onclick:function(){
          goReading(m.book, m.chapter, m.verse);
          backdrop.remove();
        }});
        row.appendChild(el("div",{class:"ref"},[refLabel(m.book,m.chapter,m.verse)]));
        row.appendChild(el("div",{class:"txt", html:highlightMatchHtml(m.text, q)}));
        resultsWrap.appendChild(row);
      });
    });
  }
}

/* ---------- 새 버전 확인 (재설치 없이 업데이트) ---------- */
var CURRENT_BUILD = (document.querySelector('meta[name="app-build"]') || {}).content || "";
var $updateBanner = document.getElementById("updateBanner");
var $updateBtn = document.getElementById("updateBtn");
var _updateShown = false;
var _latestBuild = null;
var LS_UPDATE_ATTEMPT = "bible_update_attempt_v1"; /* 업데이트 버튼을 눌러 어느 판으로 바꾸려 했는지 */

/* 업데이트 직후 주소 끝에 붙인 "?v=..." 표시는 깔끔하게 지운다(화면 주소만 정리, 다시 불러오지 않음) */
(function(){
  try{
    if(/[?&]v=/.test(location.search)){
      history.replaceState(null, "", location.pathname + location.hash);
    }
  }catch(e){}
})();

function checkForUpdate(){
  if(_updateShown || !CURRENT_BUILD) return;
  fetch(location.href, {cache:"no-store"}).then(function(res){
    if(!res.ok) return null;
    return res.text();
  }).then(function(html){
    if(!html) return;
    var m = /<meta name="app-build" content="([^"]*)">/.exec(html);
    if(m && m[1] && m[1] !== CURRENT_BUILD){
      _latestBuild = m[1];
      /* 방금 이 판으로 업데이트를 시도했는데도 아직 예전 판이 떠 있다면(휴대폰이 예전 화면을 잠깐
         붙잡고 있는 경우), 같은 안내를 무한 반복하지 않고 한 번 더 확실한 방법으로 새로 불러온다. */
      var attempt = null;
      try{ attempt = JSON.parse(sessionStorage.getItem(LS_UPDATE_ATTEMPT) || "null"); }catch(e){}
      if(attempt && attempt.build === m[1] && (Date.now() - attempt.at) < 60*1000 && !attempt.retried){
        try{ sessionStorage.setItem(LS_UPDATE_ATTEMPT, JSON.stringify({build:m[1], at:Date.now(), retried:true})); }catch(e){}
        hardReloadTo(m[1]);
        return;
      }
      _updateShown = true;
      $updateBanner.style.display = "flex";
    }
  }).catch(function(){ /* 오프라인이거나 네트워크 문제면 조용히 무시 */ });
}
/* 새 판으로 확실히 바꿔 불러오기. 예전에는 단순히 "새로고침"만 했는데, 휴대폰(브라우저)이 방금
   받았던 예전 화면을 최대 10분 정도 보관해 두었다가 그대로 다시 보여주는 경우가 있어
   "새 버전이 있어요"가 무한 반복되는 문제가 있었다. 그래서
   (1) 앱 주소를 보관본을 무시하고 서버에서 새로 받아 휴대폰의 보관본을 새 판으로 교체한 뒤,
   (2) 주소 끝에 판 번호를 붙여(?v=판번호) 절대 예전 보관본이 쓰일 수 없는 주소로 다시 연다. */
function hardReloadTo(build){
  var base = location.href.split("#")[0].split("?")[0];
  var target = base + "?v=" + encodeURIComponent(build || String(Date.now()));
  var go = function(){ location.replace(target); };
  try{
    fetch(base, {cache:"reload"}).then(go, go);
  }catch(e){ go(); }
}
if($updateBtn) $updateBtn.addEventListener("click", function(){
  $updateBtn.disabled = true;
  $updateBtn.textContent = "업데이트 중…";
  try{ sessionStorage.setItem(LS_UPDATE_ATTEMPT, JSON.stringify({build:_latestBuild, at:Date.now(), retried:false})); }catch(e){}
  hardReloadTo(_latestBuild);
});
/* 앱을 열었을 때, 그리고 백그라운드에 있다가 다시 돌아왔을 때 확인 */
setTimeout(checkForUpdate, 2500);
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible") checkForUpdate();
});
setInterval(checkForUpdate, 15 * 60 * 1000);

/* ---------- 부트스트랩 ---------- */
renderInappBanner();
if(!ENV.isInApp && !ENV.isStandalone && ENV.isIOS && $installBtn){
  /* iOS Safari는 beforeinstallprompt 이벤트가 없어 안내 버튼을 항상 보여줌 */
  $installBtn.style.display = "inline-flex";
}
if(!ENV.isInApp && !ENV.isStandalone && ENV.isAndroid && $installBtn){
  /* 안드로이드 Chrome은 beforeinstallprompt가 늦게(혹은 안) 뜰 수 있어, 잠시 기다렸다가
     이벤트가 없으면 수동 설치 안내 버튼을 대신 보여줌 */
  setTimeout(function(){
    if(!deferredInstallPrompt && $installBtn.style.display === "none"){
      $installBtn.style.display = "inline-flex";
    }
  }, 3000);
}

(async function boot(){
  var result = await silentRestoreConnection();
  if(result.status === "granted"){
    var ok = applyScannedFiles(result.files);
    if(ok){
      updateHeaderForConnected();
      useDefaultVersion();
      if(!applyPendingGo()) goLetters();
      return;
    }
  } else if(result.status === "granted-cached"){
    /* 기기에 저장해둔 캐시로 복원(오디오는 아직 안 읽었고, 그 장을 열 때 하나씩 읽어옴) */
    var ok2 = applyCachedFiles(result.lfaRawFiles, result.mp3LazyIndex);
    if(ok2){
      updateHeaderForConnected();
      useDefaultVersion();
      if(!applyPendingGo()) goLetters();
      return;
    }
  } else if(result.status === "needs-permission"){
    /* 이전에 연결한 폴더가 있지만, 권한을 다시 확인해야 함 — 사용자의 클릭이 있어야 재요청 가능 */
    state._pendingReconnectHandle = result.handle;
  }
  goConnectScreen();
})();

})();
</script>
