<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말씀나눔 성경읽기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<style>
  :root{
    /* 종이(라이트): 가죽 성경의 면지를 닮은 서늘한 아이보리 */
    --bg:#f5f3ec; --surface:#ffffff; --border:#e2ddcf; --text:#241f1a; --text-dim:#78705f;
    /* 리본 책갈피(버건디) + 금박 페이지 끝(골드) — 두 개의 역할이 다른 강조색 */
    --accent:#7c2f3d; --accent-soft:#f4e4e6; --read:#b8873a; --read-text:#fff9ef;
    --danger:#a4402f; --shadow:0 1px 2px rgba(36,31,26,.06),0 6px 16px rgba(36,31,26,.06);
    --error-bg:#fbe9e4;
    --font-serif:"Source Serif 4",Georgia,"Noto Serif KR",serif;
    --font-ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      /* 어두운 가죽 장정 */
      --bg:#181410; --surface:#231d17; --border:#382f24; --text:#ece4d6; --text-dim:#a89a83;
      --accent:#d98a97; --accent-soft:#3a2229; --read:#d1a75c; --read-text:#211705;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.3);
      --danger:#e2917e;
      --error-bg:#392019;
    }
  }
  :root[data-theme="dark"]{
    --bg:#181410; --surface:#231d17; --border:#382f24; --text:#ece4d6; --text-dim:#a89a83;
    --accent:#d98a97; --accent-soft:#3a2229; --read:#d1a75c; --read-text:#211705;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.3);
    --danger:#e2917e;
    --error-bg:#392019;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:var(--font-ui); font-variant-numeric:tabular-nums;}
  #app{max-width:720px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  header{position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--border); padding:10px 14px;}
  .topbar{display:flex; align-items:center; gap:8px;}
  .brand{font-family:var(--font-serif); font-weight:600; font-size:16px; letter-spacing:.2px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  select, button{font-family:inherit;}
  .btn{border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:10px; padding:8px 12px; font-size:13px; cursor:pointer;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .btn-ghost{background:transparent; border-color:transparent;}
  .icon-btn{width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:9px; border:1px solid var(--border); background:var(--surface); cursor:pointer; font-size:16px;}
  select.version-select{border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:10px; padding:7px 8px; font-size:13px; max-width:150px;}
  .crumbs{display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12.5px; color:var(--text-dim); overflow-x:auto; white-space:nowrap;}
  .update-banner{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; padding:8px 12px; background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px; font-size:12.5px; color:var(--text);}
  .inapp-banner{display:none; flex-direction:column; align-items:flex-start; gap:8px; margin-top:8px; padding:10px 12px; background:var(--error-bg); border:1px solid var(--danger); border-radius:10px; font-size:12.5px; color:var(--text); line-height:1.6;}
  .inapp-banner .title{font-weight:700; color:var(--danger);}
  .inapp-banner .btn{margin-top:2px;}
  .crumbs span.clickable{cursor:pointer; color:var(--accent);}
  main{flex:1; padding:16px 14px 90px;}
  .center-pane{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; text-align:center; gap:14px; padding:20px;}
  .center-pane h1{font-size:20px; margin:0;}
  .center-pane p{color:var(--text-dim); font-size:13.5px; line-height:1.6; margin:0; max-width:380px;}
  .section-title{font-size:12.5px; color:var(--text-dim); margin:18px 0 8px; font-weight:600; letter-spacing:.3px;}
  .book-list{display:flex; flex-direction:column; gap:8px;}
  .book-row{display:flex; align-items:center; justify-content:space-between; padding:13px 14px; background:var(--surface); border:1px solid var(--border); border-radius:12px; cursor:pointer; box-shadow:var(--shadow);}
  .book-row .name{font-size:15px; font-weight:600;}
  .book-row .sub{font-family:var(--font-serif); font-style:italic; font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .book-row .progress{font-family:var(--font-serif); font-size:11.5px; color:var(--accent); font-weight:600;}
  .chapter-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
  .chapter-btn{font-family:var(--font-serif); aspect-ratio:1; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .chapter-btn.read{background:var(--read); border-color:var(--read); color:var(--read-text);}
  .verse-btn{font-family:var(--font-serif); aspect-ratio:1; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .verse-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:7px;}
  .verse-row.highlight{background:var(--accent-soft); border-radius:8px; scroll-margin-top:70px;}
  .verse-view{display:flex; flex-direction:column; gap:2px;}
  .verse-row{display:flex; gap:8px; padding:7px 2px; font-size:16px; line-height:1.75;}
  .verse-num{font-family:var(--font-serif); color:var(--accent); font-weight:700; font-size:12.5px; min-width:22px; padding-top:3px;}
  .verse-text{flex:1;}
  .audio-bar{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--border); padding:10px 14px; display:flex; align-items:center; gap:10px; max-width:720px; margin:0 auto;}
  .audio-bar audio{flex:1; height:32px;}
  .chapter-nav{position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--surface); border-top:1px solid var(--border); padding:10px 14px; display:flex; gap:8px; max-width:720px; margin:0 auto;}
  .chapter-nav .btn{flex:1;}
  .empty-hint{color:var(--text-dim); font-size:13px; text-align:center; padding:30px 10px;}
  .badge{display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:100px; background:var(--accent-soft); color:var(--accent); font-weight:700; margin-left:6px;}
  .setup-steps{text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.9; color:var(--text-dim); max-width:380px;}
  .setup-steps b{color:var(--text);}
  .error-box{background:var(--error-bg); border:1px solid #f0c4b3; color:var(--danger); border-radius:10px; padding:10px 12px; font-size:12.5px; max-width:380px;}
  .rename-input{border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:8px; padding:6px 8px; font-size:13px; width:100%;}
  .version-item{display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:10px; margin-bottom:6px;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:20; display:flex; align-items:flex-end; justify-content:center;}
  .modal-sheet{background:var(--surface); width:100%; max-width:720px; border-radius:16px 16px 0 0; padding:16px; max-height:78vh; overflow-y:auto;}
  .modal-sheet h3{margin:0 0 12px; font-size:15px;}
  .spinner{width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .row{display:flex; align-items:center; gap:8px;}
  .stat-pill{font-size:11px; color:var(--text-dim); background:var(--accent-soft); padding:3px 9px; border-radius:100px;}
</style>

  var isIOS = /iPhone|iPad|iPod/.test(ua) && !window.MSStream;
  var isAndroid = /Android/.test(ua);
  var inAppName = null;
  if(/KAKAOTALK/i.test(ua)) inAppName = "카카오톡";
  else if(/FBAN|FBAV|FB_IAB/i.test(ua)) inAppName = "페이스북";
  else if(/Instagram/i.test(ua)) inAppName = "인스타그램";
  else if(/\bLine\//i.test(ua)) inAppName = "라인";
  else if(/NAVER\(inapp/i.test(ua)) inAppName = "네이버";
  else if(/\bBAND\//i.test(ua)) inAppName = "밴드";
  else if(/DaumApps|DaumDevice/i.test(ua)) inAppName = "다음";
  var isStandalone = (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  return {ua:ua, isIOS:isIOS, isAndroid:isAndroid, inAppName:inAppName, isInApp:!!inAppName, isStandalone:isStandalone};
}

function el(tag, attrs, children){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==="class") e.className = attrs[k];
    else if(k==="html") e.innerHTML = attrs[k];
    else if(k.indexOf("on")===0) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){ if(c) e.appendChild(typeof c==="string" ? document.createTextNode(c) : c); });
  return e;
}

function labelForFile(filenameNoExt){
  var lower = filenameNoExt.toLowerCase();
  if(labelMap[lower]) return labelMap[lower];
  if(KNOWN_LABELS[lower]) return KNOWN_LABELS[lower];
  return filenameNoExt;

function indexFilesFromList(fileList){
  /* fileList: array of {name, relPath, file} where relPath is like "bible/korhrv.lfa" or "bible/MP3/01_1.mp3" */
  var lfa = {}, mp3 = {};
  fileList.forEach(function(item){
    var rel = item.relPath.replace(/\\/g,"/");
    var parts = rel.split("/").filter(Boolean);
    /* 루트 폴더명을 제거: 첫 세그먼트가 폴더명이면 스킵 */
    if(parts.length >= 2){
      var inner = parts.slice(1); /* remove top folder name */
      if(inner.length === 1){
        var fname = inner[0];
        if(/\.lfa$/i.test(fname)){
          var key = fname.replace(/\.lfa$/i,"");
          if(!(key.toLowerCase() in lfa)) lfa[key.toLowerCase()] = {displayName:key, file:item.file};
        }
      } else if(inner.length === 2 && /^mp3$/i.test(inner[0]) && /\.mp3$/i.test(inner[1])){
        mp3[inner[1].toLowerCase()] = item.file;
      }
    }
  });
  return {lfa:lfa, mp3:mp3};
}

async function scanDirectoryHandle(dirHandle){
  var files = [];
  async function walk(handle, path){
    for await (var entry of handle.values()){
      var entryPath = path + "/" + entry.name;
      if(entry.kind === "file"){
        var f = await entry.getFile();
        files.push({name:entry.name, relPath:entryPath, file:f});
      } else if(entry.kind === "directory"){
        await walk(entry, entryPath);
      }
    }
  }
  await walk(dirHandle, dirHandle.name);
  return files;
}

function scanFileInputList(fileListRaw){
  var files = [];
  for(var i=0;i<fileListRaw.length;i++){
    var f = fileListRaw[i];
    var rel = f.webkitRelativePath || f.name;
    files.push({name:f.name, relPath:rel, file:f});
  }
  return files;
}

/* IndexedDB: dirHandle(FS Access API 지원 브라우저용) 저장소 + files/meta(그 외 브라우저의
   <input webkitdirectory> 방식용 — 선택한 파일을 통째로 기기에 저장해두고 다음부터는
   폴더를 다시 고르지 않고 그 캐시로 바로 연결한다) 저장소 */
var IDB_NAME = "bible_app_db", IDB_VERSION = 2;
var IDB_STORE = "handles";
var IDB_FILES_STORE = "files";
var IDB_META_STORE = "meta";
function idbOpen(){
  return new Promise(function(resolve, reject){
    try{
      var req = indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded = function(){
        var db = req.result;
        if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        if(!db.objectStoreNames.contains(IDB_FILES_STORE)) db.createObjectStore(IDB_FILES_STORE);
        if(!db.objectStoreNames.contains(IDB_META_STORE)) db.createObjectStore(IDB_META_STORE);
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    }catch(e){ reject(e); }
  });
}
function idbSet(key, val, storeName){
  storeName = storeName || IDB_STORE;
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(storeName,"readwrite");
        tx.objectStore(storeName).put(val, key);
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ resolve(false); };
      }catch(e){ resolve(false); }
    });
  }).catch(function(){ return false; });
}
function idbGet(key, storeName){
  storeName = storeName || IDB_STORE;
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(storeName,"readonly");
        var getReq = tx.objectStore(storeName).get(key);
        getReq.onsuccess = function(){ resolve(getReq.result != null ? getReq.result : null); };
        getReq.onerror = function(){ resolve(null); };
      }catch(e){ resolve(null); }
    });
  }).catch(function(){ return null; });
}
function idbGetAll(storeName){
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(storeName,"readonly");
        var req = tx.objectStore(storeName).getAll();
        req.onsuccess = function(){ resolve(req.result || []); };
        req.onerror = function(){ resolve([]); };
      }catch(e){ resolve([]); }
    });
  }).catch(function(){ return []; });
}
function idbGetAllKeys(storeName){
  /* getAll()과 달리 파일(Blob) 내용을 읽지 않고 키 목록만 빠르게 가져온다 —
     오디오처럼 용량이 큰 파일이 많을 때 getAll()을 쓰면 수 분씩 걸릴 수 있어서
     "폴더가 연결되어 있는지" 확인할 때는 반드시 이 함수를 써야 한다. */
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(storeName,"readonly");
        var req = tx.objectStore(storeName).getAllKeys();
        req.onsuccess = function(){ resolve(req.result || []); };
        req.onerror = function(){ resolve([]); };
      }catch(e){ resolve([]); }
    });
  }).catch(function(){ return []; });
}
function idbClearStore(storeName){
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(storeName,"readwrite");
        tx.objectStore(storeName).clear();
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ resolve(false); };
      }catch(e){ resolve(false); }
    });
  }).catch(function(){ return false; });
}
/* 선택한 파일들(성경 데이터 + MP3)을 통째로 기기에 저장 — <input webkitdirectory> 방식(폴더
   핸들을 기억할 수 없는 브라우저)에서도 다음부터 다시 고를 필요 없이 자동으로 열리게 해준다 */
function cacheFilesToIDB(rawFiles){
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(IDB_FILES_STORE, "readwrite");
        var store = tx.objectStore(IDB_FILES_STORE);
        store.clear();
        rawFiles.forEach(function(item){ store.put(item, item.relPath); });
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ resolve(false); };
      }catch(e){ resolve(false); }
    });
  }).catch(function(){ return false; });
}

function connectViaInput(){
  return new Promise(function(resolve, reject){

    input.type = "file";
    input.webkitdirectory = true;

    input.multiple = true;

/* 브라우저 권한 재확인(requestPermission)은 반드시 사용자의 클릭(제스처) 안에서 호출해야 통과된다.
   그래서 부팅 시점에는 조용히 확인만(queryPermission) 하고, 권한이 사라졌으면
   "다시 연결하기" 버튼을 눌렀을 때 같은 폴더 핸들로 재요청한다 (새로 폴더를 고를 필요 없음).
   폴더 핸들 자체를 지원하지 않는 브라우저(대부분의 안드로이드/아이폰 브라우저)는
   처음 연결할 때 파일을 통째로 기기(IndexedDB)에 저장해두고, 그 캐시로 자동 복원한다. */
async function tryRestoreFromFileCache(){
  /* 오디오 파일까지 전부 getAll()로 읽어오면(수백 MB~1GB) 실제로 화면이 뜨기까지
     몇 분씩 걸릴 수 있다. 그래서 여기서는 "어떤 파일이 있는지" 목록(getAllKeys, 아주 빠름)만
     확인하고, 용량이 작은 성경 본문(.lfa)만 미리 읽어온 뒤, 오디오(mp3)는 실제로 그 장을
     열 때 그때그때 하나씩 불러온다(state.mp3LazyIndex + getAudioFile 참고). */
  try{
    var cachedAt = await idbGet("filesCachedAt", IDB_META_STORE);
    if(!cachedAt) return {status:"none"};
    var keys = await idbGetAllKeys(IDB_FILES_STORE);
    if(!keys || !keys.length) return {status:"none"};
    var lfaRawFiles = [];
    var mp3LazyIndex = {};
    for(var i=0;i<keys.length;i++){
      var relPath = String(keys[i]).replace(/\\/g,"/");
      var parts = relPath.split("/").filter(Boolean);
      if(parts.length < 2) continue;
      var inner = parts.slice(1);
      if(inner.length === 1 && /\.lfa$/i.test(inner[0])){
        var item = await idbGet(keys[i], IDB_FILES_STORE);
        if(item) lfaRawFiles.push(item);
      } else if(inner.length === 2 && /^mp3$/i.test(inner[0]) && /\.mp3$/i.test(inner[1])){
        mp3LazyIndex[inner[1].toLowerCase()] = keys[i];
      }
    }
    if(!lfaRawFiles.length) return {status:"none"};
    return {status:"granted-cached", lfaRawFiles:lfaRawFiles, mp3LazyIndex:mp3LazyIndex};
  }catch(e){ return {status:"none"}; }
}

async function silentRestoreConnection(){
  if(!supportsFSAccess) return await tryRestoreFromFileCache();
  try{
    var handle = await idbGet("dirHandle");
    if(!handle) return await tryRestoreFromFileCache();
    var perm = await handle.queryPermission({mode:"read"});
    if(perm === "granted"){
      var files = await scanDirectoryHandle(handle);
      return {status:"granted", files:files};
    }
    return {status:"needs-permission", handle:handle};
  }catch(e){ return await tryRestoreFromFileCache(); }
}

async function reRequestPermission(handle){
  var perm = await handle.requestPermission({mode:"read"});
  if(perm !== "granted") throw new Error("permission-denied");
  return await scanDirectoryHandle(handle);
}

async function clearSavedConnection(){
  try{ await idbSet("dirHandle", null); }catch(e){}
  await idbClearStore(IDB_FILES_STORE);
  await idbClearStore(IDB_META_STORE);
}

function applyScannedFiles(rawFiles){
  var idx = indexFilesFromList(rawFiles);
  state.lfaFiles = idx.lfa;
  state.mp3Files = idx.mp3;
  state.mp3LazyIndex = null; /* 폴더/파일을 직접 연결한 경우엔 이미 실제 File을 다 갖고 있어 필요 없음 */
  state.connected = Object.keys(idx.lfa).length > 0;
  return state.connected;
}

function applyCachedFiles(lfaRawFiles, mp3LazyIndex){
  var idx = indexFilesFromList(lfaRawFiles); /* lfaRawFiles엔 .lfa만 들어있음 */
  state.lfaFiles = idx.lfa;
  state.mp3Files = {}; /* 실제로 그 장을 열 때 getAudioFile()이 채워 넣음 */
  state.mp3LazyIndex = mp3LazyIndex || {};
  state.connected = Object.keys(idx.lfa).length > 0;
  return state.connected;
}

/* ---------- 성경 데이터 파싱 (JSZip) ---------- */
async function getZip(versionKey){
  if(state.zipCache[versionKey]) return state.zipCache[versionKey];
  var entry = state.lfaFiles[versionKey];
  if(!entry) throw new Error("version-not-found");
  var buf = await entry.file.arrayBuffer();
  var zip = await JSZip.loadAsync(buf);
  state.zipCache[versionKey] = zip;
  return zip;
}

var LFB_RE = /^\S+\s+(\d+):(\d+)\s+(.*)$/;

function findChapterEntry(zip, bookCode, chapter){
  var suffix = bookCode + "_" + chapter + ".lfb";
  var names = Object.keys(zip.files);
  for(var i=0;i<names.length;i++){
    if(names[i].toLowerCase().endsWith(suffix.toLowerCase())) return zip.files[names[i]];
  }
  return null;
}

async function getChapterVerses(versionKey, bookNum, chapter){
  var cacheKey = versionKey+"|"+bookNum+"|"+chapter;
  if(state.chapterCache[cacheKey]) return state.chapterCache[cacheKey];
  var zip = await getZip(versionKey);
  var book = bookByNum(bookNum);
  var entry = findChapterEntry(zip, book.code, chapter);
  if(!entry) return null;
  var text = await entry.async("text");
  var lines = text.split(/\r?\n/);
  var verses = [];
  lines.forEach(function(line){
    if(!line.trim()) return;
    var m = LFB_RE.exec(line.trim());
    if(m) verses.push({v:Number(m[2]), text:m[3].replace(/^"|"$/g,"").trim()});
  });
  verses.sort(function(a,b){ return a.v-b.v; });
  state.chapterCache[cacheKey] = verses;
  return verses;
}

async function getChapterCount(versionKey, bookNum){
  var cacheKey = versionKey+"|"+bookNum;
  if(state.chapterCounts[cacheKey]) return state.chapterCounts[cacheKey];
  var zip = await getZip(versionKey);
  var book = bookByNum(bookNum);
  var re = new RegExp(book.code + "_(\\d+)\\.lfb$", "i");
  var max = 0;
  Object.keys(zip.files).forEach(function(name){
    var m = re.exec(name);
    if(m) max = Math.max(max, Number(m[1]));
  });
  state.chapterCounts[cacheKey] = max;
  return max;
}

async function getAudioFile(bookNum, chapter){
  /* 오디오 파일명 규칙: 책번호_장번호.mp3 (둘 다 최소 2자리, 예: 01_01.mp3, 66_22.mp3, 19_119.mp3) */
  var key = pad2(bookNum) + "_" + pad2(chapter) + ".mp3";
  if(state.mp3Files[key]) return state.mp3Files[key];
  /* 캐시로 복원된 경우: 실제 오디오 데이터는 이 순간에 딱 하나만 IndexedDB에서 읽어온다
     (부팅할 때 전부 미리 읽지 않으므로 앱이 바로 켜진다) */
  if(state.mp3LazyIndex && state.mp3LazyIndex[key]){
    try{
      var item = await idbGet(state.mp3LazyIndex[key], IDB_FILES_STORE);
      if(item && item.file){
        state.mp3Files[key] = item.file;
        return item.file;
      }
    }catch(e){ /* 무시 */ }
  }
  return null;
}

      parts.push(el("span",{},["›"]));

        parts.push(el("span",{},["›"]));

function updateHeaderForConnected(){
  $menuBtn.style.display = "flex";
  $versionSelect.style.display = "inline-block";
  clear($versionSelect);
  var keys = Object.keys(state.lfaFiles).sort();
  /* kornkrv를 기본 상단에 */
  keys.sort(function(a,b){
    if(a===AUDIO_VERSION_HINT) return -1;
    if(b===AUDIO_VERSION_HINT) return 1;
    return 0;
  });
  keys.forEach(function(k){
    var opt = el("option",{value:k},[labelForFile(state.lfaFiles[k].displayName)]);

  });
  if(state.version && keys.indexOf(state.version)>=0) $versionSelect.value = state.version;
  else if(keys.length){ state.version = keys[0]; $versionSelect.value = state.version; }

}

async function onConnectClick(){
  var errBox = document.getElementById("connectError");
  errBox.style.display = "none";
  try{
    var files;
    var usedInput = false;
    if(supportsFSAccess){
      try{ files = await connectViaPicker(); }
      catch(e){
        if(e && e.name === "AbortError") return;
        files = await connectViaInput();
        usedInput = true;
      }
    } else {
      files = await connectViaInput();
      usedInput = true;
    }
    var ok = applyScannedFiles(files);
    if(!ok){
      errBox.textContent = "bible 폴더 안에서 .lfa 파일을 찾지 못했어요. 폴더 구조를 확인해주세요.";
      errBox.style.display = "block";
      return;
    }
    state._pendingReconnectHandle = null;
    updateHeaderForConnected();
    goLetters();
    if(usedInput) cacheFilesInBackground(files);
  }catch(e){
    if(e && e.message === "no-selection") return;
    errBox.textContent = "폴더를 연결하는 중 문제가 발생했어요: " + (e && e.message ? e.message : e);
    errBox.style.display = "block";
  }
}

/* 폴더 핸들을 기억 못 하는 브라우저용: 선택한 파일을 화면 전환 후 백그라운드로 기기에 저장해서
   다음부터는 폴더를 다시 고르지 않아도 자동으로 열리게 한다. 읽기 시작을 막지 않기 위해
   goLetters() 이후, 읽는 도중에 조용히 진행된다. */
function cacheFilesInBackground(files){
  if($cacheBanner){
    $cacheBanner.style.display = "flex";
    $cacheBanner.querySelector("span").textContent = "💾 다음에도 자동으로 열리도록 저장하는 중… (창을 닫지 말아주세요)";
  }
  cacheFilesToIDB(files).then(function(success){
    if(success){
      idbSet("filesCachedAt", Date.now(), IDB_META_STORE);
      if($cacheBanner){
        $cacheBanner.querySelector("span").textContent = "✅ 저장 완료! 다음부터는 자동으로 열려요.";
        setTimeout(function(){ if($cacheBanner) $cacheBanner.style.display = "none"; }, 3000);
      }
    } else if($cacheBanner){
      $cacheBanner.querySelector("span").textContent = "⚠️ 저장 공간 부족 등으로 자동 연결 저장에 실패했어요. 다음에 열 때 다시 연결해주세요.";
      setTimeout(function(){ if($cacheBanner) $cacheBanner.style.display = "none"; }, 5000);
    }
  });
}

async function onReconnectClick(){
  var errBox = document.getElementById("connectError");
  errBox.style.display = "none";
  try{
    var files = await reRequestPermission(state._pendingReconnectHandle);
    var ok = applyScannedFiles(files);
    if(!ok){
      errBox.textContent = "bible 폴더 안에서 .lfa 파일을 찾지 못했어요. 폴더 구조를 확인해주세요.";
      errBox.style.display = "block";
      return;
    }
    state._pendingReconnectHandle = null;
    updateHeaderForConnected();
    goLetters();
  }catch(e){
    errBox.textContent = "권한이 거절되었어요. '다른 폴더 새로 선택'을 눌러 다시 골라주세요.";
    errBox.style.display = "block";
  }
}

function renderLetters(){
  /* 구약(1~39권) / 신약(40~66권)으로 나누어 66권 전체를 빠짐없이 보여준다 */
  var wrap = el("div",{});
  var OT = BOOKS.filter(function(b){ return b.n <= 39; });
  var NT = BOOKS.filter(function(b){ return b.n >= 40; });

  function renderSection(title, count, books){
    wrap.appendChild(el("div",{class:"section-title"},[title + " · " + count + "권"]));
    var list = el("div",{class:"book-list"});
    books.forEach(function(b){
      var row = el("div",{class:"book-row", onclick:function(){ goChapters(b.n); }});
      row.appendChild(el("div",{},[
        el("div",{class:"name"},[b.n + ". " + b.ko]),
        el("div",{class:"sub"},[b.en])
      ]));
      var pill = el("div",{class:"progress", id:"prog-"+b.n},["…"]);
      row.appendChild(pill);
      list.appendChild(row);

        var p = document.getElementById("prog-"+b.n);

      });
    });

  renderSection("구약", OT.length, OT);
  renderSection("신약", NT.length, NT);
  $main.appendChild(wrap);
}

function renderReading(){
  var book = bookByNum(state.book);
  var wrap = el("div",{});
  var head = el("div",{class:"row", style:"justify-content:space-between; margin-bottom:10px;"},[
    el("div",{style:"font-weight:700; font-size:16px;"},[book.ko + " " + state.chapter + "장" + (state.targetVerse ? (" " + state.targetVerse + "절") : "")]),
    el("label",{class:"row", style:"font-size:12.5px; color:var(--text-dim); gap:6px; cursor:pointer;"},[
      (function(){
        var cb = el("input",{type:"checkbox"});
        cb.checked = isRead(state.book, state.chapter);
        cb.addEventListener("change", function(){
          markRead(state.book, state.chapter, cb.checked);
        });
        return cb;
      })(),
      "읽음으로 표시"
    ])
  ]);
  wrap.appendChild(head);
  var verseWrap = el("div",{class:"verse-view", id:"verseWrap"},[el("div",{class:"empty-hint"},["불러오는 중…"])]);
  wrap.appendChild(verseWrap);
  $main.appendChild(wrap);

  getChapterVerses(state.version, state.book, state.chapter).then(function(verses){
    clear(verseWrap);
    if(!verses || !verses.length){
      verseWrap.appendChild(el("div",{class:"empty-hint"},["이 버전에는 해당 장 데이터가 없어요."]));
      return;
    }
    verses.forEach(function(v){
      var isTarget = state.targetVerse && v.v === state.targetVerse;
      var row = el("div",{class:"verse-row"+(isTarget?" highlight":"")},[
        el("div",{class:"verse-num"},[String(v.v)]),
        el("div",{class:"verse-text"},[v.text])
      ]);
      if(isTarget) row.id = "targetVerseRow";
      verseWrap.appendChild(row);
    });
    /* 장을 읽으면 자동으로 읽음 표시 */
    if(!isRead(state.book, state.chapter)){
      markRead(state.book, state.chapter, true);
      var cb = wrap.querySelector('input[type="checkbox"]');
      if(cb) cb.checked = true;
    }
    if(state.targetVerse){
      var targetEl = document.getElementById("targetVerseRow");
      if(targetEl) targetEl.scrollIntoView({block:"center"});
    }
  });

  /* 하단 바: 이전/다음 장 내비게이션은 바로 그려두고(오디오 유무를 기다리지 않음),
     오디오는 찾아지는 대로(캐시에서 복원된 경우 그 장의 mp3 하나만 방금 불러옴) 붙인다. */
  var nav = el("div",{class:"chapter-nav", style:"bottom:0;"});
  var prevBtn = el("button",{class:"btn", onclick:function(){ gotoRelativeChapter(-1, false); }},["‹ 이전 장"]);
  var nextBtn = el("button",{class:"btn btn-primary", onclick:function(){ gotoRelativeChapter(1, false); }},["다음 장 ›"]);
  nav.appendChild(prevBtn); nav.appendChild(nextBtn);
  document.body.appendChild(nav);
  state._navEl = nav;

  var shouldAutoplay = !!state._pendingAutoplay;
  state._pendingAutoplay = false;
  var forBook = state.book, forChapter = state.chapter;
  getAudioFile(state.book, state.chapter).then(function(audioFile){
    /* 오디오를 찾는 사이에 사용자가 이미 다른 장으로 넘어갔으면 이 결과는 버린다 */
    if(state.book !== forBook || state.chapter !== forChapter) return;
    if(audioFile){
      if(state.audioObjUrl) URL.revokeObjectURL(state.audioObjUrl);
      state.audioObjUrl = URL.createObjectURL(audioFile);
      var bar = el("div",{class:"audio-bar"});
      bar.appendChild(el("span",{style:"font-size:18px;"},["🔊"]));
      var audioAttrs = {controls:"controls", src:state.audioObjUrl};
      if(shouldAutoplay) audioAttrs.autoplay = "autoplay";
      var audio = el("audio", audioAttrs);
      audio.playbackRate = state.audioRate || 1;
      /* 사용자가 재생 속도를 바꾸면(브라우저 기본 컨트롤의 배속 메뉴 등) 다음 장에도 그대로 이어서 적용 */
      audio.addEventListener("ratechange", function(){
        if(audio.playbackRate && audio.playbackRate !== state.audioRate){
          state.audioRate = audio.playbackRate;
          lsSet(LS_AUDIORATE, state.audioRate);
        }
      });
      audio.addEventListener("loadedmetadata", function(){ audio.playbackRate = state.audioRate || 1; });
      audio.addEventListener("ended", function(){ gotoRelativeChapter(1, true); });
      bar.appendChild(audio);
      document.body.appendChild(bar);
      state._audioBarEl = bar;
      nav.style.bottom = "52px";
    } else if(state._audioBarEl){
      state._audioBarEl.remove(); state._audioBarEl = null;
    }
  });
}

async function stepChapter(delta){ return gotoRelativeChapter(delta, false); }

async function gotoRelativeChapter(delta, autoplay){
  var total = await getChapterCount(state.version, state.book);
  var next = state.chapter + delta;
  var targetBook = state.book, targetChapter;
  if(next < 1){
    var prevBookNum = state.book - 1;
    if(prevBookNum < 1) return;
    var prevTotal = await getChapterCount(state.version, prevBookNum);
    targetBook = prevBookNum; targetChapter = prevTotal || 1;
  } else if(next > total){
    var nextBookNum = state.book + 1;
    if(nextBookNum > 66) return;
    targetBook = nextBookNum; targetChapter = 1;
  } else {
    targetChapter = next;
  }
  state._pendingAutoplay = !!autoplay;
  goReading(targetBook, targetChapter);
}

/* 화면 전환시 이전 오디오바/네비 제거 */
var _origRender = render;
render = function(){
  if(state._audioBarEl){ state._audioBarEl.remove(); state._audioBarEl=null; }
  if(state._navEl){ state._navEl.remove(); state._navEl=null; }
  _origRender();
};

/* ---------- 설정(버전 이름 변경) 모달 ---------- */
function openSettingsModal(){
  var backdrop = el("div",{class:"modal-backdrop", onclick:function(e){ if(e.target===backdrop) backdrop.remove(); }});
  var sheet = el("div",{class:"modal-sheet"});
  sheet.appendChild(el("h3",{},["버전 이름 편집 · 다시 폴더 연결"]));
  var keys = Object.keys(state.lfaFiles).sort();
  keys.forEach(function(k){
    var item = el("div",{class:"version-item"});
    var input = el("input",{class:"rename-input", value: labelForFile(state.lfaFiles[k].displayName)});
    input.addEventListener("change", function(){
      labelMap[k] = input.value.trim() || state.lfaFiles[k].displayName;
      lsSet(LS_LABELS, labelMap);
      updateHeaderForConnected();
    });
    item.appendChild(input);
    sheet.appendChild(item);
  });
  var reconnectBtn = el("button",{class:"btn", style:"margin-top:10px; width:100%;", onclick:function(){ backdrop.remove(); goConnectScreen(); }},["📁 다른 폴더로 다시 연결"]);
  sheet.appendChild(reconnectBtn);
  var clearBtn = el("button",{class:"btn btn-ghost", style:"margin-top:6px; width:100%; font-size:12px; color:var(--danger);", onclick:function(){
    clearSavedConnection().then(function(){ backdrop.remove(); goConnectScreen(); });
  }},["🗑️ 저장된 자료 지우고 새로 연결하기"]);
  sheet.appendChild(clearBtn);
  var closeBtn = el("button",{class:"btn btn-ghost", style:"margin-top:6px; width:100%;", onclick:function(){ backdrop.remove(); }},["닫기"]);
  sheet.appendChild(closeBtn);
  backdrop.appendChild(sheet);
  document.body.appendChild(backdrop);
}

/* ---------- 새 버전 확인 (재설치 없이 업데이트) ---------- */
var CURRENT_BUILD = (document.querySelector('meta[name="app-build"]') || {}).content || "";
var $updateBanner = document.getElementById("updateBanner");
var $updateBtn = document.getElementById("updateBtn");
var _updateShown = false;

function checkForUpdate(){
  if(_updateShown || !CURRENT_BUILD) return;
  fetch(location.href, {cache:"no-store"}).then(function(res){
    if(!res.ok) return null;
    return res.text();
  }).then(function(html){
    if(!html) return;
    var m = /<meta name="app-build" content="([^"]*)">/.exec(html);
    if(m && m[1] && m[1] !== CURRENT_BUILD){
      _updateShown = true;
      $updateBanner.style.display = "flex";
    }
  }).catch(function(){ /* 오프라인이거나 네트워크 문제면 조용히 무시 */ });
}
if($updateBtn) $updateBtn.addEventListener("click", function(){
  $updateBtn.disabled = true;
  $updateBtn.textContent = "업데이트 중…";
  location.reload();
});
/* 앱을 열었을 때, 그리고 백그라운드에 있다가 다시 돌아왔을 때 확인 */
setTimeout(checkForUpdate, 2500);
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible") checkForUpdate();
});
setInterval(checkForUpdate, 15 * 60 * 1000);

/* ---------- 부트스트랩 ---------- */
renderInappBanner();
if(!ENV.isInApp && !ENV.isStandalone && ENV.isIOS && $installBtn){
  /* iOS Safari는 beforeinstallprompt 이벤트가 없어 안내 버튼을 항상 보여줌 */
  $installBtn.style.display = "inline-flex";
}
if(!ENV.isInApp && !ENV.isStandalone && ENV.isAndroid && $installBtn){
  /* 안드로이드 Chrome은 beforeinstallprompt가 늦게(혹은 안) 뜰 수 있어, 잠시 기다렸다가
     이벤트가 없으면 수동 설치 안내 버튼을 대신 보여줌 */
  setTimeout(function(){
    if(!deferredInstallPrompt && $installBtn.style.display === "none"){
      $installBtn.style.display = "inline-flex";
    }
  }, 3000);
}

(async function boot(){
  var result = await silentRestoreConnection();
  if(result.status === "granted"){
    var ok = applyScannedFiles(result.files);
    if(ok){
      updateHeaderForConnected();
      var last = lsGet(LS_LASTPOS, null);
      if(last && last.book){ state.version = last.version && state.lfaFiles[last.version] ? last.version : state.version; }
      goLetters();
      return;
    }
  } else if(result.status === "granted-cached"){
    /* 기기에 저장해둔 캐시로 복원(오디오는 아직 안 읽었고, 그 장을 열 때 하나씩 읽어옴) */
    var ok2 = applyCachedFiles(result.lfaRawFiles, result.mp3LazyIndex);
    if(ok2){
      updateHeaderForConnected();
      var last2 = lsGet(LS_LASTPOS, null);
      if(last2 && last2.book){ state.version = last2.version && state.lfaFiles[last2.version] ? last2.version : state.version; }
      goLetters();
      return;
    }
  } else if(result.status === "needs-permission"){
    /* 이전에 연결한 폴더가 있지만, 권한을 다시 확인해야 함 — 사용자의 클릭이 있어야 재요청 가능 */
    state._pendingReconnectHandle = result.handle;
  }
  goConnectScreen();
})();

})();
</script>
