<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말씀나눔 성경읽기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    /* 종이(라이트): 가죽 성경의 면지를 닮은 서늘한 아이보리 */
    --bg:#f5f3ec; --surface:#ffffff; --border:#e2ddcf; --text:#241f1a; --text-dim:#78705f;
    /* 리본 책갈피(버건디) + 금박 페이지 끝(골드) — 두 개의 역할이 다른 강조색 */
    --accent:#7c2f3d; --accent-soft:#f4e4e6; --read:#b8873a; --read-text:#fff9ef;
    /* 묵상 하이라이트(형광펜): 성경 본문에서 사용자가 직접 표시하는 구절 */
    --mark-bg:#fdf0a8; --mark-border:#d9b93f;
    --danger:#a4402f; --shadow:0 1px 2px rgba(36,31,26,.06),0 6px 16px rgba(36,31,26,.06);
    --error-bg:#fbe9e4;
    --ctrl-border:#c9be9f; --ctrl-bg:#ffffff;
    --font-serif:"Source Serif 4",Georgia,"Noto Serif KR",serif;
    --font-ui:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    /* 한글 성경 본문 글꼴: 기본은 휴대폰에 들어 있는 고딕체(삼성폰은 삼성 기본 글꼴, 아이폰은 애플 고딕)
       — 여러 분이 고딕이 더 잘 보인다고 하셔서. 영어 본문은 그대로 세리프(Source Serif 4). */
    --font-ko:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --font-bible:"Source Serif 4",Georgia,"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --verse-num-color:var(--accent);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      /* 어두운 가죽 장정 */
      --bg:#181410; --surface:#231d17; --border:#382f24; --text:#ece4d6; --text-dim:#a89a83;
      --accent:#d98a97; --accent-soft:#3a2229; --read:#d1a75c; --read-text:#211705;
      --mark-bg:#4a3f14; --mark-border:#8a7326;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.3);
      --danger:#e2917e;
      --error-bg:#392019;
      --ctrl-border:#8a7a63; --ctrl-bg:#332a20;
      color-scheme: dark;
    }
  }
  /* 검은 바탕 + 흰 글씨(시인성 우선). 기본값이며, 설정에서 밝은 바탕으로 바꿀 수 있다.
     (위의 휴대폰 다크모드 규칙보다 뒤에 두어 항상 이 색이 이긴다) */
  /* 검은 바탕: 눈부심을 줄인 짙은 회색 바탕(#111) + 순백이 아닌 밝은 회색 글씨(#E6E6E6),
     절 번호·주석은 본문보다 한 단계 작고 어두운 회색 */
  :root[data-theme="black"]{
    --bg:#111111; --surface:#1a1a1a; --border:#2e2e2e; --text:#e6e6e6; --text-dim:#9e9e9e;
    --verse-num-color:#8a8a8a;
    --accent:#f2a7b4; --accent-soft:#3a1d24; --read:#e0b866; --read-text:#1a1203;
    --mark-bg:#3f3610; --mark-border:#b39a3a;
    --shadow:0 1px 2px rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.5);
    --danger:#ff9a87;
    --error-bg:#3a1a14;
    --ctrl-border:#8c8c8c; --ctrl-bg:#1c1c1c;
    color-scheme: dark;
  }
  :root[data-theme="dark"]{
    --bg:#181410; --surface:#231d17; --border:#382f24; --text:#ece4d6; --text-dim:#a89a83;
    --accent:#d98a97; --accent-soft:#3a2229; --read:#d1a75c; --read-text:#211705;
    --mark-bg:#4a3f14; --mark-border:#8a7326;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.3);
    --danger:#e2917e;
    --error-bg:#392019;
    --ctrl-border:#8a7a63; --ctrl-bg:#332a20;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  /* 안드로이드 크롬은 누른 곳에 연한 파란 상자를 번쩍 띄운다 — 본문을 누를 때 "번개" 같아서 앱 전체에서 끈다 */
  *{-webkit-tap-highlight-color:transparent;}
  html{-webkit-tap-highlight-color:rgba(0,0,0,0);}
  /* 글자를 누르면 크롬의 "터치하여 검색"(구글 검색창)이 아래에서 올라오는 것을 막는다 —
     화면의 글자를 선택할 수 없게 하면 뜨지 않는다. 검색어·메모 입력칸만 예외. */
  body{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  input, textarea, [contenteditable="true"]{-webkit-user-select:text; user-select:text; -webkit-touch-callout:default;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-ui); font-variant-numeric:tabular-nums;}
  #app{max-width:720px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  /* 화면은 절대 옆으로 밀리지 않게 한다. 다음 장이 오른쪽에서 밀려 들어오는 짧은 순간 화면 폭이
     넓어지면, 손가락으로 민 관성이 페이지 전체(머리줄까지)를 옆으로 끌고 갔다가 되돌아와 "움찔"했다.
     (이전 장은 왼쪽에서 들어와 폭이 넓어지지 않아서 괜찮았음) */
  html{overflow-x:hidden; overscroll-behavior-x:none;}
  #app{overflow-x:clip;}
  body.reading main{touch-action:pan-y pinch-zoom;}
  header{position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--border); padding:10px 14px;}
  .topbar{display:flex; align-items:center; gap:8px;}
  .brand{font-family:var(--font-serif); font-weight:600; font-size:16px; letter-spacing:.2px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* 폴더를 연결한 뒤에는 앱 이름을 숨겨서 그 자리를 버전 선택칸이 넓게 쓴다 */
  body.connected .brand{display:none;}
  body.connected select.version-select{flex:1; min-width:0; max-width:none;}
  select, button{font-family:inherit;}
  .btn{border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:10px; padding:8px 12px; font-size:13px; cursor:pointer;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .btn-ghost{background:transparent; border-color:transparent;}
  .icon-btn{min-width:38px; height:38px; padding:0 8px; display:flex; align-items:center; justify-content:center; border-radius:9px; border:1.5px solid var(--ctrl-border); background:var(--ctrl-bg); color:var(--text); cursor:pointer; font-size:18px; font-weight:700; box-shadow:var(--shadow);}
  select.version-select{border:1.5px solid var(--ctrl-border); background:var(--ctrl-bg); color:var(--text); border-radius:10px; padding:8px 10px; font-family:var(--font-ui); font-size:16px; font-weight:700; max-width:150px; box-shadow:var(--shadow);}
  .crumbs{display:flex; align-items:center; gap:7px; margin-top:8px; font-size:15px; color:var(--text-dim); overflow-x:auto; white-space:nowrap;}
  .update-banner{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; padding:8px 12px; background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px; font-size:12.5px; color:var(--text);}
  .inapp-banner{display:none; flex-direction:column; align-items:flex-start; gap:8px; margin-top:8px; padding:10px 12px; background:var(--error-bg); border:1px solid var(--danger); border-radius:10px; font-size:12.5px; color:var(--text); line-height:1.6;}
  .inapp-banner .title{font-weight:700; color:var(--danger);}
  .inapp-banner .btn{margin-top:2px;}
  .crumbs span.clickable{cursor:pointer; color:var(--accent); padding:4px 2px;}
  /* "전체"(책 목록으로 돌아가기)는 성경을 이리저리 옮겨 다닐 때 가장 자주 누르는 곳이라, 손가락으로 쉽게
     누를 수 있도록 알약 모양의 큰 버튼으로 만든다. */
  .crumbs span.crumb-home{display:inline-flex; align-items:center; gap:4px; min-height:36px; padding:6px 14px; border-radius:100px; border:1.5px solid var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:15px;}
  .crumbs span.crumb-home:active{transform:scale(.96);}
  main{flex:1; padding:16px 14px 90px;}
  .center-pane{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; text-align:center; gap:14px; padding:20px;}
  .center-pane h1{font-size:20px; margin:0;}
  .center-pane p{color:var(--text-dim); font-size:13.5px; line-height:1.6; margin:0; max-width:380px;}
  .pick-title{margin:14px 2px 14px; font-size:16px; color:var(--text-dim); font-weight:600;}
  .pick-title b{font-size:22px; color:var(--text); font-weight:800; margin-right:4px;}
  .section-title{font-size:15px; color:var(--text-dim); margin:22px 2px 10px; font-weight:700; letter-spacing:0;}
  /* 책 목록 상단에 고정해두는 분류 칩 — 66권을 다 스크롤하지 않고 원하는 구간으로 바로 이동 */
  .book-jump-bar{position:sticky; top:0; z-index:4; background:var(--bg); padding:8px 0 6px; margin-bottom:4px; display:flex; flex-direction:column; gap:6px;}
  .book-jump-row{display:flex; align-items:center; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .book-jump-row::-webkit-scrollbar{display:none;}
  .book-jump-tlabel{flex:none; font-size:13px; color:var(--text-dim); font-weight:700; min-width:30px;}
  .book-jump-chip{flex:none; font-family:var(--font-ui); font-size:15px; font-weight:600; padding:8px 15px; border-radius:100px; border:1.5px solid var(--ctrl-border); background:var(--ctrl-bg); color:var(--text); cursor:pointer; white-space:nowrap;}
  .book-jump-chip:active{background:var(--accent-soft); border-color:var(--accent);}
  .book-jump-chip.active{background:var(--accent); border-color:var(--accent); color:#fff9ef;}
  .book-list{display:flex; flex-direction:column; gap:10px;}
  /* 첫 화면 보기 방식 고르기(분류별 / 구약·신약 목록) */
  .list-mode{display:flex; gap:0; margin:2px 0 10px; border:1.5px solid var(--ctrl-border); border-radius:12px; overflow:hidden;}
  .list-mode button{flex:1; padding:9px 6px; border:0; background:var(--ctrl-bg); color:var(--text-dim); font-family:var(--font-ui); font-size:14.5px; font-weight:700; cursor:pointer;}
  .list-mode button + button{border-left:1.5px solid var(--ctrl-border);}
  .list-mode button.on{background:var(--accent-soft); color:var(--accent);}
  /* 간단 목록: 위쪽 구약/신약 탭 + 한 줄에 한 권 */
  .ot-nt-tabs{position:sticky; top:0; z-index:4; display:flex; background:var(--bg); padding:6px 0 0; margin-bottom:2px; border-bottom:2px solid var(--border);}
  .ot-nt-tabs button{flex:1; padding:12px 6px 11px; border:0; background:transparent; color:var(--text-dim); font-family:var(--font-ui); font-size:20px; font-weight:800; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px;}
  .ot-nt-tabs button small{font-size:13px; font-weight:600; margin-left:4px;}
  .ot-nt-tabs button.on{color:var(--text); border-bottom-color:var(--accent);}
  .simple-list{display:flex; flex-direction:column;}
  .simple-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:15px 6px; border-bottom:1px solid var(--border); cursor:pointer;}
  .simple-row:active{background:var(--surface);}
  .simple-row .nm{font-family:var(--font-ui); font-size:20px; font-weight:700; letter-spacing:-0.01em;}
  .simple-row .nm small{font-size:14px; font-weight:500; color:var(--text-dim); margin-left:6px; letter-spacing:0;}
  .simple-row .pg{flex:none; font-family:var(--font-ui); font-size:14px; color:var(--text-dim); font-weight:600; font-variant-numeric:tabular-nums;}
  .simple-row .pg b{color:var(--accent);}
  /* 책 목록: 큼직한 고딕(프리텐다드), 번호는 흐리게, 영어 이름은 작게, 오른쪽엔 읽은 장 수 + 얇은 진행 막대 */
  .book-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 16px; background:var(--surface); border:1px solid var(--border); border-radius:14px; cursor:pointer;}
  .book-row:active{border-color:var(--accent);}
  .book-row .name{font-family:var(--font-ui); font-size:20px; font-weight:700; letter-spacing:-0.01em; line-height:1.25;}
  .book-row .name .bn{display:inline-block; min-width:1.6em; font-size:15px; font-weight:600; color:var(--text-dim); font-variant-numeric:tabular-nums;}
  .book-row .sub{font-family:var(--font-ui); font-size:13px; color:var(--text-dim); margin-top:3px; padding-left:calc(15px * 1.6); letter-spacing:0;}
  .book-row .prog-wrap{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:6px; min-width:74px;}
  .book-row .progress{font-family:var(--font-ui); font-size:15px; color:var(--text-dim); font-weight:600; font-variant-numeric:tabular-nums;}
  .book-row .progress b{color:var(--accent); font-weight:700;}
  .book-row .prog-bar{width:74px; height:4px; border-radius:4px; background:var(--border); overflow:hidden;}
  .book-row .prog-bar > i{display:block; height:100%; width:0; background:var(--accent); border-radius:4px;}
  .chapter-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
  .chapter-btn{font-family:var(--font-ui); aspect-ratio:1; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:19px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .chapter-btn.read{background:var(--read); border-color:var(--read); color:var(--read-text);}
  .verse-btn{font-family:var(--font-ui); aspect-ratio:1; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:17px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .verse-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:7px;}
  .verse-row.highlight{background:var(--accent-soft); border-radius:8px; scroll-margin-top:70px;}
  /* 암송 앱에서 들어온 구절(여러 절): 이어진 절은 한 덩어리로 보이게 */
  .verse-row.target-row{box-shadow:inset 3px 0 0 var(--accent);}
  .verse-row.target-row + .verse-row.target-row{border-top-left-radius:0; border-top-right-radius:0;}
  .verse-row.target-row:has(+ .verse-row.target-row){border-bottom-left-radius:0; border-bottom-right-radius:0;}
  .amsong-back{border:1px solid var(--ctrl-border, var(--border)); background:var(--ctrl-bg, var(--surface)); color:var(--accent); font-weight:700; font-size:13.5px; padding:6px 12px; border-radius:999px; cursor:pointer; flex:0 0 auto;}
  /* 본문은 인쇄된 성경처럼: 절 번호를 본문 맨 앞에 작게 붙이고, 줄이 넘어가면 번호 밑까지
     왼쪽 끝부터 채우며, 양쪽 끝을 반듯하게 맞춰(양쪽 정렬) 화면 폭을 꽉 채운다. */
  .verse-view{display:flex; flex-direction:column; gap:0;}
  .verse-row{display:block; padding:3px 2px; font-size:var(--verse-font-size,16px); line-height:var(--verse-lh,1.8); font-weight:var(--verse-weight,400); letter-spacing:var(--verse-ls,0); text-align:justify; border-radius:6px; cursor:pointer; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  .verse-row:not(.parallel) .verse-num{display:inline; min-width:0; padding:0; margin-right:4px; font-size:.8em; vertical-align:1px;}
  /* 본문 끝의 " / ㉠…" 주석: 본문보다 한 단계 작고 어둡게 */
  .verse-note{font-size:.84em; color:var(--verse-num-color); font-weight:400;}
  .verse-row:not(.parallel) .verse-text{display:inline;}
  .verse-row:not(.parallel) .verse-copy-btn{vertical-align:-1px; padding:0 3px;}
  .verse-row.user-mark{background:var(--mark-bg); box-shadow:inset 2px 0 0 var(--mark-border);}
  :root[data-kofont="serif"]{--font-ko:"Noto Serif KR",serif; --font-bible:"Source Serif 4",Georgia,"Noto Serif KR",serif;}
  /* 한글이 들어 있는 절(.ko)은 절 번호까지 한글 글꼴로, 영어 절은 세리프 그대로 */
  .verse-row.ko .verse-num, .verse-row.ko .verse-text, .par-col.ko .verse-num, .par-col.ko .verse-text{font-family:var(--font-ko);}
  .verse-num{font-family:var(--font-serif); color:var(--verse-num-color); font-weight:600; font-size:12.5px; min-width:15px; padding-top:2px; text-align:left;}
  .verse-text{flex:1; font-family:var(--font-serif);}
  /* 두 번역본 대조 보기: 왼쪽/오른쪽 반반, 절마다 가로 구분선. 한 절의 길이가 서로 달라도
     같은 절은 항상 같은 줄(높이)에서 시작하도록 한 줄(row)에 두 칸을 나란히 둔다. */
  .par-head{display:flex; align-items:center; gap:0; border-top:1px solid var(--border); border-bottom:2px solid var(--border); position:sticky; z-index:3; background:var(--bg);}
  .par-head > div{flex:1; min-width:0; padding:8px 6px; font-size:13px; font-weight:700; color:var(--text);}
  .par-head > div:first-child{border-right:1px solid var(--border);}
  .par-head select{width:100%; border:1.5px solid var(--ctrl-border); background:var(--ctrl-bg); color:var(--text); border-radius:8px; padding:5px 6px; font-size:13px; font-weight:700;}
  .verse-view.parallel{gap:0;}
  .verse-row.parallel{display:flex; text-align:justify; padding:0; gap:0; border-radius:0; align-items:stretch; border-bottom:1px solid var(--border); font-size:calc(var(--verse-font-size,16px) * 0.92); line-height:calc(var(--verse-lh,1.8) - 0.12);}
  .verse-row.parallel .par-col{flex:1; min-width:0; padding:5px 4px; display:block;}
  /* 좁은 칸에서 영어를 양쪽 정렬하면 단어 사이가 크게 벌어지므로 영어 칸은 왼쪽 정렬 */
  .verse-row.parallel .par-col.latin{text-align:left;}
  .verse-row.parallel .par-col.left{border-right:1px solid var(--border);}
  .verse-row.parallel .par-col .verse-num{display:inline; min-width:0; padding:0; margin-right:3px; font-size:.8em;}
  .verse-row.parallel .par-col .verse-text{display:inline;}
  .verse-row.parallel .par-col .par-missing{display:inline; color:var(--text-dim); font-size:12px;}
  .verse-row.parallel .par-actions{display:inline; margin-left:2px;}
  .par-toggle{font-size:12.5px; padding:5px 10px; border-radius:100px; border:1.5px solid var(--ctrl-border); background:var(--ctrl-bg); color:var(--text); font-weight:700; cursor:pointer; white-space:nowrap;}
  .par-toggle.on{background:var(--accent); border-color:var(--accent); color:#000;}
  .theme-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:12px;}
  .theme-row .label{font-size:13px; font-weight:600;}
  .theme-row .controls{display:flex; gap:6px;}
  .theme-row .controls .btn.active{background:var(--accent); border-color:var(--accent); color:#000; font-weight:700;}
  .verse-copy-btn{flex:none; border:none; background:transparent; color:var(--mark-border); font-size:15px; padding:2px 4px; cursor:pointer; line-height:1;}
  .toast{position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(8px); z-index:40; background:var(--text); color:var(--bg); padding:9px 18px; border-radius:100px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease; max-width:80%; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .highlight-item{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--mark-border); border-radius:10px; padding:10px 12px; margin-bottom:8px;}
  .highlight-item .ref{font-family:var(--font-serif); font-size:11.5px; color:var(--accent); font-weight:700; margin-bottom:4px;}
  .highlight-item .txt{font-family:var(--font-bible); font-size:14px; line-height:1.6; margin-bottom:6px;}
  .highlight-item .txt mark{background:var(--mark-bg); color:inherit; padding:0 1px; border-radius:2px;}
  .highlight-item textarea{width:100%; margin-bottom:8px; border:1px solid var(--border); border-radius:8px; padding:7px 8px; font-size:12.5px; font-family:inherit; background:var(--bg); color:var(--text); resize:vertical; min-height:42px;}
  .search-range-label{font-size:11.5px; color:var(--text-dim); margin:10px 0 4px;}
  .search-range-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .search-range-chips .chip{font-size:11.5px; padding:5px 11px; border-radius:100px; border:1.5px solid var(--ctrl-border); background:var(--ctrl-bg); color:var(--text-dim); cursor:pointer;}
  .search-range-chips .chip.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .search-range-select-row{display:flex; align-items:center; gap:6px; margin-bottom:10px;}
  .search-range-select-row select{flex:1; min-width:0; border:1.5px solid var(--ctrl-border); background:var(--ctrl-bg); color:var(--text); border-radius:8px; padding:7px 6px; font-size:12.5px;}
  .search-range-select-row .tilde{color:var(--text-dim); font-size:12px;}
  /* 성경읽기 화면 "넓게 보기": 위(헤더)·아래(이전/다음장, 오디오, 선택바)를 다 숨기고
     본문만 크게 본다. 되돌리는 버튼은 항상 화면 위에 떠 있어야 하므로 숨김 대상에서 뺀다. */
  body.immersive header, body.immersive .chapter-nav, body.immersive .audio-bar, body.immersive .selection-bar{display:none !important;}
  body.immersive main{padding:14px 14px 24px;}
  /* 성경 본문 화면은 좌우 여백을 최소로 해서 본문을 넓게 쓴다 */
  body.immersive .reading-head{padding-right:46px;} /* 떠 있는 ⤡ 버튼이 "읽음으로 표시"를 가리지 않게 */
  body.reading main{padding-left:6px; padding-right:6px; padding-top:8px;}
  body.reading.immersive main{padding-left:6px; padding-right:6px; padding-top:8px;}
  .immersive-toggle{position:fixed; top:10px; right:10px; z-index:9; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1.5px solid var(--ctrl-border); background:var(--ctrl-bg); color:var(--text); box-shadow:var(--shadow); font-size:16px; cursor:pointer;}
  /* 넓게 보기가 꺼져 있을 때는 이 버튼을 헤더 줄 안(⋯ 설정 버튼 왼쪽)에 넣어서, 설정 버튼을 가리지 않게 한다 */
  header .immersive-toggle{position:static; border-radius:9px; box-shadow:var(--shadow);}
  /* 좌우로 밀어서 장을 넘길 때 새 장이 밀려 들어오는 느낌을 준다 */
  @keyframes swipeInNext{from{opacity:0; transform:translateX(48px);} to{opacity:1; transform:none;}}
  @keyframes swipeInPrev{from{opacity:0; transform:translateX(-48px);} to{opacity:1; transform:none;}}
  .swipe-in-next{animation:swipeInNext .22s ease-out;}
  .swipe-in-prev{animation:swipeInPrev .22s ease-out;}
  /* 장 끝에 붙는 이전/다음 장 버튼: 화면 아래에 고정하지 않고 본문을 다 읽은 뒤에만 보이게 해서 본문 창을 넓힌다 */
  .chapter-end-nav{display:flex; gap:8px; margin:22px 0 6px;}
  .chapter-end-nav .btn{flex:1; padding:11px 12px; font-size:14px;}
  .swipe-hint{text-align:center; font-size:12px; color:var(--text-dim); margin-bottom:8px;}
  .highlight-item .actions{display:flex; gap:6px;}
  .highlight-item .actions button{font-size:11.5px; padding:5px 10px;}
  .selection-bar{position:fixed; left:0; right:0; z-index:7; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; background:var(--mark-bg); border-top:1px solid var(--mark-border); box-shadow:var(--shadow); font-size:12.5px; color:var(--text); max-width:720px; margin:0 auto;}
  .selection-bar .btn{font-size:11.5px; padding:6px 10px;}
  .fontsize-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:12px;}
  .fontsize-row .label{font-size:13px; font-weight:600;}
  .fontsize-row .controls{display:flex; align-items:center; gap:6px;}
  .fontsize-row .controls span{font-size:13px; font-weight:600; min-width:38px; text-align:center;}
  .audio-bar{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--border); padding:10px 14px; display:flex; align-items:center; gap:10px; max-width:720px; margin:0 auto;}
  .audio-bar audio{flex:1; height:32px; min-width:0;}
  /* 오디오 "따라 읽기" 켜기/끄기 버튼 */
  .follow-btn{flex:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; min-width:52px; padding:4px 6px; border-radius:10px; border:1.5px solid var(--ctrl-border); background:var(--ctrl-bg); color:var(--text-dim); font-size:10.5px; font-weight:700; line-height:1.1; cursor:pointer;}
  .follow-btn .ic{font-size:17px; line-height:1;}
  .follow-btn.on{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
  /* 지금 오디오가 읽고 있는 절: 옅은 바탕 + 왼쪽 세로줄 */
  .verse-row.reading-now{background:rgba(127,127,127,.17); box-shadow:inset 3px 0 0 var(--accent); transition:background .25s ease;}
  .chapter-nav{position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--surface); border-top:1px solid var(--border); padding:10px 14px; display:flex; gap:8px; max-width:720px; margin:0 auto;}
  .chapter-nav .btn{flex:1;}
  .empty-hint{color:var(--text-dim); font-size:13px; text-align:center; padding:30px 10px;}
  .badge{display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:100px; background:var(--accent-soft); color:var(--accent); font-weight:700; margin-left:6px;}
  .setup-steps{text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.9; color:var(--text-dim); max-width:380px;}
  .setup-steps b{color:var(--text);}
  .error-box{background:var(--error-bg); border:1px solid #f0c4b3; color:var(--danger); border-radius:10px; padding:10px 12px; font-size:12.5px; max-width:380px;}
  .rename-input{border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:8px; padding:6px 8px; font-size:13px; width:100%;}
  .version-item{display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:10px; margin-bottom:6px;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:20; display:flex; align-items:flex-end; justify-content:center;}
  .modal-sheet{background:var(--surface); width:100%; max-width:720px; border-radius:16px 16px 0 0; padding:16px; max-height:78vh; overflow-y:auto;}
  .modal-sheet h3{margin:0 0 12px; font-size:15px;}
  /* 사용설명서: 어르신들도 읽기 편하게 글자를 조금 크게, 항목별로 접었다 펼 수 있게 */
  .modal-sheet.manual-sheet{max-height:90vh;}
  .manual-intro{font-size:14px; color:var(--text-dim); line-height:1.7; margin:0 0 12px;}
  .manual-sec{border:1px solid var(--border); border-radius:12px; margin-bottom:8px; background:var(--bg);}
  .manual-sec summary{cursor:pointer; padding:13px 14px; font-size:15.5px; font-weight:700; list-style:none; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .manual-sec summary::-webkit-details-marker{display:none;}
  .manual-sec summary::after{content:"▾"; color:var(--text-dim); font-size:14px; transition:transform .15s;}
  .manual-sec[open] summary::after{transform:rotate(180deg);}
  .manual-sec ol, .manual-sec ul{margin:0; padding:0 16px 14px 34px; font-size:14.5px; line-height:1.75;}
  .manual-sec li{margin-bottom:6px;}
  .manual-sec b{color:var(--accent);}
  .spinner{width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .row{display:flex; align-items:center; gap:8px;}
  .stat-pill{font-size:11px; color:var(--text-dim); background:var(--accent-soft); padding:3px 9px; border-radius:100px;}
</style>

/* ---------- 암송 앱에서 "앞뒤 문맥 보기"로 들어온 경우 ----------
   암송 앱이 #go=책번호.장.절(예: 45.12.1-2, 19.119.9,11)&v=번역본&from=amsong 로 연다.
   그 장을 열고 암송 구절들을 바탕색으로 표시해, 앞뒤 구절과 함께 문맥을 볼 수 있게 한다. */
function parseGoHash(){
  var h = location.hash || "";
  var m = /[#&]go=([^&]+)/.exec(h); if(!m) return null;
  var p = decodeURIComponent(m[1]).split(".");
  var b = Number(p[0]), ch = Number(p[1]);
  if(!(b >= 1 && b <= 66) || !(ch >= 1)) return null;
  var vs = [];
  (p[2] || "").split(",").forEach(function(seg){
    if(!seg) return;
    var ab = seg.split("-").map(Number);
    if(ab[1] && ab[1] >= ab[0]){ for(var k=ab[0]; k<=ab[1] && k-ab[0] < 200; k++) vs.push(k); }
    else if(ab[0]) vs.push(ab[0]);
  });
  vs = vs.filter(function(v,i){ return vs.indexOf(v) === i; }).sort(function(a,b){ return a-b; });
  var vm = /[#&]v=([^&]+)/.exec(h);
  var im = /[#&]id=([^&]+)/.exec(h);
  return {b:b, ch:ch, vs:vs, ver: vm ? decodeURIComponent(vm[1]) : "", from: /[#&]from=amsong/.test(h), id: im ? decodeURIComponent(im[1]) : ""};
}
var pendingGo = parseGoHash();
function findVersionKey(v){
  if(!v || !state.lfaFiles) return null;
  if(state.lfaFiles[v]) return v;
  var keys = Object.keys(state.lfaFiles);
  for(var i=0;i<keys.length;i++){
    var info = state.lfaFiles[keys[i]];
    if(info && labelForFile(info.displayName) === v) return keys[i];
  }
  return null;
}
/* 연결된 성경 자료가 준비된 뒤 부른다. 갈 곳이 있으면 그 장을 열고 true */
function applyPendingGo(){
  var g = pendingGo; if(!g) return false;
  pendingGo = null;
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  var key = findVersionKey(g.ver);
  if(key){ state.version = key; try{ $versionSelect.value = key; }catch(e){} }
  state.fromAmsong = g.from; state.amsongId = g.id || "";
  goReading(g.b, g.ch, g.vs.length ? g.vs[0] : null, g.vs);
  return true;
}

function backToAmsong(){
  /* 창을 닫지 않는다(크롬에서는 탭이 닫혀 빈 화면만 남았음). 암송 앱에서 이 화면으로 넘어왔으면

  var url = amsongUrl() + (state.amsongId ? "#open=" + encodeURIComponent(state.amsongId) : "");
  var cameFromAmsong = /\/bible-memory\//.test(document.referrer || "") && history.length > 1;
  if(cameFromAmsong){
    history.back();
    setTimeout(function(){ location.href = url; }, 700); /* 뒤로 가지 못했을 때만 실행됨 */

  }
}
function compactVerses(vs){
  var o = [], i = 0;
  while(i < vs.length){ var j = i; while(j+1 < vs.length && vs[j+1] === vs[j]+1) j++; o.push(j > i ? vs[i]+"-"+vs[j] : String(vs[i])); i = j+1; }
  return o.join(",");
}
/* 읽기 화면 제목·경로에 붙일 절 표시: 한 절이면 "16", 여러 절이면 "1-2" / "9,11" */
function targetLabel(){
  if(state.targetVerses && state.targetVerses.length > 1) return compactVerses(state.targetVerses);
  return state.targetVerse ? String(state.targetVerse) : "";
}
function allHighlights(){
  return Object.keys(highlightMap).map(function(k){ return highlightMap[k]; }).sort(function(a,b){
    if(a.book !== b.book) return a.book - b.book;
    if(a.chapter !== b.chapter) return a.chapter - b.chapter;
    return a.verse - b.verse;
  });
}
/* 지금 읽고 있는 장에서 선택(하이라이트)된 구절만 모음 — 연속이든, 몇 절을 걸러서
   선택했든 상관없이 절 순서대로 반환한다. 한꺼번에 복사하기 기능에 쓰인다. */
function chapterHighlights(bookNum, chapter){
  return allHighlights().filter(function(h){ return h.book === bookNum && h.chapter === chapter; });

/* localStorage에 이 앱이 저장해둔 것(bible_ 로 시작하는 키: 읽음 기록, 하이라이트,
   메모, 글자 크기 등)을 전부 모아 파일 하나로 내보내고, 다른 기기에서 그 파일로

   사라지는데, 이 백업 파일 하나면 그대로 옮길 수 있다. */
function exportUserData(){
  var data = {};
  for(var i=0;i<localStorage.length;i++){
    var k = localStorage.key(i);
    if(k && k.indexOf("bible_") === 0) data[k] = localStorage.getItem(k);
  }
  var payload = {app:"말씀나눔 성경읽기", exportedAt:new Date().toISOString(), data:data};
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var today = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = "성경읽기_백업_" + today + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function importUserDataFromFile(file){
  return file.text().then(function(text){
    var parsed;
    try{ parsed = JSON.parse(text); }catch(e){ throw new Error("invalid-json"); }
    if(!parsed || typeof parsed.data !== "object") throw new Error("invalid-format");
    var count = 0;
    Object.keys(parsed.data).forEach(function(k){
      if(k.indexOf("bible_") === 0){ localStorage.setItem(k, parsed.data[k]); count++; }
    });
    return count;
  });
}

function renderVerseCardCanvas(h){
  var W = 1080, H = 1080;
  var canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext("2d");
  var grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, "#7c2f3d");
  grad.addColorStop(1, "#3d1620");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = "center";
  ctx.fillStyle = "#f4c948";
  ctx.font = "600 34px sans-serif";
  ctx.fillText(refLabel(h.book, h.chapter, h.verse), W/2, 150);

  ctx.fillStyle = "#fff9ef";
  ctx.font = '500 46px "Noto Serif KR", serif';
  var maxWidth = W - 160;
  var words = String(h.text).split(/\s+/);
  var lines = [];
  var cur = "";
  words.forEach(function(w){
    var test = cur ? cur + " " + w : w;
    if(ctx.measureText(test).width > maxWidth && cur){ lines.push(cur); cur = w; }
    else cur = test;
  });
  if(cur) lines.push(cur);
  var lineHeight = 66;
  var startY = H/2 - (lines.length * lineHeight)/2 + lineHeight/2;
  lines.forEach(function(line, i){ ctx.fillText(line, W/2, startY + i*lineHeight); });

  ctx.fillStyle = "rgba(255,255,255,0.65)";
  ctx.font = "400 24px sans-serif";
  ctx.fillText("말씀나눔 성경읽기", W/2, H-70);
  return canvas;
}
function shareVerseImage(h){
  var canvas = renderVerseCardCanvas(h);
  canvas.toBlob(function(blob){
    if(!blob){ showToast("이미지를 만들지 못했어요."); return; }
    var fileName = refLabel(h.book,h.chapter,h.verse).replace(/\s+/g,"_") + ".png";

      navigator.share({files:[file], title:refLabel(h.book,h.chapter,h.verse), text:h.text}).catch(function(){ /* 취소했을 수도 있으니 조용히 무시 */ });
    } else {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);

/* ---------- 폴더 연결 ---------- */
/* 폴더 핸들 기억 방식(File System Access API)은 일부러 쓰지 않는다 — 안드로이드 크롬처럼
   그 방식을 지원하는 브라우저에서도, 앱을 다시 열 때마다 권한이 유지되지 않아서 매번
   "이전 폴더 다시 연결하기" 버튼을 사용자가 직접 눌러야 하는 문제가 있었다(브라우저 보안 정책상
   권한 재요청은 반드시 클릭 안에서만 가능해서, 코드로는 건너뛸 수 없었다). 대신 항상
   <input webkitdirectory>로 연결하고 기기(IndexedDB)에 캐시해두는 방식만 쓰면, 다음부터는
   버튼 없이 완전히 자동으로(조용히) 다시 열린다. */
var supportsFSAccess = false;

function labelForFile(filenameNoExt){
  var lower = filenameNoExt.toLowerCase();
  if(labelMap[lower]) return labelMap[lower];
  if(KNOWN_LABELS[lower]) return KNOWN_LABELS[lower];
  return filenameNoExt;
}
/* 버전을 목록에 늘어놓을 때, 한글 성경(한글로 표시되는 것)을 영어 성경보다 앞에 오도록
   정렬한다 — 영어보다 한글로 읽고 대조하는 일이 많다는 요청에 따른 것. */
function isKoreanLabel(label){
  return /[ㄱ-ㆎ가-힣]/.test(label);
}
/* 대조 보기 오른쪽 번역본 고르기: 저장해 둔 것이 있으면 그것, 없으면 지금 번역본이 한글이면
   영어(NIV가 있으면 NIV), 영어면 한글 쪽에서 첫 번째 것을 고른다. 지금 번역본과 같으면 다른 것으로. */
function pickParallelVersion(saved){
  var keys = Object.keys(state.lfaFiles).filter(function(k){ return k !== state.version; });
  if(!keys.length) return null;
  if(saved && keys.indexOf(saved) >= 0) return saved;
  keys.sort(versionKeyCompare);
  var curKo = state.lfaFiles[state.version] ? isKoreanLabel(labelForFile(state.lfaFiles[state.version].displayName)) : true;
  var niv = keys.filter(function(k){ return /niv/i.test(k); })[0];
  if(curKo && niv) return niv;
  var other = keys.filter(function(k){ return isKoreanLabel(labelForFile(state.lfaFiles[k].displayName)) !== curKo; })[0];
  return other || keys[0];
}
function versionKeyCompare(a, b){
  var la = state.lfaFiles[a] ? labelForFile(state.lfaFiles[a].displayName) : a;
  var lb = state.lfaFiles[b] ? labelForFile(state.lfaFiles[b].displayName) : b;
  var ka = isKoreanLabel(la) ? 0 : 1, kb = isKoreanLabel(lb) ? 0 : 1;
  if(ka !== kb) return ka - kb;
  return la.localeCompare(lb, "ko");
}

/* 파일 경로 하나를 보고 성경 본문(.lfa)인지, 오디오(mp3 폴더 안의 .mp3)인지 판단한다.
   - 폴더 이름은 따지지 않는다: 압축을 풀 때 휴대폰이 같은 이름이 있으면 "bible(1)"처럼 바꿔
     만들기도 하는데, 이름을 bible로 고치지 않아도 그대로 연결되도록.
   - 몇 단계 안쪽에 있어도 찾는다: bible(1) 안에 bible 폴더가 또 있거나, 그 바깥 폴더를
     골라도 .lfa 파일과 mp3 폴더를 찾아서 연결한다.
   - 오디오는 경로 중간 어딘가에 "mp3" 폴더가 있고 파일이 .mp3이면 된다(mp3 폴더 밑에
     kornkrv_hs 같은 하위 폴더가 몇 단계 더 있어도 마지막 파일명만 보고 매칭). */
function classifyBiblePath(relPath){
  var parts = String(relPath).replace(/\\/g,"/").split("/").filter(Boolean);
  if(!parts.length) return null;
  var fname = parts[parts.length-1];
  var dirs = parts.slice(0, -1);
  if(/\.mp3$/i.test(fname)){
    for(var i=0;i<dirs.length;i++){ if(/^mp3$/i.test(dirs[i])) return {type:"mp3", name:fname.toLowerCase()}; }
    return null;
  }
  if(/\.lfa$/i.test(fname)){
    /* mp3 폴더 안에 잘못 들어간 .lfa 같은 건 무시 */
    for(var j=0;j<dirs.length;j++){ if(/^mp3$/i.test(dirs[j])) return null; }
    var key = fname.replace(/\.lfa$/i,"");
    return {type:"lfa", key:key.toLowerCase(), displayName:key, depth:dirs.length};
  }
  return null;
}

function indexFilesFromList(fileList){
  /* fileList: array of {name, relPath, file} or {name, relPath, handle}. mp3 항목은 file 대신
     handle(FileSystemFileHandle)일 수 있는데, 이건 scanDirectoryHandle()이 오디오를 미리 안 읽고
     지연 로딩하기 때문이다 — item.file || item.handle로 둘 다 받아서 getAudioFile()에서 필요할 때
     마저 읽는다. 같은 번역본(.lfa)이 여러 폴더에 있으면 가장 바깥(얕은) 쪽 하나만 쓴다. */
  var lfa = {}, mp3 = {};
  fileList.forEach(function(item){
    var c = classifyBiblePath(item.relPath || item.name || "");
    if(!c) return;
    if(c.type === "lfa"){
      var prev = lfa[c.key];
      if(!prev || c.depth < prev.depth) lfa[c.key] = {displayName:c.displayName, file:item.file, depth:c.depth};
    } else if(c.type === "mp3"){
      if(!(c.name in mp3)) mp3[c.name] = item.file || item.handle;
    }
  });
  return {lfa:lfa, mp3:mp3};
}

async function scanDirectoryHandle(dirHandle){
  /* mp3(오디오) 폴더 안의 파일들은 여기서 절대 entry.getFile()을 호출하지 않는다 —
     수백~천 개가 넘는 오디오 파일을 하나하나 다 읽으면(특히 모바일 SAF에서) 폴더를
     다시 연결할 때마다 30초~1분씩 걸릴 수 있다. 대신 핸들만 기억해두고, 실제로 그
     장을 열 때 getAudioFile()에서 그 파일 하나만 그때그때 읽는다(지연 로딩). */
  var files = [];
  async function walk(handle, path, insideMp3){
    for await (var entry of handle.values()){
      var entryPath = path + "/" + entry.name;
      if(entry.kind === "file"){
        if(insideMp3){
          if(/\.mp3$/i.test(entry.name)) files.push({name:entry.name, relPath:entryPath, handle:entry});
        } else {
          var f = await entry.getFile();
          files.push({name:entry.name, relPath:entryPath, file:f});
        }
      } else if(entry.kind === "directory"){
        await walk(entry, entryPath, insideMp3 || /^mp3$/i.test(entry.name));
      }
    }
  }
  await walk(dirHandle, dirHandle.name, false);
  return files;
}

function scanFileInputList(fileListRaw){
  var files = [];
  for(var i=0;i<fileListRaw.length;i++){
    var f = fileListRaw[i];
    var rel = f.webkitRelativePath || f.name;
    files.push({name:f.name, relPath:rel, file:f});
  }
  return files;
}

/* IndexedDB: dirHandle(FS Access API 지원 브라우저용) 저장소 + files/meta(그 외 브라우저의
   <input webkitdirectory> 방식용 — 선택한 파일을 통째로 기기에 저장해두고 다음부터는
   폴더를 다시 고르지 않고 그 캐시로 바로 연결한다) 저장소 */
var IDB_NAME = "bible_app_db", IDB_VERSION = 2;
var IDB_STORE = "handles";
var IDB_FILES_STORE = "files";
var IDB_META_STORE = "meta";
/* 연결을 매번 새로 열지 않고 재사용한다 — 안드로이드 등 모바일에서 짧은 시간에
   idbOpen()이 연달아 여러 번 호출되면(장을 넘길 때마다 오디오를 하나씩 불러오므로 흔함)
   연결이 꼬이거나 일시적으로 실패하는 경우가 있었는데, 이게 "오디오가 어떤 때는 보이고
   어떤 때는 안 보이는" 문제의 원인 중 하나였다. 연결을 캐시해 재사용하고, 끊기면(onclose/
   onversionchange) 캐시를 비워서 다음 호출이 새로 연다. */
var _idbConnPromise = null;
function idbOpen(){
  if(_idbConnPromise) return _idbConnPromise;
  _idbConnPromise = new Promise(function(resolve, reject){
    try{
      var req = indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded = function(){
        var db = req.result;
        if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        if(!db.objectStoreNames.contains(IDB_FILES_STORE)) db.createObjectStore(IDB_FILES_STORE);
        if(!db.objectStoreNames.contains(IDB_META_STORE)) db.createObjectStore(IDB_META_STORE);
      };
      req.onsuccess = function(){
        var db = req.result;
        db.onclose = function(){ if(_idbConnPromise === reqPromiseRef) _idbConnPromise = null; };
        db.onversionchange = function(){ try{ db.close(); }catch(e){} if(_idbConnPromise === reqPromiseRef) _idbConnPromise = null; };
        resolve(db);
      };
      req.onerror = function(){ _idbConnPromise = null; reject(req.error); };
    }catch(e){ _idbConnPromise = null; reject(e); }
  });
  var reqPromiseRef = _idbConnPromise;
  return _idbConnPromise;
}
function idbSet(key, val, storeName){
  storeName = storeName || IDB_STORE;
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(storeName,"readwrite");
        tx.objectStore(storeName).put(val, key);
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ resolve(false); };
      }catch(e){ resolve(false); }
    });
  }).catch(function(){ return false; });
}
/* 모바일에서는 IndexedDB 접근이 아주 가끔 일시적으로 실패할 수 있어서(특히 앱을
   백그라운드에 뒀다가 다시 열었을 때), 실패("오류")와 "정말 그 데이터가 없음"을
   구분해 오류일 때만 연결을 새로 열어 짧게 재시도한다. */
function idbGet(key, storeName, _retriesLeft){
  storeName = storeName || IDB_STORE;
  if(_retriesLeft === undefined) _retriesLeft = 2;
  var FAIL = {};
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(storeName,"readonly");
        var getReq = tx.objectStore(storeName).get(key);
        getReq.onsuccess = function(){ resolve(getReq.result != null ? getReq.result : null); };
        getReq.onerror = function(){ resolve(FAIL); };
        tx.onerror = function(){ resolve(FAIL); };
        tx.onabort = function(){ resolve(FAIL); };
      }catch(e){ resolve(FAIL); }
    });
  }).catch(function(){ return FAIL; }).then(function(result){
    if(result === FAIL){
      if(_retriesLeft > 0){
        _idbConnPromise = null;
        return new Promise(function(r){ setTimeout(r, 200); }).then(function(){
          return idbGet(key, storeName, _retriesLeft - 1);
        });
      }
      return null;
    }
    return result;
  });
}
function idbGetAll(storeName){
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(storeName,"readonly");
        var req = tx.objectStore(storeName).getAll();
        req.onsuccess = function(){ resolve(req.result || []); };
        req.onerror = function(){ resolve([]); };
      }catch(e){ resolve([]); }
    });
  }).catch(function(){ return []; });
}
function idbGetAllKeys(storeName, _retriesLeft){
  /* getAll()과 달리 파일(Blob) 내용을 읽지 않고 키 목록만 빠르게 가져온다 —
     오디오처럼 용량이 큰 파일이 많을 때 getAll()을 쓰면 수 분씩 걸릴 수 있어서
     "폴더가 연결되어 있는지" 확인할 때는 반드시 이 함수를 써야 한다. */
  if(_retriesLeft === undefined) _retriesLeft = 2;
  var FAIL = {};
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(storeName,"readonly");
        var req = tx.objectStore(storeName).getAllKeys();
        req.onsuccess = function(){ resolve(req.result || []); };
        req.onerror = function(){ resolve(FAIL); };
        tx.onerror = function(){ resolve(FAIL); };
        tx.onabort = function(){ resolve(FAIL); };
      }catch(e){ resolve(FAIL); }
    });
  }).catch(function(){ return FAIL; }).then(function(result){
    if(result === FAIL){
      if(_retriesLeft > 0){
        _idbConnPromise = null;
        return new Promise(function(r){ setTimeout(r, 200); }).then(function(){
          return idbGetAllKeys(storeName, _retriesLeft - 1);
        });
      }
      return [];
    }
    return result;
  });
}
function idbClearStore(storeName){
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(storeName,"readwrite");
        tx.objectStore(storeName).clear();
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ resolve(false); };
      }catch(e){ resolve(false); }
    });
  }).catch(function(){ return false; });
}
/* 선택한 파일들(성경 데이터 + MP3)을 통째로 기기에 저장 — <input webkitdirectory> 방식(폴더
   핸들을 기억할 수 없는 브라우저)에서도 다음부터 다시 고를 필요 없이 자동으로 열리게 해준다 */
function cacheFilesToIDB(rawFiles){
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(IDB_FILES_STORE, "readwrite");
        var store = tx.objectStore(IDB_FILES_STORE);
        store.clear();
        /* 성경 본문(.lfa)과 mp3 폴더의 오디오만 저장한다 — 실수로 다른 파일이 섞인 더 큰 폴더를
           골라도 쓸데없는 파일까지 기기에 복사하지 않도록 */
        rawFiles.forEach(function(item){ if(classifyBiblePath(item.relPath)) store.put(item, item.relPath); });
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ resolve(false); };
      }catch(e){ resolve(false); }
    });
  }).catch(function(){ return false; });
}

async function connectViaPicker(){
  if(!supportsFSAccess) throw new Error("unsupported");
  var handle = await window.showDirectoryPicker({ id:"bible-folder", mode:"read" });
  var files = await scanDirectoryHandle(handle);
  await idbSet("dirHandle", handle);
  return files;
}

function connectViaInput(){
  return new Promise(function(resolve, reject){
    var input = document.createElement("input");
    input.type = "file";
    input.webkitdirectory = true;
    input.directory = true;
    input.multiple = true;
    input.style.display = "none";
    document.body.appendChild(input);
    input.addEventListener("change", function(){
      if(input.files && input.files.length){
        resolve(scanFileInputList(input.files));
      } else {
        reject(new Error("no-selection"));
      }
      document.body.removeChild(input);
    });
    input.click();
  });
}

/* 브라우저 권한 재확인(requestPermission)은 반드시 사용자의 클릭(제스처) 안에서 호출해야 통과된다.
   그래서 부팅 시점에는 조용히 확인만(queryPermission) 하고, 권한이 사라졌으면
   "다시 연결하기" 버튼을 눌렀을 때 같은 폴더 핸들로 재요청한다 (새로 폴더를 고를 필요 없음).
   폴더 핸들 자체를 지원하지 않는 브라우저(대부분의 안드로이드/아이폰 브라우저)는
   처음 연결할 때 파일을 통째로 기기(IndexedDB)에 저장해두고, 그 캐시로 자동 복원한다. */
async function tryRestoreFromFileCache(){
  /* 오디오 파일까지 전부 getAll()로 읽어오면(수백 MB~1GB) 실제로 화면이 뜨기까지
     몇 분씩 걸릴 수 있다. 그래서 여기서는 "어떤 파일이 있는지" 목록(getAllKeys, 아주 빠름)만
     확인하고, 용량이 작은 성경 본문(.lfa)만 미리 읽어온 뒤, 오디오(mp3)는 실제로 그 장을
     열 때 그때그때 하나씩 불러온다(state.mp3LazyIndex + getAudioFile 참고). */
  try{
    var cachedAt = await idbGet("filesCachedAt", IDB_META_STORE);
    if(!cachedAt) return {status:"none"};
    var keys = await idbGetAllKeys(IDB_FILES_STORE);
    if(!keys || !keys.length) return {status:"none"};
    var lfaRawFiles = [];
    var mp3LazyIndex = {};
    for(var i=0;i<keys.length;i++){
      var c = classifyBiblePath(keys[i]);
      if(!c) continue;
      if(c.type === "lfa"){
        var item = await idbGet(keys[i], IDB_FILES_STORE);
        if(item) lfaRawFiles.push(item);
      } else if(c.type === "mp3"){
        if(!(c.name in mp3LazyIndex)) mp3LazyIndex[c.name] = keys[i];
      }
    }
    if(!lfaRawFiles.length) return {status:"none"};
    return {status:"granted-cached", lfaRawFiles:lfaRawFiles, mp3LazyIndex:mp3LazyIndex};
  }catch(e){ return {status:"none"}; }
}

async function silentRestoreConnection(){
  if(!supportsFSAccess) return await tryRestoreFromFileCache();
  try{
    var handle = await idbGet("dirHandle");
    if(!handle) return await tryRestoreFromFileCache();
    var perm = await handle.queryPermission({mode:"read"});
    if(perm === "granted"){
      var files = await scanDirectoryHandle(handle);
      return {status:"granted", files:files};
    }
    return {status:"needs-permission", handle:handle};
  }catch(e){ return await tryRestoreFromFileCache(); }
}

async function reRequestPermission(handle){
  var perm = await handle.requestPermission({mode:"read"});
  if(perm !== "granted") throw new Error("permission-denied");
  return await scanDirectoryHandle(handle);
}

async function clearSavedConnection(){
  try{ await idbSet("dirHandle", null); }catch(e){}
  await idbClearStore(IDB_FILES_STORE);
  await idbClearStore(IDB_META_STORE);
}

function applyScannedFiles(rawFiles){
  var idx = indexFilesFromList(rawFiles);
  state.lfaFiles = idx.lfa;
  state.mp3Files = idx.mp3;
  state.mp3LazyIndex = null; /* 폴더/파일을 직접 연결한 경우엔 이미 실제 File을 다 갖고 있어 필요 없음 */
  state.connected = Object.keys(idx.lfa).length > 0;
  return state.connected;
}

function applyCachedFiles(lfaRawFiles, mp3LazyIndex){
  var idx = indexFilesFromList(lfaRawFiles); /* lfaRawFiles엔 .lfa만 들어있음 */
  state.lfaFiles = idx.lfa;
  state.mp3Files = {}; /* 실제로 그 장을 열 때 getAudioFile()이 채워 넣음 */
  state.mp3LazyIndex = mp3LazyIndex || {};
  state.connected = Object.keys(idx.lfa).length > 0;
  return state.connected;
}

/* ---------- 성경 데이터 파싱 (JSZip) ---------- */
async function getZip(versionKey){
  if(state.zipCache[versionKey]) return state.zipCache[versionKey];
  var entry = state.lfaFiles[versionKey];
  if(!entry) throw new Error("version-not-found");
  var buf = await entry.file.arrayBuffer();
  var zip = await JSZip.loadAsync(buf);
  state.zipCache[versionKey] = zip;
  return zip;
}

var LFB_RE = /^\S+\s+(\d+):(\d+)\s+(.*)$/;

function findChapterEntry(zip, bookCode, chapter){
  var suffix = bookCode + "_" + chapter + ".lfb";
  var names = Object.keys(zip.files);
  for(var i=0;i<names.length;i++){
    if(names[i].toLowerCase().endsWith(suffix.toLowerCase())) return zip.files[names[i]];
  }
  return null;
}

async function getChapterVerses(versionKey, bookNum, chapter){
  var cacheKey = versionKey+"|"+bookNum+"|"+chapter;
  if(state.chapterCache[cacheKey]) return state.chapterCache[cacheKey];
  var zip = await getZip(versionKey);
  var book = bookByNum(bookNum);
  var entry = findChapterEntry(zip, book.code, chapter);
  if(!entry) return null;
  var text = await entry.async("text");
  var lines = text.split(/\r?\n/);
  var verses = [];
  lines.forEach(function(line){
    if(!line.trim()) return;
    var m = LFB_RE.exec(line.trim());
    if(m) verses.push({v:Number(m[2]), text:normalizeVerseText(m[3].replace(/^"|"$/g,"").trim())});
  });
  verses.sort(function(a,b){ return a.v-b.v; });
  state.chapterCache[cacheKey] = verses;
  return verses;
}

async function getChapterCount(versionKey, bookNum){
  var cacheKey = versionKey+"|"+bookNum;
  if(state.chapterCounts[cacheKey]) return state.chapterCounts[cacheKey];
  var zip = await getZip(versionKey);
  var book = bookByNum(bookNum);
  var re = new RegExp(book.code + "_(\\d+)\\.lfb$", "i");
  var max = 0;
  Object.keys(zip.files).forEach(function(name){
    var m = re.exec(name);
    if(m) max = Math.max(max, Number(m[1]));
  });
  state.chapterCounts[cacheKey] = max;
  return max;
}

/* ---------- 본문 전체 검색 ---------- */
/* 지금 보고 있는 버전 전체(66권)를 훑어서 검색용 색인을 한 번만 만들어 둔다(버전별로
   캐시). 이미 zip은 메모리에 있으니 각 장의 텍스트를 순서대로 꺼내 배열에 쌓기만 하면
   되고, 네트워크가 없으니 첫 검색 한 번만 조금 걸리고 그 다음부터는 즉시 검색된다. */
async function buildSearchIndex(versionKey){
  if(!state.searchIndex) state.searchIndex = {};
  if(state.searchIndex[versionKey]) return state.searchIndex[versionKey];
  var idx = [];
  for(var i=0;i<BOOKS.length;i++){
    var b = BOOKS[i];
    var total = await getChapterCount(versionKey, b.n);
    for(var c=1;c<=total;c++){
      var verses = await getChapterVerses(versionKey, b.n, c);
      if(verses){
        verses.forEach(function(v){ idx.push({book:b.n, chapter:c, verse:v.v, text:v.text}); });
      }
    }
  }
  state.searchIndex[versionKey] = idx;
  return idx;
}
function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function highlightMatchHtml(text, q){
  var esc = escapeHtml(text);
  var escQ = escapeHtml(q);
  if(!escQ) return esc;
  var idx = esc.indexOf(escQ);
  if(idx === -1) return esc;
  return esc.slice(0,idx) + "<mark>" + esc.slice(idx, idx+escQ.length) + "</mark>" + esc.slice(idx+escQ.length);
}

async function getAudioFile(bookNum, chapter){
  /* 오디오 파일명 규칙: 책번호_장번호.mp3. 책번호는 항상 2자리(01~66)지만, 장번호는
     실제 자료를 보면 0으로 채우지 않은 경우(01_1.mp3, 01_9.mp3)와 채운 경우(01_01.mp3)가
     둘 다 있을 수 있어서 두 가지 다 시도한다. */
  var keyPlain = pad2(bookNum) + "_" + chapter + ".mp3";
  var keyPadded = pad2(bookNum) + "_" + pad2(chapter) + ".mp3";
  var keys = keyPlain === keyPadded ? [keyPlain] : [keyPlain, keyPadded];
  for(var i=0;i<keys.length;i++){
    var raw = state.mp3Files[keys[i]];
    if(raw){
      /* 폴더를 직접 연결한 경우(FS Access API) mp3Files 안에는 아직 안 읽은
         FileSystemFileHandle이 들어있을 수 있다 — 이 장을 열 때 딱 하나만 여기서 읽는다 */
      if(typeof raw.getFile === "function"){
        try{
          var resolved = await raw.getFile();
          state.mp3Files[keys[i]] = resolved;
          return resolved;
        }catch(e){ /* 무시하고 다음 key 시도 */ }
      } else {
        return raw;
      }
    }
  }
  /* 캐시로 복원된 경우: 실제 오디오 데이터는 이 순간에 딱 하나만 IndexedDB에서 읽어온다
     (부팅할 때 전부 미리 읽지 않으므로 앱이 바로 켜진다) */
  for(var j=0;j<keys.length;j++){
    var key = keys[j];
    if(state.mp3LazyIndex && state.mp3LazyIndex[key]){
      try{
        var item = await idbGet(state.mp3LazyIndex[key], IDB_FILES_STORE);
        if(item && item.file){
          state.mp3Files[key] = item.file;
          return item.file;
        }
      }catch(e){ /* 무시 */ }
    }
  }
  return null;
}

/* ---------- 화면 렌더링 ---------- */
function updateCrumbs(){
  clear($crumbs);
  if(state.screen === "connect"){ $crumbs.style.display="none"; return; }
  $crumbs.style.display = "flex";
  var parts = [];
  if(state.screen === "reading" && state.fromAmsong){
    parts.push(el("button",{class:"amsong-back", title:"말씀암송 앱으로 돌아가기", onclick:backToAmsong},["‹ 암송으로"]));
  }
  parts.push(el("span",{class:"clickable crumb-home", title:"성경 목록으로", onclick:function(){ goLetters(); }},["📚 전체"]));
  if(state.book){
    var b = bookByNum(state.book);
    parts.push(el("span",{},["›"]));
    if(state.chapter){
      parts.push(el("span",{class:"clickable", onclick:function(){ goChapters(state.book); }},[b.ko]));
      parts.push(el("span",{},["›"]));
      if(state.screen === "reading"){
        parts.push(el("span",{class:"clickable", onclick:function(){ goVerses(state.book,state.chapter); }},[state.chapter+"장"]));
        /* 특정 절로 들어온 경우에만 "› n절"을 붙인다(장 전체를 열었을 때 끝에 "전체"를 또 붙이면
           맨 앞의 큰 "전체" 버튼과 헷갈리므로 생략) */
        if(state.targetVerse){
          parts.push(el("span",{},["›"]));
          parts.push(el("span",{},[targetLabel()+"절"]));
        }
      } else {
        parts.push(el("span",{},[state.chapter+"장"]));
      }
    } else {
      parts.push(el("span",{},[b.ko]));
    }
  }
  parts.forEach(function(p){ $crumbs.appendChild(p); });
}

function updateHeaderForConnected(){
  $menuBtn.style.display = "flex";
  $searchIconBtn.style.display = "flex";
  $versionSelect.style.display = "inline-block";
  clear($versionSelect);
  var keys = Object.keys(state.lfaFiles).sort(versionKeyCompare);
  /* kornkrv를 기본 상단에 */
  keys.sort(function(a,b){
    if(a===AUDIO_VERSION_HINT) return -1;
    if(b===AUDIO_VERSION_HINT) return 1;
    return 0;
  });
  keys.forEach(function(k){
    var opt = el("option",{value:k},[labelForFile(state.lfaFiles[k].displayName)]);
    $versionSelect.appendChild(opt);
  });
  if(state.version && keys.indexOf(state.version)>=0) $versionSelect.value = state.version;
  else if(keys.length){ state.version = keys[0]; $versionSelect.value = state.version; }
  $brand.textContent = "말씀나눔 성경읽기";

}

/* 앱을 새로 켤 때는 지난번에 무엇을 보았든 항상 개역개정으로 시작한다
   (다른 번역본은 읽는 동안 위 목록이나 "⇆ 대조"로 골라 보면 되고, 대조할 번역본은 기억해 둔다) */
function useDefaultVersion(){
  var keys = Object.keys(state.lfaFiles), pick = null;
  for(var i=0;i<keys.length && !pick;i++){ if(keys[i].toLowerCase() === "kornkrv") pick = keys[i]; }
  for(var j=0;j<keys.length && !pick;j++){ if(keys[j] === "개역개정" || keys[j].toLowerCase().indexOf("kornkrv") >= 0) pick = keys[j]; }
  if(pick){ state.version = pick; $versionSelect.value = pick; }
}

function goVerses(bookNum, chapter){ state.screen="verses"; state.book=bookNum; state.chapter=chapter; state.targetVerse=null; state.targetVerses=null; render(); }
function goReading(bookNum, chapter, targetVerse, targetVerses){

async function onConnectClick(){
  var errBox = document.getElementById("connectError");
  errBox.style.display = "none";
  try{
    var files;
    var usedInput = false;
    if(supportsFSAccess){
      try{ files = await connectViaPicker(); }
      catch(e){
        if(e && e.name === "AbortError") return;
        files = await connectViaInput();
        usedInput = true;
      }
    } else {
      files = await connectViaInput();
      usedInput = true;
    }
    var ok = applyScannedFiles(files);
    if(!ok){
      errBox.textContent = "고른 폴더에서 성경 자료(.lfa 파일)를 찾지 못했어요. bible.zip 압축을 먼저 푼 다음, 압축을 풀어서 생긴 폴더(이름이 bible 또는 bible(1) 등)를 골라주세요.";
      errBox.style.display = "block";
      return;
    }
    state._pendingReconnectHandle = null;
    updateHeaderForConnected();
    if(!applyPendingGo()) goLetters();
    if(usedInput) cacheFilesInBackground(files);
  }catch(e){
    if(e && e.message === "no-selection") return;
    errBox.textContent = "폴더를 연결하는 중 문제가 발생했어요: " + (e && e.message ? e.message : e);
    errBox.style.display = "block";
  }
}

/* 폴더 핸들을 기억 못 하는 브라우저용: 선택한 파일을 화면 전환 후 백그라운드로 기기에 저장해서
   다음부터는 폴더를 다시 고르지 않아도 자동으로 열리게 한다. 읽기 시작을 막지 않기 위해
   goLetters() 이후, 읽는 도중에 조용히 진행된다. */
function cacheFilesInBackground(files){
  if($cacheBanner){
    $cacheBanner.style.display = "flex";
    $cacheBanner.querySelector("span").textContent = "💾 다음에도 자동으로 열리도록 저장하는 중… (창을 닫지 말아주세요)";
  }
  cacheFilesToIDB(files).then(function(success){
    if(success){
      idbSet("filesCachedAt", Date.now(), IDB_META_STORE);
      if($cacheBanner){
        $cacheBanner.querySelector("span").textContent = "✅ 저장 완료! 다음부터는 자동으로 열려요.";
        setTimeout(function(){ if($cacheBanner) $cacheBanner.style.display = "none"; }, 3000);
      }
    } else if($cacheBanner){
      $cacheBanner.querySelector("span").textContent = "⚠️ 저장 공간 부족 등으로 자동 연결 저장에 실패했어요. 다음에 열 때 다시 연결해주세요.";
      setTimeout(function(){ if($cacheBanner) $cacheBanner.style.display = "none"; }, 5000);
    }
  });
}

async function onReconnectClick(){
  var errBox = document.getElementById("connectError");
  errBox.style.display = "none";
  try{
    var files = await reRequestPermission(state._pendingReconnectHandle);
    var ok = applyScannedFiles(files);
    if(!ok){
      errBox.textContent = "고른 폴더에서 성경 자료(.lfa 파일)를 찾지 못했어요. bible.zip 압축을 먼저 푼 다음, 압축을 풀어서 생긴 폴더(이름이 bible 또는 bible(1) 등)를 골라주세요.";
      errBox.style.display = "block";
      return;
    }
    state._pendingReconnectHandle = null;
    updateHeaderForConnected();
    if(!applyPendingGo()) goLetters();
  }catch(e){
    errBox.textContent = "권한이 거절되었어요. '다른 폴더 새로 선택'을 눌러 다시 골라주세요.";

function categoryIndexForBook(n){
  for(var i=0;i<BOOK_CATEGORIES.length;i++){
    var c = BOOK_CATEGORIES[i];
    if(n >= c.from && n <= c.to) return i;
  }
  return -1;
}

/* 첫 화면(책 목록) 보기 방식: "category"(분류별, 기본) / "simple"(구약·신약 탭 + 간단 목록)
   — 성경의 분류(모세오경·역사서…)에 익숙하지 않은 분들은 간단 목록이 더 편하다고 해서 고를 수 있게 함 */
var LS_LISTMODE = "bible_listmode_v1", LS_LISTTAB = "bible_listtab_v1";
function getListMode(){ return lsGet(LS_LISTMODE, "category") === "simple" ? "simple" : "category"; }
function listModeSwitch(){
  var mode = getListMode();
  function b(key, label){
    return el("button",{class: mode === key ? "on" : "", onclick:function(){ if(getListMode() !== key){ lsSet(LS_LISTMODE, key); window.scrollTo(0,0); render(); } }},[label]);
  }
  return el("div",{class:"list-mode"},[ b("category","📚 분류별 보기"), b("simple","📋 구약·신약 목록") ]);
}
function renderLettersSimple(){
  var wrap = el("div",{});
  wrap.appendChild(listModeSwitch());
  var tab = lsGet(LS_LISTTAB, "OT") === "NT" ? "NT" : "OT";
  var tabs = el("div",{class:"ot-nt-tabs"});
  var list = el("div",{class:"simple-list"});
  function tabBtn(key, label, count){
    return el("button",{class: tab === key ? "on" : "", onclick:function(){ if(tab !== key){ lsSet(LS_LISTTAB, key); window.scrollTo(0,0); render(); } }},[label, el("small",{},[count + "권"])]);
  }
  tabs.appendChild(tabBtn("OT","구약",39));
  tabs.appendChild(tabBtn("NT","신약",27));
  wrap.appendChild(tabs);
  BOOKS.filter(function(b){ return tab === "OT" ? b.n <= 39 : b.n >= 40; }).forEach(function(b){
    var pg = el("span",{class:"pg"},[""]);
    var row = el("div",{class:"simple-row", id:"book-row-"+b.n, onclick:function(){ goChapters(b.n); }},[
      el("span",{class:"nm"},[b.ko, el("small",{},[b.en])]), pg
    ]);
    list.appendChild(row);
    getChapterCount(state.version, b.n).then(function(total){
      var read = bookReadCount(b.n, total);
      clear(pg);
      if(read > 0){ pg.appendChild(el("b",{},[String(read)])); pg.appendChild(document.createTextNode(" / " + total)); }
      else pg.appendChild(document.createTextNode(total + "장"));
    });
  });
  wrap.appendChild(list);
  $main.appendChild(wrap);
  /* 탭 줄은 헤더 바로 밑에 붙어 있게(헤더 높이가 바뀌어도 다시 맞춤) */
  function syncTop(){ var h = document.querySelector("header"); tabs.style.top = (h ? h.offsetHeight : 0) + "px"; }
  requestAnimationFrame(syncTop);
  var hdr = document.querySelector("header");
  if(window.ResizeObserver && hdr){ state._jumpBarRO = new ResizeObserver(syncTop); state._jumpBarRO.observe(hdr); }
}

function renderLetters(){
  if(getListMode() === "simple") return renderLettersSimple();
  /* 구약(1~39권) / 신약(40~66권)으로 나누어 66권 전체를 빠짐없이 보여준다.
     맨 위는 이제 "오늘의 통독" 카드 대신 분류 칩이 차지한다 — 목회자가 설교 중
     이 책 저 책을 오가며 찾을 때도 스크롤 없이 바로 이동할 수 있도록 하기 위함. */
  var wrap = el("div",{});
  var OT = BOOKS.filter(function(b){ return b.n <= 39; });
  var NT = BOOKS.filter(function(b){ return b.n >= 40; });

  /* 66권을 다 스크롤하지 않고도 원하는 구간(모세오경/역사서/... )으로 바로 이동할 수 있는
     분류 칩 — 화면 맨 위, 헤더 바로 아래에 붙어(sticky) 66권 목록을 아무리 오르내려도
     항상 그 자리에 남아 있는다. 창세기→요한계시록 순서 자체는 바뀌지 않고, 그 순서 안에서
     원하는 위치로 스크롤만 대신 해주는 것이다. */
  function scrollToBook(n){
    var target = document.getElementById("book-row-" + n);
    if(!target) return;
    var headerEl = document.querySelector("header");
    var offset = (headerEl ? headerEl.offsetHeight : 0) + jumpBar.offsetHeight + 10;
    var top = target.getBoundingClientRect().top + window.scrollY - offset;
    window.scrollTo({top: Math.max(0, top), behavior:"smooth"});
  }
  var jumpBar = el("div",{class:"book-jump-bar"});
  var chipEls = new Array(BOOK_CATEGORIES.length);
  function buildJumpRow(testament){
    var row = el("div",{class:"book-jump-row"});
    row.appendChild(el("span",{class:"book-jump-tlabel"},[testament]));
    BOOK_CATEGORIES.forEach(function(cat, idx){
      if(cat.testament !== testament) return;
      var chip = el("button",{class:"book-jump-chip", onclick:function(){ scrollToBook(cat.from); setActiveChip(idx); }},[cat.label]);
      chipEls[idx] = chip;
      row.appendChild(chip);
    });
    return row;
  }
  jumpBar.appendChild(buildJumpRow("구약"));
  jumpBar.appendChild(buildJumpRow("신약"));
  wrap.appendChild(listModeSwitch());
  wrap.appendChild(jumpBar);
  /* 헤더(상단 타이틀줄) 바로 밑에 자리를 잡도록, sticky 위치를 헤더 높이만큼 내려준다.
     (둘 다 top:0으로 두면 스크롤시 서로 겹쳐버린다) */
  /* 헤더도 sticky라서, 분류 칩 바는 헤더 높이만큼 아래에 붙어야 겹치지 않는다. 헤더 높이는
     "저장 완료"·"새 버전" 안내가 나타나거나 사라질 때 바뀌므로, 높이가 바뀔 때마다 다시 맞춘다
     (안 그러면 안내가 사라진 뒤 헤더와 칩 사이에 빈 틈이 생긴다). */
  function syncJumpBarTop(){
    var headerEl = document.querySelector("header");
    jumpBar.style.top = (headerEl ? headerEl.offsetHeight : 0) + "px";
  }
  requestAnimationFrame(syncJumpBarTop);
  if(window.ResizeObserver){
    var headerForRO = document.querySelector("header");
    if(headerForRO){
      var jumpBarRO = new ResizeObserver(function(){ syncJumpBarTop(); });
      jumpBarRO.observe(headerForRO);
      state._jumpBarRO = jumpBarRO;
    }
  }

  function renderSection(title, count, books){
    wrap.appendChild(el("div",{class:"section-title"},[title + " · " + count + "권"]));
    var list = el("div",{class:"book-list"});
    books.forEach(function(b){
      var row = el("div",{class:"book-row", id:"book-row-"+b.n, onclick:function(){ goChapters(b.n); }});
      row.appendChild(el("div",{style:"min-width:0;"},[
        el("div",{class:"name"},[el("span",{class:"bn"},[String(b.n)]), b.ko]),
        el("div",{class:"sub"},[b.en])
      ]));
      var pill = el("div",{class:"progress", id:"prog-"+b.n},["…"]);
      var barFill = el("i",{});
      row.appendChild(el("div",{class:"prog-wrap"},[pill, el("div",{class:"prog-bar"},[barFill])]));
      list.appendChild(row);
      getChapterCount(state.version, b.n).then(function(total){
        var read = bookReadCount(b.n, total);
        clear(pill);
        pill.appendChild(el("b",{},[String(read)]));
        pill.appendChild(document.createTextNode(" / " + total + "장"));
        barFill.style.width = (total ? Math.round(read / total * 100) : 0) + "%";
      });
    });
    wrap.appendChild(list);
  }

  renderSection("구약", OT.length, OT);
  renderSection("신약", NT.length, NT);
  $main.appendChild(wrap);

  /* 지금 화면에 보이는 책이 어느 분류인지 칩에 표시해준다(스크롤-스파이) — 66권을
     오르내리다가 지금 내가 어디쯤 있는지 한눈에 알 수 있어서, 설교 중 이 책 저 책을
     오갈 때 특히 도움이 된다. 분류 칩 바로 아래(화면에서 가장 위쪽에 걸쳐 있는) 책이
     "지금 보고 있는 책"이라고 보고, 스크롤할 때마다 다시 계산한다. */
  function setActiveChip(idx){
    chipEls.forEach(function(c,i){ if(c) c.classList.toggle("active", i===idx); });
  }
  var rows = wrap.querySelectorAll(".book-row");
  var scrollSpyTicking = false;
  function updateActiveChipFromScroll(){
    scrollSpyTicking = false;
    if(!rows.length) return;
    var current = rows[0];
    /* 맨 아래(요한계시록 부근)까지 스크롤하면, 남은 내용이 얼마 없어서 마지막 책의 위쪽을
       기준선까지 끌어올릴 "공간"이 부족할 수 있다 — 그럴 땐 기준선 계산 대신 그냥 마지막
       책을 "지금 보고 있는 책"으로 본다. */
    var atBottom = (window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 2);
    if(atBottom){
      current = rows[rows.length - 1];
    } else {
      var headerEl = document.querySelector("header");
      var lineY = (headerEl ? headerEl.offsetHeight : 0) + jumpBar.offsetHeight + 2;
      for(var i=0;i<rows.length;i++){
        if(rows[i].getBoundingClientRect().top <= lineY) current = rows[i];
        else break; /* book-row는 항상 위→아래 순서이므로, 기준선을 넘는 순간 이전 것이 정답 */
      }
    }
    var idx = categoryIndexForBook(Number(current.id.replace("book-row-","")));
    if(idx >= 0) setActiveChip(idx);
  }
  function onBookListScroll(){
    if(!scrollSpyTicking){ scrollSpyTicking = true; requestAnimationFrame(updateActiveChipFromScroll); }
  }
  window.addEventListener("scroll", onBookListScroll, {passive:true});
  state._bookListScrollHandler = onBookListScroll;
  requestAnimationFrame(updateActiveChipFromScroll);
}

function renderChapters(){

  var grid = el("div",{class:"chapter-grid", id:"chapterGrid"});

function renderVerses(){
  var book = bookByNum(state.book);
  var wrap = el("div",{});
  var headRow = el("div",{class:"row", style:"justify-content:space-between; margin-bottom:4px;"},[

    var parSelect = el("select",{"aria-label":"대조할 번역본"});

    /* 대조 보기일 때: 두 번역본의 절 번호를 합쳐서(한쪽에만 있는 절도 빠짐없이) 순서대로 한 줄씩 */
    var byNum2 = {};

      var row = el("div",{class:"verse-row"+(parOn?" parallel":"")+(!parOn && /[가-힣]/.test(v.text||"") ? " ko" : "")+(isTarget?" highlight":"")+(marked?" user-mark":""), "data-v":String(v.v)});

      var copyBtn = el("button",{class:"verse-copy-btn", title:"복사", style:marked?"":"display:none;", onclick:function(e){
        e.stopPropagation();

        var payload = h ? formatHighlightForCopy(h) : (refLabel(state.book, state.chapter, v.v) + " " + v.text);
        copyText(payload).then(function(){
          showToast("복사됐어요 — 묵상 노트에 붙여넣으세요");

      btnHolder.appendChild(copyBtn);
      var imageBtn = el("button",{class:"verse-copy-btn", title:"이미지로 공유", style:marked?"":"display:none;", onclick:function(e){
        e.stopPropagation();

        if(h) shareVerseImage(h);
      }},["🖼️"]);
      btnHolder.appendChild(imageBtn);
      /* 본문 터치 동작: 짧게 터치하면 위/아래 바를 숨기거나 다시 보이게 하고(넓게 보기 전환),

         경우는 둘 다 무시한다. 복사/이미지 아이콘을 누른 경우도 제외한다. */
      (function(){

           (이어서 여러 구절을 고르는 중이므로) 0.1초만 눌러도 바로 선택/해제되어 쭉쭉 고를 수 있다. */
        var FIRST_PRESS_MS = 300, NEXT_PRESS_MS = 100, MOVE_TOLERANCE = 10;

          startX = e.clientX; startY = e.clientY;
          selectingAtPress = isSelecting();
          clearPressTimer();
          pressTimer = setTimeout(function(){
            pressTimer = null;
            if(!pointerActive || cancelled) return;
            longPressFired = true;
            doHighlightToggle();
          }, selectingAtPress ? NEXT_PRESS_MS : FIRST_PRESS_MS);
        });
        row.addEventListener("pointermove", function(e){
          if(!pointerActive || cancelled) return;
          if(Math.abs(e.clientX - startX) > MOVE_TOLERANCE || Math.abs(e.clientY - startY) > MOVE_TOLERANCE){
            cancelled = true; clearPressTimer();

          if(!pointerActive) return;
