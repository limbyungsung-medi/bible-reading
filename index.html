<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말씀나눔 성경읽기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<style>
  :root{
    /* 종이(라이트): 가죽 성경의 면지를 닮은 서늘한 아이보리 */
    --bg:#f5f3ec; --surface:#ffffff; --border:#e2ddcf; --text:#241f1a; --text-dim:#78705f;
    /* 리본 책갈피(버건디) + 금박 페이지 끝(골드) — 두 개의 역할이 다른 강조색 */
    --accent:#7c2f3d; --accent-soft:#f4e4e6; --read:#b8873a; --read-text:#fff9ef;
    /* 묵상 하이라이트(형광펜): 성경 본문에서 사용자가 직접 표시하는 구절 */
    --mark-bg:#fdf0a8; --mark-border:#d9b93f;
    --danger:#a4402f; --shadow:0 1px 2px rgba(36,31,26,.06),0 6px 16px rgba(36,31,26,.06);
    --error-bg:#fbe9e4;
    --ctrl-border:#c9be9f; --ctrl-bg:#ffffff;
    --font-serif:"Source Serif 4",Georgia,"Noto Serif KR",serif;
    --font-ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      /* 어두운 가죽 장정 */
      --bg:#181410; --surface:#231d17; --border:#382f24; --text:#ece4d6; --text-dim:#a89a83;
      --accent:#d98a97; --accent-soft:#3a2229; --read:#d1a75c; --read-text:#211705;
      --mark-bg:#4a3f14; --mark-border:#8a7326;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.3);
      --danger:#e2917e;
      --error-bg:#392019;
      --ctrl-border:#8a7a63; --ctrl-bg:#332a20;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#181410; --surface:#231d17; --border:#382f24; --text:#ece4d6; --text-dim:#a89a83;
    --accent:#d98a97; --accent-soft:#3a2229; --read:#d1a75c; --read-text:#211705;
    --mark-bg:#4a3f14; --mark-border:#8a7326;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.3);
    --danger:#e2917e;
    --error-bg:#392019;
    --ctrl-border:#8a7a63; --ctrl-bg:#332a20;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:var(--font-ui); font-variant-numeric:tabular-nums;}
  #app{max-width:720px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  header{position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--border); padding:10px 14px;}
  .topbar{display:flex; align-items:center; gap:8px;}
  .brand{font-family:var(--font-serif); font-weight:600; font-size:16px; letter-spacing:.2px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  select, button{font-family:inherit;}
  .btn{border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:10px; padding:8px 12px; font-size:13px; cursor:pointer;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .btn-ghost{background:transparent; border-color:transparent;}
  .icon-btn{min-width:38px; height:38px; padding:0 8px; display:flex; align-items:center; justify-content:center; border-radius:9px; border:1.5px solid var(--ctrl-border); background:var(--ctrl-bg); color:var(--text); cursor:pointer; font-size:18px; font-weight:700; box-shadow:var(--shadow);}
  select.version-select{border:1.5px solid var(--ctrl-border); background:var(--ctrl-bg); color:var(--text); border-radius:10px; padding:7px 8px; font-size:13px; font-weight:600; max-width:150px; box-shadow:var(--shadow);}
  .crumbs{display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12.5px; color:var(--text-dim); overflow-x:auto; white-space:nowrap;}
  .update-banner{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; padding:8px 12px; background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px; font-size:12.5px; color:var(--text);}
  .inapp-banner{display:none; flex-direction:column; align-items:flex-start; gap:8px; margin-top:8px; padding:10px 12px; background:var(--error-bg); border:1px solid var(--danger); border-radius:10px; font-size:12.5px; color:var(--text); line-height:1.6;}
  .inapp-banner .title{font-weight:700; color:var(--danger);}
  .inapp-banner .btn{margin-top:2px;}
  .crumbs span.clickable{cursor:pointer; color:var(--accent);}
  main{flex:1; padding:16px 14px 90px;}
  .center-pane{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; text-align:center; gap:14px; padding:20px;}
  .center-pane h1{font-size:20px; margin:0;}
  .center-pane p{color:var(--text-dim); font-size:13.5px; line-height:1.6; margin:0; max-width:380px;}
  .section-title{font-size:12.5px; color:var(--text-dim); margin:18px 0 8px; font-weight:600; letter-spacing:.3px;}
  .book-list{display:flex; flex-direction:column; gap:8px;}
  .book-row{display:flex; align-items:center; justify-content:space-between; padding:13px 14px; background:var(--surface); border:1px solid var(--border); border-radius:12px; cursor:pointer; box-shadow:var(--shadow);}
  .book-row .name{font-size:15px; font-weight:600;}
  .book-row .sub{font-family:var(--font-serif); font-style:italic; font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .book-row .progress{font-family:var(--font-serif); font-size:11.5px; color:var(--accent); font-weight:600;}
  .chapter-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
  .chapter-btn{font-family:var(--font-serif); aspect-ratio:1; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .chapter-btn.read{background:var(--read); border-color:var(--read); color:var(--read-text);}
  .verse-btn{font-family:var(--font-serif); aspect-ratio:1; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .verse-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:7px;}
  .verse-row.highlight{background:var(--accent-soft); border-radius:8px; scroll-margin-top:70px;}
  .verse-view{display:flex; flex-direction:column; gap:2px;}
  .verse-row{display:flex; gap:8px; padding:7px 2px; font-size:var(--verse-font-size,16px); line-height:1.75; border-radius:8px; cursor:pointer; align-items:flex-start;}
  .verse-row.user-mark{background:var(--mark-bg); box-shadow:inset 2px 0 0 var(--mark-border);}
  .verse-num{font-family:var(--font-serif); color:var(--accent); font-weight:700; font-size:12.5px; min-width:22px; padding-top:3px;}
  .verse-text{flex:1;}
  .verse-copy-btn{flex:none; border:none; background:transparent; color:var(--mark-border); font-size:15px; padding:2px 4px; cursor:pointer; line-height:1;}
  .toast{position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(8px); z-index:40; background:var(--text); color:var(--bg); padding:9px 18px; border-radius:100px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease; max-width:80%; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .highlight-item{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--mark-border); border-radius:10px; padding:10px 12px; margin-bottom:8px;}
  .highlight-item .ref{font-family:var(--font-serif); font-size:11.5px; color:var(--accent); font-weight:700; margin-bottom:4px;}
  .highlight-item .txt{font-size:14px; line-height:1.6; margin-bottom:6px;}
  .highlight-item .txt mark{background:var(--mark-bg); color:inherit; padding:0 1px; border-radius:2px;}
  .highlight-item textarea{width:100%; margin-bottom:8px; border:1px solid var(--border); border-radius:8px; padding:7px 8px; font-size:12.5px; font-family:inherit; background:var(--bg); color:var(--text); resize:vertical; min-height:42px;}
  .search-range-label{font-size:11.5px; color:var(--text-dim); margin:10px 0 4px;}
  .search-range-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .search-range-chips .chip{font-size:11.5px; padding:5px 11px; border-radius:100px; border:1.5px solid var(--ctrl-border); background:var(--ctrl-bg); color:var(--text-dim); cursor:pointer;}
  .search-range-chips .chip.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .search-range-select-row{display:flex; align-items:center; gap:6px; margin-bottom:10px;}
  .search-range-select-row select{flex:1; min-width:0; border:1.5px solid var(--ctrl-border); background:var(--ctrl-bg); color:var(--text); border-radius:8px; padding:7px 6px; font-size:12.5px;}
  .search-range-select-row .tilde{color:var(--text-dim); font-size:12px;}
  /* 성경읽기 화면 "넓게 보기": 위(헤더)·아래(이전/다음장, 오디오, 선택바)를 다 숨기고
     본문만 크게 본다. 되돌리는 버튼은 항상 화면 위에 떠 있어야 하므로 숨김 대상에서 뺀다. */
  body.immersive header, body.immersive .chapter-nav, body.immersive .audio-bar, body.immersive .selection-bar{display:none !important;}
  body.immersive main{padding:14px 14px 24px;}
  .immersive-toggle{position:fixed; top:10px; right:10px; z-index:9; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1.5px solid var(--ctrl-border); background:var(--ctrl-bg); color:var(--text); box-shadow:var(--shadow); font-size:16px; cursor:pointer;}
  .highlight-item .actions{display:flex; gap:6px;}
  .highlight-item .actions button{font-size:11.5px; padding:5px 10px;}
  .selection-bar{position:fixed; left:0; right:0; z-index:7; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; background:var(--mark-bg); border-top:1px solid var(--mark-border); box-shadow:var(--shadow); font-size:12.5px; color:var(--text); max-width:720px; margin:0 auto;}
  .selection-bar .btn{font-size:11.5px; padding:6px 10px;}
  .fontsize-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:12px;}
  .fontsize-row .label{font-size:13px; font-weight:600;}
  .fontsize-row .controls{display:flex; align-items:center; gap:6px;}
  .fontsize-row .controls span{font-size:13px; font-weight:600; min-width:38px; text-align:center;}
  .plan-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:16px; box-shadow:var(--shadow);}
  .plan-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .plan-title{font-weight:700; font-size:14px;}
  .plan-streak{font-size:12px; color:var(--accent); font-weight:700;}
  .plan-refs{font-family:var(--font-serif); font-size:15px; margin-bottom:10px;}
  .plan-bar-outer{background:var(--bg); border-radius:100px; height:8px; overflow:hidden; border:1px solid var(--border);}
  .plan-bar-inner{background:var(--accent); height:100%; border-radius:100px; transition:width .3s ease;}
  .plan-progress-text{font-size:11px; color:var(--text-dim); margin-top:5px;}
  .plan-done{font-size:12.5px; color:var(--accent); font-weight:700; margin-top:8px;}
  .audio-bar{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--border); padding:10px 14px; display:flex; align-items:center; gap:10px; max-width:720px; margin:0 auto;}
  .audio-bar audio{flex:1; height:32px;}
  .chapter-nav{position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--surface); border-top:1px solid var(--border); padding:10px 14px; display:flex; gap:8px; max-width:720px; margin:0 auto;}
  .chapter-nav .btn{flex:1;}
  .empty-hint{color:var(--text-dim); font-size:13px; text-align:center; padding:30px 10px;}
  .badge{display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:100px; background:var(--accent-soft); color:var(--accent); font-weight:700; margin-left:6px;}
  .setup-steps{text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.9; color:var(--text-dim); max-width:380px;}
  .setup-steps b{color:var(--text);}
  .error-box{background:var(--error-bg); border:1px solid #f0c4b3; color:var(--danger); border-radius:10px; padding:10px 12px; font-size:12.5px; max-width:380px;}
  .rename-input{border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:8px; padding:6px 8px; font-size:13px; width:100%;}
  .version-item{display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:10px; margin-bottom:6px;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:20; display:flex; align-items:flex-end; justify-content:center;}
  .modal-sheet{background:var(--surface); width:100%; max-width:720px; border-radius:16px 16px 0 0; padding:16px; max-height:78vh; overflow-y:auto;}
  .modal-sheet h3{margin:0 0 12px; font-size:15px;}
  .spinner{width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .row{display:flex; align-items:center; gap:8px;}
  .stat-pill{font-size:11px; color:var(--text-dim); background:var(--accent-soft); padding:3px 9px; border-radius:100px;}
</style>

/* ---------- 통독 계획(1년, 날짜 기준) ---------- */
/* 66권을 정해진 순서(창세기→요한계시록) 그대로 이어 붙인 뒤, 총 1189장을 365일로
   고르게 나눈다. 교회 성도들이 같은 날짜에 같은 본문을 읽도록, 오늘 날짜(1월 1일=1일째)를
   그대로 계획의 날짜로 쓴다 — 언제 시작했는지와 상관없이 모두가 같은 날 같은 본문을 읽는다. */
var ALL_CHAPTERS = (function(){
  var list = [];
  BOOKS.forEach(function(b){
    for(var c=1;c<=b.stdChapters;c++) list.push({book:b.n, chapter:c});
  });
  return list;
})();
var BIBLE_TOTAL_CHAPTERS = ALL_CHAPTERS.length; /* 1189 */
var READING_PLAN_DAYS = 365;
function planDayIndexForDate(date){
  var start = new Date(date.getFullYear(), 0, 0);
  var diff = date - start;
  var oneDay = 1000 * 60 * 60 * 24;
  var dayOfYear = Math.floor(diff / oneDay); /* 1월1일 = 1 */
  return Math.min(dayOfYear, READING_PLAN_DAYS) - 1; /* 0-based, 윤년 12/31은 365일째 몫에 포함 */
}
function planChaptersForDayIndex(idx){
  var from = Math.floor(idx * BIBLE_TOTAL_CHAPTERS / READING_PLAN_DAYS);
  var to = Math.floor((idx+1) * BIBLE_TOTAL_CHAPTERS / READING_PLAN_DAYS);
  return ALL_CHAPTERS.slice(from, to);
}
function todaysPlanChapters(){
  return planChaptersForDayIndex(planDayIndexForDate(new Date()));
}
/* 오늘 읽을 본문을 "창세기 34~37장" 처럼 사람이 읽기 좋은 형태로 묶어준다 */
function formatPlanChapters(chapterList){
  var parts = [];
  var i = 0;
  while(i < chapterList.length){
    var start = chapterList[i];
    var end = start;
    var j = i+1;
    while(j < chapterList.length && chapterList[j].book === end.book && chapterList[j].chapter === end.chapter+1){
      end = chapterList[j]; j++;
    }
    var book = bookByNum(start.book);
    if(start.chapter === end.chapter) parts.push(book.ko + " " + start.chapter + "장");
    else parts.push(book.ko + " " + start.chapter + "~" + end.chapter + "장");
    i = j;
  }
  return parts.join(", ");
}
function overallPlanProgress(){
  var read = 0;
  ALL_CHAPTERS.forEach(function(c){ if(isRead(c.book, c.chapter)) read++; });
  return {read:read, total:BIBLE_TOTAL_CHAPTERS, pct: Math.round(read / BIBLE_TOTAL_CHAPTERS * 1000) / 10};
}
/* 오늘(또는 아직 오늘 안 읽었다면 어제까지) 기준으로 며칠 연속 읽었는지 */
function currentStreakDays(){
  var d = new Date();
  if(!readDatesMap[todayStr()]) d.setDate(d.getDate()-1); /* 오늘 아직 안 읽었으면 어제부터 거슬러 확인 */
  var streak = 0;
  while(true){
    var key = d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
    if(!readDatesMap[key]) break;
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

/* ---------- 하이라이트(묵상 구절 표시) ---------- */
/* 버전에 상관없이(개역개정/새번역 등 어느 걸 읽든) 같은 절이면 같은 표시로 남도록
   isRead와 같은 방식으로 책+장+절만으로 키를 만든다. 절 본문(text)은 나중에 모아보기 화면과
   복사 기능에서 다시 그 파일을 열지 않고 바로 쓸 수 있도록 같이 저장해둔다. */
var highlightMap = lsGet(LS_HIGHLIGHTS, {});
function highlightKey(bookNum, chapter, verse){ return pad2(bookNum)+"_"+chapter+"_"+verse; }
function isHighlighted(bookNum, chapter, verse){ return !!highlightMap[highlightKey(bookNum,chapter,verse)]; }
function toggleHighlight(bookNum, chapter, verse, text){
  var k = highlightKey(bookNum,chapter,verse);
  var nowOn;
  if(highlightMap[k]){ delete highlightMap[k]; nowOn = false; }
  else { highlightMap[k] = {book:bookNum, chapter:chapter, verse:verse, text:text, note:"", ts:Date.now()}; nowOn = true; }
  lsSet(LS_HIGHLIGHTS, highlightMap);
  return nowOn;
}
/* 하이라이트한 구절에 묵상 메모를 붙인다. 하이라이트가 이미 있을 때만 반영된다
   (highlightMap[k]를 직접 고쳐서, 모아보기 화면에 이미 떠 있는 같은 객체에도 바로 반영됨). */
function setHighlightNote(bookNum, chapter, verse, note){
  var k = highlightKey(bookNum,chapter,verse);
  if(!highlightMap[k]) return false;
  highlightMap[k].note = note;
  lsSet(LS_HIGHLIGHTS, highlightMap);
  return true;
}
/* 복사할 때 구절 본문 뒤에 메모가 있으면 같이 붙여준다 */
function formatHighlightForCopy(h){
  var s = refLabel(h.book, h.chapter, h.verse) + " " + h.text;
  if(h.note && h.note.trim()) s += "\n📝 " + h.note.trim();
  return s;
}
/* 성경읽기 화면에서 여러 구절을 골라 "선택 복사"할 때 쓰는 형식: 절 표시 없이 본문만
   이어붙이고(연속이 아니라 몇 절을 건너뛴 곳은 "…"로 표시), 맨 끝에 괄호로 책·장:절 목록과
   버전만 한 번 적는다. 예) "...죽으셨도다 …우리가 아직 죄인...확증하셨느니라 (로마서 5:6,8,10 개역개정)"
   items는 chapterHighlights()의 결과라 항상 같은 책·장 안에서 절 순서대로 정렬돼 있다. */
function formatSelectionForCopy(items){
  if(!items.length) return "";
  var body = "";
  for(var i=0;i<items.length;i++){
    if(i>0) body += (items[i].verse === items[i-1].verse + 1) ? " " : " …";
    body += items[i].text;
  }
  var book = bookByNum(items[0].book);
  var verseList = items.map(function(h){ return h.verse; }).join(",");
  var versionInfo = state.lfaFiles && state.lfaFiles[state.version];
  var versionLabel = versionInfo ? labelForFile(versionInfo.displayName) : state.version;
  return body + " (" + (book ? book.ko : items[0].book) + " " + items[0].chapter + ":" + verseList + " " + versionLabel + ")";
}
function allHighlights(){
  return Object.keys(highlightMap).map(function(k){ return highlightMap[k]; }).sort(function(a,b){
    if(a.book !== b.book) return a.book - b.book;
    if(a.chapter !== b.chapter) return a.chapter - b.chapter;
    return a.verse - b.verse;
  });
}
/* 지금 읽고 있는 장에서 선택(하이라이트)된 구절만 모음 — 연속이든, 몇 절을 걸러서
   선택했든 상관없이 절 순서대로 반환한다. 한꺼번에 복사하기 기능에 쓰인다. */
function chapterHighlights(bookNum, chapter){
  return allHighlights().filter(function(h){ return h.book === bookNum && h.chapter === chapter; });
}
function refLabel(bookNum, chapter, verse){
  var b = bookByNum(bookNum);
  return (b ? b.ko : bookNum) + " " + chapter + "장 " + verse + "절";
}

/* ---------- 본문 글자 크기(노안 등으로 큰 글씨가 필요한 경우) ---------- */

/* ---------- 내 자료 백업 / 가져오기 ---------- */
/* localStorage에 이 앱이 저장해둔 것(bible_ 로 시작하는 키: 읽음 기록, 하이라이트,
   메모, 글자 크기 등)을 전부 모아 파일 하나로 내보내고, 다른 기기에서 그 파일로
   다시 불러올 수 있게 한다. 서버가 없는 앱이라 기기를 바꾸면 그동안의 기록이
   사라지는데, 이 백업 파일 하나면 그대로 옮길 수 있다. */
function exportUserData(){
  var data = {};
  for(var i=0;i<localStorage.length;i++){
    var k = localStorage.key(i);
    if(k && k.indexOf("bible_") === 0) data[k] = localStorage.getItem(k);
  }
  var payload = {app:"말씀나눔 성경읽기", exportedAt:new Date().toISOString(), data:data};
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var today = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = "성경읽기_백업_" + today + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function importUserDataFromFile(file){
  return file.text().then(function(text){
    var parsed;
    try{ parsed = JSON.parse(text); }catch(e){ throw new Error("invalid-json"); }
    if(!parsed || typeof parsed.data !== "object") throw new Error("invalid-format");
    var count = 0;
    Object.keys(parsed.data).forEach(function(k){
      if(k.indexOf("bible_") === 0){ localStorage.setItem(k, parsed.data[k]); count++; }
    });
    return count;
  });
}

/* ---------- 구절 복사 & 토스트 ---------- */
var $toast = null;
function showToast(msg){
  if(!$toast){
    $toast = el("div",{class:"toast"});
    document.body.appendChild($toast);
  }
  $toast.textContent = msg;
  $toast.classList.add("show");
  clearTimeout($toast._hideTimer);
  $toast._hideTimer = setTimeout(function(){ $toast.classList.remove("show"); }, 1600);
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(function(){ return fallbackCopy(text); });
  }
  return fallbackCopy(text);
}
function fallbackCopy(text){
  try{
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    return Promise.resolve();
  }catch(e){ return Promise.reject(e); }
}

function renderVerseCardCanvas(h){

  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext("2d");
  var grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, "#7c2f3d");
  grad.addColorStop(1, "#3d1620");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = "center";
  ctx.fillStyle = "#f4c948";
  ctx.font = "600 34px sans-serif";
  ctx.fillText(refLabel(h.book, h.chapter, h.verse), W/2, 150);

  ctx.fillStyle = "#fff9ef";
  ctx.font = "500 46px serif";
  var maxWidth = W - 160;
  var words = String(h.text).split(/\s+/);
  var lines = [];
  var cur = "";
  words.forEach(function(w){
    var test = cur ? cur + " " + w : w;
    if(ctx.measureText(test).width > maxWidth && cur){ lines.push(cur); cur = w; }
    else cur = test;
  });
  if(cur) lines.push(cur);
  var lineHeight = 66;
  var startY = H/2 - (lines.length * lineHeight)/2 + lineHeight/2;
  lines.forEach(function(line, i){ ctx.fillText(line, W/2, startY + i*lineHeight); });

  ctx.fillStyle = "rgba(255,255,255,0.65)";
  ctx.font = "400 24px sans-serif";
  ctx.fillText("말씀나눔 성경읽기", W/2, H-70);
  return canvas;
}

  (children||[]).forEach(function(c){ if(c) e.appendChild(typeof c==="string" ? document.createTextNode(c) : c); });

/* 폴더 핸들 기억 방식(File System Access API)은 일부러 쓰지 않는다 — 안드로이드 크롬처럼
   그 방식을 지원하는 브라우저에서도, 앱을 다시 열 때마다 권한이 유지되지 않아서 매번
   "이전 폴더 다시 연결하기" 버튼을 사용자가 직접 눌러야 하는 문제가 있었다(브라우저 보안 정책상
   권한 재요청은 반드시 클릭 안에서만 가능해서, 코드로는 건너뛸 수 없었다). 대신 항상
   <input webkitdirectory>로 연결하고 기기(IndexedDB)에 캐시해두는 방식만 쓰면, 다음부터는
   버튼 없이 완전히 자동으로(조용히) 다시 열린다. */
var supportsFSAccess = false;

function labelForFile(filenameNoExt){
  var lower = filenameNoExt.toLowerCase();
  if(labelMap[lower]) return labelMap[lower];
  if(KNOWN_LABELS[lower]) return KNOWN_LABELS[lower];
  return filenameNoExt;
}
/* 버전을 목록에 늘어놓을 때, 한글 성경(한글로 표시되는 것)을 영어 성경보다 앞에 오도록
   정렬한다 — 영어보다 한글로 읽고 대조하는 일이 많다는 요청에 따른 것. */
function isKoreanLabel(label){
  return /[ㄱ-ㆎ가-힣]/.test(label);
}
function versionKeyCompare(a, b){
  var la = state.lfaFiles[a] ? labelForFile(state.lfaFiles[a].displayName) : a;
  var lb = state.lfaFiles[b] ? labelForFile(state.lfaFiles[b].displayName) : b;
  var ka = isKoreanLabel(la) ? 0 : 1, kb = isKoreanLabel(lb) ? 0 : 1;
  if(ka !== kb) return ka - kb;
  return la.localeCompare(lb, "ko");
}

function indexFilesFromList(fileList){
  /* fileList: array of {name, relPath, file} or {name, relPath, handle} where relPath is like
     "bible/korhrv.lfa" or "bible/mp3/01_1.mp3" — 실제로는 mp3 폴더 밑에 버전별 하위 폴더
     (예: mp3/kornkrv_hs/01_1.mp3)가 하나 더 있을 수 있어서, "mp3" 다음에 몇 단계가 더 있든
     마지막 항목(파일명)만 보고 매칭한다. mp3 항목은 file 대신 handle(FileSystemFileHandle)일
     수 있는데, 이건 scanDirectoryHandle()이 오디오를 미리 안 읽고 지연 로딩하기 때문이다
     — item.file || item.handle로 둘 다 받아서 getAudioFile()에서 필요할 때 마저 읽는다. */
  var lfa = {}, mp3 = {};
  fileList.forEach(function(item){
    var rel = item.relPath.replace(/\\/g,"/");
    var parts = rel.split("/").filter(Boolean);
    /* 루트 폴더명을 제거: 첫 세그먼트가 폴더명이면 스킵 */
    if(parts.length >= 2){
      var inner = parts.slice(1); /* remove top folder name */
      if(inner.length === 1){
        var fname = inner[0];
        if(/\.lfa$/i.test(fname)){
          var key = fname.replace(/\.lfa$/i,"");
          if(!(key.toLowerCase() in lfa)) lfa[key.toLowerCase()] = {displayName:key, file:item.file};
        }
      } else if(inner.length >= 2 && /^mp3$/i.test(inner[0])){
        var mfname = inner[inner.length-1];
        if(/\.mp3$/i.test(mfname)) mp3[mfname.toLowerCase()] = item.file || item.handle;
      }
    }
  });
  return {lfa:lfa, mp3:mp3};
}

async function scanDirectoryHandle(dirHandle){
  /* mp3(오디오) 폴더 안의 파일들은 여기서 절대 entry.getFile()을 호출하지 않는다 —
     수백~천 개가 넘는 오디오 파일을 하나하나 다 읽으면(특히 모바일 SAF에서) 폴더를
     다시 연결할 때마다 30초~1분씩 걸릴 수 있다. 대신 핸들만 기억해두고, 실제로 그
     장을 열 때 getAudioFile()에서 그 파일 하나만 그때그때 읽는다(지연 로딩). */
  var files = [];
  async function walk(handle, path, insideMp3){
    for await (var entry of handle.values()){
      var entryPath = path + "/" + entry.name;
      if(entry.kind === "file"){
        if(insideMp3){
          if(/\.mp3$/i.test(entry.name)) files.push({name:entry.name, relPath:entryPath, handle:entry});
        } else {
          var f = await entry.getFile();
          files.push({name:entry.name, relPath:entryPath, file:f});
        }
      } else if(entry.kind === "directory"){
        await walk(entry, entryPath, insideMp3 || /^mp3$/i.test(entry.name));
      }
    }
  }
  await walk(dirHandle, dirHandle.name, false);
  return files;
}

function scanFileInputList(fileListRaw){
  var files = [];
  for(var i=0;i<fileListRaw.length;i++){
    var f = fileListRaw[i];
    var rel = f.webkitRelativePath || f.name;
    files.push({name:f.name, relPath:rel, file:f});
  }
  return files;
}

/* IndexedDB: dirHandle(FS Access API 지원 브라우저용) 저장소 + files/meta(그 외 브라우저의
   <input webkitdirectory> 방식용 — 선택한 파일을 통째로 기기에 저장해두고 다음부터는
   폴더를 다시 고르지 않고 그 캐시로 바로 연결한다) 저장소 */
var IDB_NAME = "bible_app_db", IDB_VERSION = 2;
var IDB_STORE = "handles";
var IDB_FILES_STORE = "files";
var IDB_META_STORE = "meta";
/* 연결을 매번 새로 열지 않고 재사용한다 — 안드로이드 등 모바일에서 짧은 시간에
   idbOpen()이 연달아 여러 번 호출되면(장을 넘길 때마다 오디오를 하나씩 불러오므로 흔함)
   연결이 꼬이거나 일시적으로 실패하는 경우가 있었는데, 이게 "오디오가 어떤 때는 보이고
   어떤 때는 안 보이는" 문제의 원인 중 하나였다. 연결을 캐시해 재사용하고, 끊기면(onclose/
   onversionchange) 캐시를 비워서 다음 호출이 새로 연다. */
var _idbConnPromise = null;
function idbOpen(){
  if(_idbConnPromise) return _idbConnPromise;
  _idbConnPromise = new Promise(function(resolve, reject){
    try{
      var req = indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded = function(){
        var db = req.result;
        if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        if(!db.objectStoreNames.contains(IDB_FILES_STORE)) db.createObjectStore(IDB_FILES_STORE);
        if(!db.objectStoreNames.contains(IDB_META_STORE)) db.createObjectStore(IDB_META_STORE);
      };
      req.onsuccess = function(){
        var db = req.result;
        db.onclose = function(){ if(_idbConnPromise === reqPromiseRef) _idbConnPromise = null; };
        db.onversionchange = function(){ try{ db.close(); }catch(e){} if(_idbConnPromise === reqPromiseRef) _idbConnPromise = null; };
        resolve(db);
      };
      req.onerror = function(){ _idbConnPromise = null; reject(req.error); };
    }catch(e){ _idbConnPromise = null; reject(e); }
  });
  var reqPromiseRef = _idbConnPromise;
  return _idbConnPromise;
}
function idbSet(key, val, storeName){
  storeName = storeName || IDB_STORE;
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(storeName,"readwrite");
        tx.objectStore(storeName).put(val, key);
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ resolve(false); };
      }catch(e){ resolve(false); }
    });
  }).catch(function(){ return false; });
}
/* 모바일에서는 IndexedDB 접근이 아주 가끔 일시적으로 실패할 수 있어서(특히 앱을
   백그라운드에 뒀다가 다시 열었을 때), 실패("오류")와 "정말 그 데이터가 없음"을
   구분해 오류일 때만 연결을 새로 열어 짧게 재시도한다. */
function idbGet(key, storeName, _retriesLeft){
  storeName = storeName || IDB_STORE;
  if(_retriesLeft === undefined) _retriesLeft = 2;
  var FAIL = {};
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(storeName,"readonly");
        var getReq = tx.objectStore(storeName).get(key);
        getReq.onsuccess = function(){ resolve(getReq.result != null ? getReq.result : null); };
        getReq.onerror = function(){ resolve(FAIL); };
        tx.onerror = function(){ resolve(FAIL); };
        tx.onabort = function(){ resolve(FAIL); };
      }catch(e){ resolve(FAIL); }
    });
  }).catch(function(){ return FAIL; }).then(function(result){
    if(result === FAIL){
      if(_retriesLeft > 0){
        _idbConnPromise = null;
        return new Promise(function(r){ setTimeout(r, 200); }).then(function(){
          return idbGet(key, storeName, _retriesLeft - 1);
        });
      }
      return null;
    }
    return result;
  });
}
function idbGetAll(storeName){
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(storeName,"readonly");
        var req = tx.objectStore(storeName).getAll();
        req.onsuccess = function(){ resolve(req.result || []); };
        req.onerror = function(){ resolve([]); };
      }catch(e){ resolve([]); }
    });
  }).catch(function(){ return []; });
}
function idbGetAllKeys(storeName, _retriesLeft){
  /* getAll()과 달리 파일(Blob) 내용을 읽지 않고 키 목록만 빠르게 가져온다 —
     오디오처럼 용량이 큰 파일이 많을 때 getAll()을 쓰면 수 분씩 걸릴 수 있어서
     "폴더가 연결되어 있는지" 확인할 때는 반드시 이 함수를 써야 한다. */
  if(_retriesLeft === undefined) _retriesLeft = 2;
  var FAIL = {};
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(storeName,"readonly");
        var req = tx.objectStore(storeName).getAllKeys();
        req.onsuccess = function(){ resolve(req.result || []); };
        req.onerror = function(){ resolve(FAIL); };
        tx.onerror = function(){ resolve(FAIL); };
        tx.onabort = function(){ resolve(FAIL); };
      }catch(e){ resolve(FAIL); }
    });
  }).catch(function(){ return FAIL; }).then(function(result){
    if(result === FAIL){
      if(_retriesLeft > 0){
        _idbConnPromise = null;
        return new Promise(function(r){ setTimeout(r, 200); }).then(function(){
          return idbGetAllKeys(storeName, _retriesLeft - 1);
        });
      }
      return [];
    }
    return result;
  });
}
function idbClearStore(storeName){
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(storeName,"readwrite");
        tx.objectStore(storeName).clear();
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ resolve(false); };
      }catch(e){ resolve(false); }
    });
  }).catch(function(){ return false; });
}
/* 선택한 파일들(성경 데이터 + MP3)을 통째로 기기에 저장 — <input webkitdirectory> 방식(폴더
   핸들을 기억할 수 없는 브라우저)에서도 다음부터 다시 고를 필요 없이 자동으로 열리게 해준다 */
function cacheFilesToIDB(rawFiles){
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(IDB_FILES_STORE, "readwrite");
        var store = tx.objectStore(IDB_FILES_STORE);
        store.clear();
        rawFiles.forEach(function(item){ store.put(item, item.relPath); });
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ resolve(false); };
      }catch(e){ resolve(false); }
    });
  }).catch(function(){ return false; });
}

function connectViaInput(){
  return new Promise(function(resolve, reject){
    var input = document.createElement("input");
    input.type = "file";
    input.webkitdirectory = true;
    input.directory = true;
    input.multiple = true;
    input.style.display = "none";
    document.body.appendChild(input);
    input.addEventListener("change", function(){
      if(input.files && input.files.length){
        resolve(scanFileInputList(input.files));
      } else {
        reject(new Error("no-selection"));
      }
      document.body.removeChild(input);
    });
    input.click();
  });
}

/* 브라우저 권한 재확인(requestPermission)은 반드시 사용자의 클릭(제스처) 안에서 호출해야 통과된다.
   그래서 부팅 시점에는 조용히 확인만(queryPermission) 하고, 권한이 사라졌으면
   "다시 연결하기" 버튼을 눌렀을 때 같은 폴더 핸들로 재요청한다 (새로 폴더를 고를 필요 없음).
   폴더 핸들 자체를 지원하지 않는 브라우저(대부분의 안드로이드/아이폰 브라우저)는
   처음 연결할 때 파일을 통째로 기기(IndexedDB)에 저장해두고, 그 캐시로 자동 복원한다. */
async function tryRestoreFromFileCache(){
  /* 오디오 파일까지 전부 getAll()로 읽어오면(수백 MB~1GB) 실제로 화면이 뜨기까지
     몇 분씩 걸릴 수 있다. 그래서 여기서는 "어떤 파일이 있는지" 목록(getAllKeys, 아주 빠름)만
     확인하고, 용량이 작은 성경 본문(.lfa)만 미리 읽어온 뒤, 오디오(mp3)는 실제로 그 장을
     열 때 그때그때 하나씩 불러온다(state.mp3LazyIndex + getAudioFile 참고). */
  try{
    var cachedAt = await idbGet("filesCachedAt", IDB_META_STORE);
    if(!cachedAt) return {status:"none"};
    var keys = await idbGetAllKeys(IDB_FILES_STORE);
    if(!keys || !keys.length) return {status:"none"};
    var lfaRawFiles = [];
    var mp3LazyIndex = {};
    for(var i=0;i<keys.length;i++){
      var relPath = String(keys[i]).replace(/\\/g,"/");
      var parts = relPath.split("/").filter(Boolean);
      if(parts.length < 2) continue;
      var inner = parts.slice(1);
      if(inner.length === 1 && /\.lfa$/i.test(inner[0])){
        var item = await idbGet(keys[i], IDB_FILES_STORE);
        if(item) lfaRawFiles.push(item);
      } else if(inner.length >= 2 && /^mp3$/i.test(inner[0])){
        var mfname2 = inner[inner.length-1];
        if(/\.mp3$/i.test(mfname2)) mp3LazyIndex[mfname2.toLowerCase()] = keys[i];
      }
    }
    if(!lfaRawFiles.length) return {status:"none"};
    return {status:"granted-cached", lfaRawFiles:lfaRawFiles, mp3LazyIndex:mp3LazyIndex};
  }catch(e){ return {status:"none"}; }
}

async function silentRestoreConnection(){
  if(!supportsFSAccess) return await tryRestoreFromFileCache();
  try{
    var handle = await idbGet("dirHandle");
    if(!handle) return await tryRestoreFromFileCache();
    var perm = await handle.queryPermission({mode:"read"});
    if(perm === "granted"){
      var files = await scanDirectoryHandle(handle);
      return {status:"granted", files:files};
    }
    return {status:"needs-permission", handle:handle};
  }catch(e){ return await tryRestoreFromFileCache(); }
}

async function reRequestPermission(handle){
  var perm = await handle.requestPermission({mode:"read"});
  if(perm !== "granted") throw new Error("permission-denied");
  return await scanDirectoryHandle(handle);
}

async function clearSavedConnection(){
  try{ await idbSet("dirHandle", null); }catch(e){}
  await idbClearStore(IDB_FILES_STORE);
  await idbClearStore(IDB_META_STORE);
}

function applyScannedFiles(rawFiles){

  state.connected = Object.keys(idx.lfa).length > 0;
  return state.connected;
}

function applyCachedFiles(lfaRawFiles, mp3LazyIndex){
  var idx = indexFilesFromList(lfaRawFiles); /* lfaRawFiles엔 .lfa만 들어있음 */
  state.lfaFiles = idx.lfa;
  state.mp3Files = {}; /* 실제로 그 장을 열 때 getAudioFile()이 채워 넣음 */
  state.mp3LazyIndex = mp3LazyIndex || {};
  state.connected = Object.keys(idx.lfa).length > 0;
  return state.connected;
}

/* ---------- 성경 데이터 파싱 (JSZip) ---------- */
async function getZip(versionKey){
  if(state.zipCache[versionKey]) return state.zipCache[versionKey];
  var entry = state.lfaFiles[versionKey];
  if(!entry) throw new Error("version-not-found");
  var buf = await entry.file.arrayBuffer();
  var zip = await JSZip.loadAsync(buf);
  state.zipCache[versionKey] = zip;
  return zip;
}

var LFB_RE = /^\S+\s+(\d+):(\d+)\s+(.*)$/;

function findChapterEntry(zip, bookCode, chapter){
  var suffix = bookCode + "_" + chapter + ".lfb";
  var names = Object.keys(zip.files);
  for(var i=0;i<names.length;i++){
    if(names[i].toLowerCase().endsWith(suffix.toLowerCase())) return zip.files[names[i]];
  }
  return null;
}

async function getChapterVerses(versionKey, bookNum, chapter){
  var cacheKey = versionKey+"|"+bookNum+"|"+chapter;
  if(state.chapterCache[cacheKey]) return state.chapterCache[cacheKey];
  var zip = await getZip(versionKey);
  var book = bookByNum(bookNum);
  var entry = findChapterEntry(zip, book.code, chapter);
  if(!entry) return null;
  var text = await entry.async("text");
  var lines = text.split(/\r?\n/);
  var verses = [];
  lines.forEach(function(line){
    if(!line.trim()) return;
    var m = LFB_RE.exec(line.trim());
    if(m) verses.push({v:Number(m[2]), text:m[3].replace(/^"|"$/g,"").trim()});
  });
  verses.sort(function(a,b){ return a.v-b.v; });
  state.chapterCache[cacheKey] = verses;
  return verses;
}

async function getChapterCount(versionKey, bookNum){
  var cacheKey = versionKey+"|"+bookNum;
  if(state.chapterCounts[cacheKey]) return state.chapterCounts[cacheKey];
  var zip = await getZip(versionKey);
  var book = bookByNum(bookNum);
  var re = new RegExp(book.code + "_(\\d+)\\.lfb$", "i");
  var max = 0;
  Object.keys(zip.files).forEach(function(name){
    var m = re.exec(name);
    if(m) max = Math.max(max, Number(m[1]));
  });
  state.chapterCounts[cacheKey] = max;
  return max;
}

/* ---------- 본문 전체 검색 ---------- */
/* 지금 보고 있는 버전 전체(66권)를 훑어서 검색용 색인을 한 번만 만들어 둔다(버전별로
   캐시). 이미 zip은 메모리에 있으니 각 장의 텍스트를 순서대로 꺼내 배열에 쌓기만 하면
   되고, 네트워크가 없으니 첫 검색 한 번만 조금 걸리고 그 다음부터는 즉시 검색된다. */
async function buildSearchIndex(versionKey){
  if(!state.searchIndex) state.searchIndex = {};
  if(state.searchIndex[versionKey]) return state.searchIndex[versionKey];
  var idx = [];
  for(var i=0;i<BOOKS.length;i++){
    var b = BOOKS[i];
    var total = await getChapterCount(versionKey, b.n);
    for(var c=1;c<=total;c++){
      var verses = await getChapterVerses(versionKey, b.n, c);
      if(verses){
        verses.forEach(function(v){ idx.push({book:b.n, chapter:c, verse:v.v, text:v.text}); });
      }
    }
  }
  state.searchIndex[versionKey] = idx;
  return idx;
}
function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function highlightMatchHtml(text, q){
  var esc = escapeHtml(text);
  var escQ = escapeHtml(q);
  if(!escQ) return esc;
  var idx = esc.indexOf(escQ);
  if(idx === -1) return esc;
  return esc.slice(0,idx) + "<mark>" + esc.slice(idx, idx+escQ.length) + "</mark>" + esc.slice(idx+escQ.length);
}

async function getAudioFile(bookNum, chapter){
  /* 오디오 파일명 규칙: 책번호_장번호.mp3. 책번호는 항상 2자리(01~66)지만, 장번호는
     실제 자료를 보면 0으로 채우지 않은 경우(01_1.mp3, 01_9.mp3)와 채운 경우(01_01.mp3)가
     둘 다 있을 수 있어서 두 가지 다 시도한다. */
  var keyPlain = pad2(bookNum) + "_" + chapter + ".mp3";
  var keyPadded = pad2(bookNum) + "_" + pad2(chapter) + ".mp3";
  var keys = keyPlain === keyPadded ? [keyPlain] : [keyPlain, keyPadded];
  for(var i=0;i<keys.length;i++){
    var raw = state.mp3Files[keys[i]];
    if(raw){
      /* 폴더를 직접 연결한 경우(FS Access API) mp3Files 안에는 아직 안 읽은
         FileSystemFileHandle이 들어있을 수 있다 — 이 장을 열 때 딱 하나만 여기서 읽는다 */
      if(typeof raw.getFile === "function"){
        try{
          var resolved = await raw.getFile();
          state.mp3Files[keys[i]] = resolved;
          return resolved;
        }catch(e){ /* 무시하고 다음 key 시도 */ }
      } else {
        return raw;
      }
    }
  }
  /* 캐시로 복원된 경우: 실제 오디오 데이터는 이 순간에 딱 하나만 IndexedDB에서 읽어온다
     (부팅할 때 전부 미리 읽지 않으므로 앱이 바로 켜진다) */
  for(var j=0;j<keys.length;j++){
    var key = keys[j];
    if(state.mp3LazyIndex && state.mp3LazyIndex[key]){
      try{
        var item = await idbGet(state.mp3LazyIndex[key], IDB_FILES_STORE);
        if(item && item.file){
          state.mp3Files[key] = item.file;
          return item.file;
        }
      }catch(e){ /* 무시 */ }
    }
  }
  return null;
}

async function onConnectClick(){
  var errBox = document.getElementById("connectError");
  errBox.style.display = "none";
  try{
    var files;
    var usedInput = false;
    if(supportsFSAccess){
      try{ files = await connectViaPicker(); }
      catch(e){
        if(e && e.name === "AbortError") return;
        files = await connectViaInput();
        usedInput = true;
      }
    } else {
      files = await connectViaInput();
      usedInput = true;
    }
    var ok = applyScannedFiles(files);
    if(!ok){
      errBox.textContent = "bible 폴더 안에서 .lfa 파일을 찾지 못했어요. 폴더 구조를 확인해주세요.";
      errBox.style.display = "block";
      return;
    }
    state._pendingReconnectHandle = null;
    updateHeaderForConnected();
    goLetters();
    if(usedInput) cacheFilesInBackground(files);
  }catch(e){
    if(e && e.message === "no-selection") return;
    errBox.textContent = "폴더를 연결하는 중 문제가 발생했어요: " + (e && e.message ? e.message : e);
    errBox.style.display = "block";
  }
}

/* 폴더 핸들을 기억 못 하는 브라우저용: 선택한 파일을 화면 전환 후 백그라운드로 기기에 저장해서
   다음부터는 폴더를 다시 고르지 않아도 자동으로 열리게 한다. 읽기 시작을 막지 않기 위해
   goLetters() 이후, 읽는 도중에 조용히 진행된다. */
function cacheFilesInBackground(files){
  if($cacheBanner){
    $cacheBanner.style.display = "flex";
    $cacheBanner.querySelector("span").textContent = "💾 다음에도 자동으로 열리도록 저장하는 중… (창을 닫지 말아주세요)";
  }
  cacheFilesToIDB(files).then(function(success){
    if(success){
      idbSet("filesCachedAt", Date.now(), IDB_META_STORE);
      if($cacheBanner){
        $cacheBanner.querySelector("span").textContent = "✅ 저장 완료! 다음부터는 자동으로 열려요.";
        setTimeout(function(){ if($cacheBanner) $cacheBanner.style.display = "none"; }, 3000);
      }
    } else if($cacheBanner){
      $cacheBanner.querySelector("span").textContent = "⚠️ 저장 공간 부족 등으로 자동 연결 저장에 실패했어요. 다음에 열 때 다시 연결해주세요.";
      setTimeout(function(){ if($cacheBanner) $cacheBanner.style.display = "none"; }, 5000);
    }
  });
}

  card.appendChild(el("div",{class:"plan-refs"},[todays.length ? formatPlanChapters(todays) : "오늘 계획된 본문이 없어요"]));

  if(todays.length){

    }

  document.body.appendChild(immersiveBtn);
  state._immersiveBtnEl = immersiveBtn;

  var head = el("div",{class:"row", style:"justify-content:space-between; margin-bottom:10px;"},[
    el("div",{style:"font-weight:700; font-size:16px;"},[book.ko + " " + state.chapter + "장" + (state.targetVerse ? (" " + state.targetVerse + "절") : "")]),
    el("label",{class:"row", style:"font-size:12.5px; color:var(--text-dim); gap:6px; cursor:pointer;"},[
      (function(){
        var cb = el("input",{type:"checkbox"});
        cb.checked = isRead(state.book, state.chapter);
        cb.addEventListener("change", function(){
          markRead(state.book, state.chapter, cb.checked);
        });
        return cb;
      })(),
      "읽음으로 표시"
    ])
  ]);
  wrap.appendChild(head);
  /* 이 장에서 선택(하이라이트)한 구절이 하나라도 있으면 "n개 선택됨 + 한꺼번에 복사" 바를
     보여준다. 연속이든 몇 절 걸러서 선택했든 상관없이 지금까지 표시해둔 구절을 절 순서대로
     모아서 한 번에 복사할 수 있다. 본문 스크롤을 따라가지 않고, 화면 아래(오디오 표시줄·
     이전/다음장 버튼) 바로 위에 항상 떠 있어야 여러 구절을 고르는 동안 위로 다시 스크롤하지
     않고도 언제든 선택 복사를 누를 수 있다 — 그래서 wrap이 아니라 document.body에 붙인다. */
  var selBar = el("div",{class:"selection-bar", style:"display:none;"});
  document.body.appendChild(selBar);
  state._selBarEl = selBar;
  function positionSelBar(){
    var navH = (nav && nav.isConnected) ? nav.offsetHeight : 0;
    var navBottom = (nav && nav.isConnected) ? (parseInt(nav.style.bottom, 10) || 0) : 0;
    selBar.style.bottom = (navBottom + navH) + "px";
  }
  var forBookSel = state.book, forChapterSel = state.chapter;
  function refreshSelBar(){
    var items = chapterHighlights(forBookSel, forChapterSel);
    clear(selBar);
    if(!items.length){ selBar.style.display = "none"; return; }
    selBar.style.display = "flex";
    positionSelBar();
    selBar.appendChild(el("span",{},[items.length + "개 구절 선택됨"]));
    var btnRow = el("div",{class:"row", style:"gap:6px;"});
    btnRow.appendChild(el("button",{class:"btn btn-primary", onclick:function(){
      var combined = formatSelectionForCopy(items);
      copyText(combined).then(function(){ showToast(items.length + "개 구절을 한꺼번에 복사했어요"); });
    }},["📋 선택 복사"]));
    btnRow.appendChild(el("button",{class:"btn btn-ghost", style:"color:var(--danger);", onclick:function(){
      items.forEach(function(h){ toggleHighlight(h.book,h.chapter,h.verse,h.text); });
      verseWrap.querySelectorAll(".verse-row.user-mark").forEach(function(r){
        r.classList.remove("user-mark");
        var cb = r.querySelector(".verse-copy-btn");
        if(cb) cb.style.display = "none";
      });
      refreshSelBar();
    }},["선택 해제"]));
    selBar.appendChild(btnRow);
  }
  refreshSelBar();
  var verseWrap = el("div",{class:"verse-view", id:"verseWrap"},[el("div",{class:"empty-hint"},["불러오는 중…"])]);
  wrap.appendChild(verseWrap);
  $main.appendChild(wrap);

  getChapterVerses(state.version, state.book, state.chapter).then(function(verses){
    clear(verseWrap);
    if(!verses || !verses.length){
      verseWrap.appendChild(el("div",{class:"empty-hint"},["이 버전에는 해당 장 데이터가 없어요."]));
      return;
    }
    verses.forEach(function(v){
      var isTarget = state.targetVerse && v.v === state.targetVerse;
      var marked = isHighlighted(state.book, state.chapter, v.v);
      var row = el("div",{class:"verse-row"+(isTarget?" highlight":"")+(marked?" user-mark":"")});
      row.appendChild(el("div",{class:"verse-num"},[String(v.v)]));
      row.appendChild(el("div",{class:"verse-text"},[v.text]));
      var copyBtn = el("button",{class:"verse-copy-btn", title:"복사", style:marked?"":"display:none;", onclick:function(e){
        e.stopPropagation();
        var h = highlightMap[highlightKey(state.book, state.chapter, v.v)];
        var payload = h ? formatHighlightForCopy(h) : (refLabel(state.book, state.chapter, v.v) + " " + v.text);
        copyText(payload).then(function(){
          showToast("복사됐어요 — 묵상 노트에 붙여넣으세요");
        });
      }},["📋"]);
      row.appendChild(copyBtn);
      var imageBtn = el("button",{class:"verse-copy-btn", title:"이미지로 공유", style:marked?"":"display:none;", onclick:function(e){
        e.stopPropagation();
        var h = highlightMap[highlightKey(state.book, state.chapter, v.v)];
        if(h) shareVerseImage(h);
      }},["🖼️"]);
      row.appendChild(imageBtn);
      row.addEventListener("click", function(){
        var nowOn = toggleHighlight(state.book, state.chapter, v.v, v.text);
        row.classList.toggle("user-mark", nowOn);
        copyBtn.style.display = nowOn ? "" : "none";
        imageBtn.style.display = nowOn ? "" : "none";
        if(nowOn) showToast("하이라이트 표시됨");
        refreshSelBar();
      });
      if(isTarget) row.id = "targetVerseRow";
      verseWrap.appendChild(row);
    });
    /* 장을 읽으면 자동으로 읽음 표시 */
    if(!isRead(state.book, state.chapter)){
      markRead(state.book, state.chapter, true);
      var cb = wrap.querySelector('input[type="checkbox"]');
      if(cb) cb.checked = true;
    }
    if(state.targetVerse){
      var targetEl = document.getElementById("targetVerseRow");
      if(targetEl) targetEl.scrollIntoView({block:"center"});
    }
  });

  /* 하단 바: 이전/다음 장 내비게이션은 바로 그려두고(오디오 유무를 기다리지 않음),
     오디오는 찾아지는 대로(캐시에서 복원된 경우 그 장의 mp3 하나만 방금 불러옴) 붙인다. */
  var nav = el("div",{class:"chapter-nav", style:"bottom:0;"});
  var prevBtn = el("button",{class:"btn", onclick:function(){ gotoRelativeChapter(-1, false); }},["‹ 이전 장"]);
  var nextBtn = el("button",{class:"btn btn-primary", onclick:function(){ gotoRelativeChapter(1, false); }},["다음 장 ›"]);
  nav.appendChild(prevBtn); nav.appendChild(nextBtn);
  document.body.appendChild(nav);
  state._navEl = nav;
  positionSelBar(); /* nav가 이제 생겼으니, 이미 선택된 구절이 있어 선택바가 떠 있다면 위치를 다시 맞춘다 */

  var shouldAutoplay = !!state._pendingAutoplay;
  state._pendingAutoplay = false;
  var forBook = state.book, forChapter = state.chapter;
  getAudioFile(state.book, state.chapter).then(function(audioFile){
    /* 오디오를 찾는 사이에 사용자가 이미 다른 장으로 넘어갔으면 이 결과는 버린다 */
    if(state.book !== forBook || state.chapter !== forChapter) return;
    if(audioFile){
      if(state.audioObjUrl) URL.revokeObjectURL(state.audioObjUrl);
      state.audioObjUrl = URL.createObjectURL(audioFile);
      var bar = el("div",{class:"audio-bar"});
      bar.appendChild(el("span",{style:"font-size:18px;"},["🔊"]));
      var audioAttrs = {controls:"controls", src:state.audioObjUrl};
      if(shouldAutoplay) audioAttrs.autoplay = "autoplay";
      var audio = el("audio", audioAttrs);
      audio.playbackRate = state.audioRate || 1;
      /* 사용자가 재생 속도를 바꾸면(브라우저 기본 컨트롤의 배속 메뉴 등) 다음 장에도 그대로 이어서 적용 */
      audio.addEventListener("ratechange", function(){
        if(audio.playbackRate && audio.playbackRate !== state.audioRate){
          state.audioRate = audio.playbackRate;
          lsSet(LS_AUDIORATE, state.audioRate);
        }
      });
      audio.addEventListener("loadedmetadata", function(){ audio.playbackRate = state.audioRate || 1; });
      audio.addEventListener("ended", function(){ gotoRelativeChapter(1, true); });
      bar.appendChild(audio);
      document.body.appendChild(bar);
      state._audioBarEl = bar;
      nav.style.bottom = "52px";
      positionSelBar();
    } else if(state._audioBarEl){
      state._audioBarEl.remove(); state._audioBarEl = null;
      positionSelBar();
    }
  });
}

async function stepChapter(delta){ return gotoRelativeChapter(delta, false); }

async function gotoRelativeChapter(delta, autoplay){
  var total = await getChapterCount(state.version, state.book);
  var next = state.chapter + delta;
  var targetBook = state.book, targetChapter;
  if(next < 1){
    var prevBookNum = state.book - 1;
    if(prevBookNum < 1) return;
    var prevTotal = await getChapterCount(state.version, prevBookNum);
    targetBook = prevBookNum; targetChapter = prevTotal || 1;
  } else if(next > total){
    var nextBookNum = state.book + 1;
    if(nextBookNum > 66) return;
    targetBook = nextBookNum; targetChapter = 1;
  } else {
    targetChapter = next;
  }
  state._pendingAutoplay = !!autoplay;
  goReading(targetBook, targetChapter);
}

/* 화면 전환시 이전 오디오바/네비 제거 */
var _origRender = render;
render = function(){
  if(state._audioBarEl){ state._audioBarEl.remove(); state._audioBarEl=null; }
  if(state._navEl){ state._navEl.remove(); state._navEl=null; }
  if(state._selBarEl){ state._selBarEl.remove(); state._selBarEl=null; }
  if(state._immersiveBtnEl){ state._immersiveBtnEl.remove(); state._immersiveBtnEl=null; }
  /* "넓게 보기"는 성경읽기 화면에서만 의미가 있다 — 다른 화면(책 목록 등)으로 나가면
     헤더가 다시 보여야 하니 여기서 일단 끄고, renderReading()이 저장된 설정을 보고 다시 켠다. */
  document.body.classList.remove("immersive");
  _origRender();
};

function openHighlightsModal(){
  /* 모아보기 화면에서 "지우기"로 하이라이트를 없애도, 뒤에 이미 그려져 있던 읽기 화면의
     구절 표시(user-mark)는 자동으로 갱신되지 않는다 — 모달을 닫을 때 변경이 있었으면
     읽기 화면을 다시 그려서 반영한다. */
  var changed = false;
  function closeAndSync(){
    backdrop.remove();
    if(changed && state.screen === "reading") render();
  }
  var backdrop = el("div",{class:"modal-backdrop", onclick:function(e){ if(e.target===backdrop) closeAndSync(); }});
  var sheet = el("div",{class:"modal-sheet"});
  sheet.appendChild(el("h3",{},["⭐ 하이라이트 모아보기"]));
  var items = allHighlights();
  if(!items.length){
    sheet.appendChild(el("div",{class:"empty-hint"},["아직 표시한 구절이 없어요. 본문에서 구절을 눌러 하이라이트해보세요."]));
  } else {
    var copyAllBtn = el("button",{class:"btn btn-primary", style:"width:100%; margin-bottom:12px;", onclick:function(){
      var combined = items.map(formatHighlightForCopy).join("\n\n");
      copyText(combined).then(function(){ showToast("전체 " + items.length + "개 구절을 복사했어요"); });
    }},["📋 전체 복사 (" + items.length + "개)"]);
    sheet.appendChild(copyAllBtn);
    var list = el("div",{});
    items.forEach(function(h){
      var item = el("div",{class:"highlight-item"});
      item.appendChild(el("div",{class:"ref"},[refLabel(h.book,h.chapter,h.verse)]));
      item.appendChild(el("div",{class:"txt"},[h.text]));
      var noteInput = el("textarea",{placeholder:"묵상 메모를 적어보세요…"});
      noteInput.value = h.note || "";
      noteInput.addEventListener("change", function(){
        setHighlightNote(h.book, h.chapter, h.verse, noteInput.value);
        showToast("메모를 저장했어요");
      });
      item.appendChild(noteInput);
      var actions = el("div",{class:"actions"});
      actions.appendChild(el("button",{class:"btn", onclick:function(){
        copyText(formatHighlightForCopy(h)).then(function(){ showToast("복사됐어요"); });
      }},["복사"]));
      actions.appendChild(el("button",{class:"btn", onclick:function(){ shareVerseImage(h); }},["이미지 공유"]));
      actions.appendChild(el("button",{class:"btn", onclick:function(){
        goReading(h.book, h.chapter, h.verse);
        backdrop.remove();
      }},["본문 보기"]));
      actions.appendChild(el("button",{class:"btn btn-ghost", style:"color:var(--danger);", onclick:function(){
        toggleHighlight(h.book, h.chapter, h.verse, h.text);
        changed = true;
        item.remove();
        showToast("하이라이트를 지웠어요");
      }},["지우기"]));
      item.appendChild(actions);
      list.appendChild(item);
    });
    sheet.appendChild(list);
  }
  var closeBtn2 = el("button",{class:"btn btn-ghost", style:"margin-top:6px; width:100%;", onclick:closeAndSync},["닫기"]);
  sheet.appendChild(closeBtn2);
  backdrop.appendChild(sheet);
  document.body.appendChild(backdrop);
}

/* ---------- 본문 검색 모달 ---------- */
function openSearchModal(){
  var backdrop = el("div",{class:"modal-backdrop", onclick:function(e){ if(e.target===backdrop) backdrop.remove(); }});
  var sheet = el("div",{class:"modal-sheet"});
  sheet.appendChild(el("h3",{},["🔍 본문 검색"]));
  var input = el("input",{class:"rename-input", type:"search", placeholder:"찾을 단어를 입력하세요…"});
  sheet.appendChild(input);

  /* ---------- 검색 범위(구약/신약/직접 지정) ----------
     "은혜"처럼 흔한 단어를 검색하면 창세기부터 요한계시록까지 다 나와서, 원하는 범위(신약만,
     또는 요한복음~사도행전처럼 몇 권만)로 좁혀서 찾을 수 있게 한다. 마지막으로 고른 범위는
     다음에 검색할 때도 그대로 유지한다. */
  var range = lsGet(LS_SEARCHRANGE, {from:1, to:66});
  if(!(range.from>=1 && range.from<=66)) range.from = 1;
  if(!(range.to>=1 && range.to<=66)) range.to = 66;
  if(range.from > range.to) range.to = range.from;
  sheet.appendChild(el("div",{class:"search-range-label"},["검색 범위"]));
  var chipsRow = el("div",{class:"search-range-chips"});
  var PRESETS = [{label:"전체", from:1, to:66}, {label:"구약", from:1, to:39}, {label:"신약", from:40, to:66}];
  var chipEls = PRESETS.map(function(p){
    var chip = el("button",{class:"chip", type:"button", onclick:function(){
      range.from = p.from; range.to = p.to;
      applyRangeToSelects();
      saveRangeAndMaybeSearch();
    }},[p.label]);
    chipsRow.appendChild(chip);
    return chip;
  });
  sheet.appendChild(chipsRow);
  var selectRow = el("div",{class:"search-range-select-row"});
  var fromSelect = el("select",{});
  var toSelect = el("select",{});
  BOOKS.forEach(function(b){
    fromSelect.appendChild(el("option",{value:String(b.n)},[b.ko]));
    toSelect.appendChild(el("option",{value:String(b.n)},[b.ko]));
  });
  selectRow.appendChild(fromSelect);
  selectRow.appendChild(el("span",{class:"tilde"},["~"]));
  selectRow.appendChild(toSelect);
  sheet.appendChild(selectRow);
  function applyRangeToSelects(){
    fromSelect.value = String(range.from);
    toSelect.value = String(range.to);
    chipEls.forEach(function(chip, i){
      chip.classList.toggle("active", PRESETS[i].from===range.from && PRESETS[i].to===range.to);
    });
  }
  function saveRangeAndMaybeSearch(){
    lsSet(LS_SEARCHRANGE, range);
    if(input.value.trim()) runSearch();
  }
  fromSelect.addEventListener("change", function(){
    range.from = Number(fromSelect.value);
    if(range.from > range.to){ range.to = range.from; }
    applyRangeToSelects();
    saveRangeAndMaybeSearch();
  });
  toSelect.addEventListener("change", function(){
    range.to = Number(toSelect.value);
    if(range.to < range.from){ range.from = range.to; }
    applyRangeToSelects();
    saveRangeAndMaybeSearch();
  });
  applyRangeToSelects();

  var status = el("div",{class:"empty-hint"},["검색어를 입력해 보세요."]);
  sheet.appendChild(status);
  var resultsWrap = el("div",{});
  sheet.appendChild(resultsWrap);
  var closeBtn = el("button",{class:"btn btn-ghost", style:"margin-top:10px; width:100%;", onclick:function(){ backdrop.remove(); }},["닫기"]);
  sheet.appendChild(closeBtn);
  backdrop.appendChild(sheet);
  document.body.appendChild(backdrop);
  input.focus();

  function rangeLabel(){
    if(range.from===1 && range.to===66) return "";
    if(range.from===1 && range.to===39) return "구약";
    if(range.from===40 && range.to===66) return "신약";
    var fb = bookByNum(range.from), tb = bookByNum(range.to);
    return (fb?fb.ko:"") + (range.from===range.to ? "" : ("~" + (tb?tb.ko:"")));
  }

  var debounceTimer = null;
  var searchSeq = 0;
  input.addEventListener("input", function(){
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runSearch, 250);
  });

  function runSearch(){
    var q = input.value.trim();
    var mySeq = ++searchSeq;
    clear(resultsWrap);
    if(!q){ status.style.display = ""; status.textContent = "검색어를 입력해 보세요."; return; }
    status.style.display = "";
    status.textContent = "검색 중…";
    var rl = rangeLabel();
    buildSearchIndex(state.version).then(function(idx){
      if(mySeq !== searchSeq) return; /* 검색어가 바뀌는 사이에 끝난 이전 검색 결과는 버린다 */
      var matches = idx.filter(function(e){
        return e.book >= range.from && e.book <= range.to && e.text.indexOf(q) !== -1;
      }).slice(0,200);
      clear(resultsWrap);
      var scopeSuffix = rl ? (" (" + rl + " 범위)") : "";
      if(!matches.length){ status.textContent = "\"" + q + "\" 을(를) 찾지 못했어요" + scopeSuffix + "."; return; }
      status.textContent = matches.length + "개 찾음" + scopeSuffix + (matches.length===200 ? " (처음 200개만 표시)" : "");
      matches.forEach(function(m){
        var row = el("div",{class:"highlight-item", style:"cursor:pointer;", onclick:function(){
          goReading(m.book, m.chapter, m.verse);
          backdrop.remove();
        }});
        row.appendChild(el("div",{class:"ref"},[refLabel(m.book,m.chapter,m.verse)]));
        row.appendChild(el("div",{class:"txt", html:highlightMatchHtml(m.text, q)}));
        resultsWrap.appendChild(row);
      });
    });
  }
}

/* ---------- 새 버전 확인 (재설치 없이 업데이트) ---------- */
var CURRENT_BUILD = (document.querySelector('meta[name="app-build"]') || {}).content || "";
var $updateBanner = document.getElementById("updateBanner");
var $updateBtn = document.getElementById("updateBtn");
var _updateShown = false;

function checkForUpdate(){
  if(_updateShown || !CURRENT_BUILD) return;
  fetch(location.href, {cache:"no-store"}).then(function(res){
    if(!res.ok) return null;
    return res.text();
  }).then(function(html){
    if(!html) return;
    var m = /<meta name="app-build" content="([^"]*)">/.exec(html);
    if(m && m[1] && m[1] !== CURRENT_BUILD){
      _updateShown = true;
      $updateBanner.style.display = "flex";
    }
  }).catch(function(){ /* 오프라인이거나 네트워크 문제면 조용히 무시 */ });
}
if($updateBtn) $updateBtn.addEventListener("click", function(){
  $updateBtn.disabled = true;
  $updateBtn.textContent = "업데이트 중…";
  location.reload();
});
/* 앱을 열었을 때, 그리고 백그라운드에 있다가 다시 돌아왔을 때 확인 */
setTimeout(checkForUpdate, 2500);
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible") checkForUpdate();
});
setInterval(checkForUpdate, 15 * 60 * 1000);

/* ---------- 부트스트랩 ---------- */
renderInappBanner();
if(!ENV.isInApp && !ENV.isStandalone && ENV.isIOS && $installBtn){
  /* iOS Safari는 beforeinstallprompt 이벤트가 없어 안내 버튼을 항상 보여줌 */
  $installBtn.style.display = "inline-flex";
}
if(!ENV.isInApp && !ENV.isStandalone && ENV.isAndroid && $installBtn){
  /* 안드로이드 Chrome은 beforeinstallprompt가 늦게(혹은 안) 뜰 수 있어, 잠시 기다렸다가
     이벤트가 없으면 수동 설치 안내 버튼을 대신 보여줌 */
  setTimeout(function(){
    if(!deferredInstallPrompt && $installBtn.style.display === "none"){
      $installBtn.style.display = "inline-flex";
    }
  }, 3000);
}

(async function boot(){
  var result = await silentRestoreConnection();
  if(result.status === "granted"){
    var ok = applyScannedFiles(result.files);
    if(ok){
      updateHeaderForConnected();
      var last = lsGet(LS_LASTPOS, null);
      if(last && last.book){ state.version = last.version && state.lfaFiles[last.version] ? last.version : state.version; }
      goLetters();
      return;
    }
  } else if(result.status === "granted-cached"){
    /* 기기에 저장해둔 캐시로 복원(오디오는 아직 안 읽었고, 그 장을 열 때 하나씩 읽어옴) */
    var ok2 = applyCachedFiles(result.lfaRawFiles, result.mp3LazyIndex);
    if(ok2){
      updateHeaderForConnected();
      var last2 = lsGet(LS_LASTPOS, null);
      if(last2 && last2.book){ state.version = last2.version && state.lfaFiles[last2.version] ? last2.version : state.version; }
      goLetters();
      return;
    }
  } else if(result.status === "needs-permission"){
    /* 이전에 연결한 폴더가 있지만, 권한을 다시 확인해야 함 — 사용자의 클릭이 있어야 재요청 가능 */
    state._pendingReconnectHandle = result.handle;
  }
  goConnectScreen();
})();

})();
</script>
